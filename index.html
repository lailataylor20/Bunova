<style>
/* Bunova: calm teal/ink palette, restrained rose used only for the wordmark and highlights */
:root{
  --bg:#f7f9fb; --surface:#ffffff; --soft:#e8f7d6; --soft2:#c9ec9b; --line:#e2e8ee;
  --ink:#2b3a42; --muted:#64757e; --accent:#4cb000; --accent-sh:#3a8a00; --accent2:#2d6e00; --on-accent:#ffffff;
  --sky:#1cb0f6; --sky-sh:#1288bd; --blue:#0b7bb0; --blue-soft:#dff4ff; --amber:#a35c00; --amber-soft:#fff1cc; --sun:#ffc800; --sun-sh:#d9a600;
  --rose:#9b4fe0; --good:#3d8f00; --good-soft:#d9f6bb; --bad:#d62f2f; --bad-sh:#a82020; --bad-soft:#ffe0e0;
  --display:"Fredoka","Rubik","Nunito","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Rubik","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --r:20px; --shadow:0 3px 0 var(--line);
  --flame:#ff9600; --flame-ink:#e07b00; --warn:#f5a623; --lv0:#3f9e00; --lv1:#0f86bd; --lv2:#9b4fe0; --lv3:#c76a00; --st-learn:#c99a3c; --st-recall:#3a9e8f;
  --mic:#ff6b6b; --mic-sh:#d94f4f; --mic-on:#e5484d; --mic-on-sh:#b8383c; --oops:#e5484d; --oops-sh:#b8383c; --yours:#d23c41;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131f24; --surface:#1f2c34; --soft:#23391d; --soft2:#34591f; --line:#37464f;
  --ink:#eef4f6; --muted:#a3b5bd; --accent:#58cc02; --accent-sh:#3d9100; --accent2:#8fe04a; --on-accent:#10230a;
  --sky:#1cb0f6; --sky-sh:#1583b3; --blue:#6cc9f5; --blue-soft:#17384a; --amber:#ffcf66; --amber-soft:#3b3015; --sun:#ffc800; --sun-sh:#b88f00;
  --rose:#d6a2ff; --good:#8fe04a; --good-soft:#1f3a14; --bad:#ff6b6b; --bad-sh:#b53a3a; --bad-soft:#41201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131f24; --surface:#1f2c34; --soft:#23391d; --soft2:#34591f; --line:#37464f;
  --ink:#eef4f6; --muted:#a3b5bd; --accent:#58cc02; --accent-sh:#3d9100; --accent2:#8fe04a; --on-accent:#10230a;
  --sky:#1cb0f6; --sky-sh:#1583b3; --blue:#6cc9f5; --blue-soft:#17384a; --amber:#ffcf66; --amber-soft:#3b3015; --sun:#ffc800; --sun-sh:#b88f00;
  --rose:#d6a2ff; --good:#8fe04a; --good-soft:#1f3a14; --bad:#ff6b6b; --bad-sh:#b53a3a; --bad-soft:#41201f; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:110px;min-height:100%}
body.running{padding-bottom:40px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.2rem}
p{margin:0} ul,ol{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.6}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--display);font-size:1.5rem;color:var(--rose)}
.brand span{color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;transition:background .15s,border-color .15s}
.chip.static{min-height:32px;background:var(--soft);border-color:transparent;color:var(--accent2)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--soft);border-color:var(--accent)}
.sw{width:30px;height:18px;border-radius:999px;background:var(--soft2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
[aria-checked="true"] .sw{background:var(--accent)} [aria-checked="true"] .sw::after{transform:translateX(12px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:700}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:var(--accent);background:var(--soft)}
body.running .tabs{display:none}
@media (min-width:820px){.tabs{position:sticky;top:60px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;padding:4px}}
#app{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none;background:transparent}
.card.hero{background:linear-gradient(160deg,var(--soft),var(--surface) 70%);border-color:var(--soft2)}
.card.center,.center{text-align:center;justify-content:center;align-items:center}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.86rem} .no{color:var(--bad);font-weight:700}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between} .row.top{align-items:flex-start} .row.nowrap{flex-wrap:nowrap} .row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 22px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-weight:800;text-decoration:none;box-shadow:0 2px 0 var(--accent2);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(2px);box-shadow:none}
.btn.big{width:100%;min-height:52px;font-size:1.05rem}
.btn.alt{background:var(--soft);color:var(--accent2);box-shadow:0 2px 0 var(--soft2)}
.btn.quiet{background:transparent;color:var(--muted);box-shadow:none;border:1.5px solid var(--line)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.9rem}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);padding:0 8px;font-weight:700}
.ib svg{width:22px;height:22px;fill:currentColor}
.ib.slow{border-radius:999px;font-size:.8rem;padding:0 12px;color:var(--muted)}
.ib.sm{min-width:36px;min-height:36px}
.ib:active{background:var(--soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:42px;padding:6px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
.seg button small{font-size:.7rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent2)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
select,input[type=text],input[type=search]{width:100%;min-height:46px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
input:focus,select:focus{border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px} .list.tight{gap:14px}
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.les.next{border-color:var(--accent);background:var(--soft)}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent2);font-weight:800}
.num.done{background:var(--accent);color:var(--on-accent)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:99px;transition:width .35s ease}
.pip{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:.78rem;font-weight:800;color:var(--muted);width:52px;flex:none}
.pip .bar{width:100%;height:6px}
.ph{color:var(--blue);font-weight:600;font-size:.95rem} body.no-ph .ph{display:none}
.ru{font-size:1.25rem;font-weight:700;overflow-wrap:anywhere} .ru.xl{font-size:1.9rem;line-height:1.3} .ru.sm{font-size:1.1rem}
.en{color:var(--muted)}
.ex{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft)}
.exru{font-weight:700}
.goal{padding:10px 12px;border-radius:12px;background:var(--blue-soft);color:var(--ink)}
.pts{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.how summary{cursor:pointer;font-weight:800;color:var(--accent2);min-height:32px}
.how[open] summary{margin-bottom:8px}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.alpha button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:.78rem;color:var(--muted)}
.alpha button b{font-size:1.5rem;color:var(--ink)}
.vrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
details.w{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:6px 10px}
details.w>summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none;min-height:56px}
details.w>summary::-webkit-details-marker{display:none}
.more{display:flex;flex-direction:column;gap:8px;padding:6px 0 10px}
.vf{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-weight:700}
.vf span{padding:4px 8px;background:var(--soft);border-radius:8px;font-size:.92rem} .vf i{font-style:normal;color:var(--muted);font-weight:600}
.tag{display:inline-block;align-self:flex-start;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--accent2);font-size:.75rem;font-weight:800}
.tag.blue{background:var(--blue-soft);color:var(--blue)} .tag.amber{background:var(--amber-soft);color:var(--amber)}
.note{padding:12px 14px;border-radius:14px;background:var(--amber-soft);color:var(--ink);font-size:.92rem}
.week{display:flex;justify-content:space-between}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);font-weight:700}
.wd i{width:26px;height:26px;border-radius:50%;background:var(--soft);display:block}
.wd.on i{background:var(--accent)}
.plan{padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.plan li{display:flex;flex-direction:column;padding:8px 12px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0}
.stat{display:flex;gap:10px} .stat>div{flex:1;background:var(--soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center}
.stat b{font-size:1.5rem;font-family:var(--display)} .stat span{font-size:.78rem;color:var(--muted);text-align:center}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stg{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:12px;background:var(--soft);font-size:.7rem;font-weight:700;color:var(--muted)}
.stg b{font-size:1.2rem;color:var(--ink)}
.stbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft)}
.stbar i{display:block;min-width:0}
.stbar .new{background:var(--soft2)} .stbar .learning{background:var(--st-learn)} .stbar .recognised{background:var(--blue)} .stbar .recalled{background:var(--st-recall)} .stbar .confident{background:var(--good)}
.days{display:flex;align-items:flex-end;gap:8px;height:130px}
.days>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:700}
.days i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach .a{display:flex;flex-direction:column;padding:10px;border-radius:12px;border:1.5px dashed var(--line);opacity:.65}
.ach .a.on{opacity:1;border:1.5px solid var(--accent);background:var(--soft)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{padding:10px 0;border-bottom:1px solid var(--line)}
.spk{display:block;font-size:.75rem;font-weight:800;color:var(--rose);text-transform:uppercase;letter-spacing:.05em}
.rt{font-size:1.15rem;font-weight:600;line-height:1.9}
span.w{cursor:pointer;border-bottom:1.5px dotted var(--soft2);padding:2px 1px;border-radius:4px} span.w:hover{background:var(--soft)}
.trn summary{cursor:pointer;color:var(--accent2);font-weight:700;min-height:28px}
.gloss{position:sticky;bottom:90px;padding:12px 14px;border-radius:14px;background:var(--blue-soft);font-size:1rem}
/* runner */
.runner{display:flex;flex-direction:column;gap:14px;min-height:60vh}
.rhead{display:flex;align-items:center;gap:12px}
.task{animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.prompt{font-size:1.35rem;font-family:var(--display);font-weight:600}
.bubble{background:var(--soft);border-radius:16px 16px 16px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tray{min-height:58px;padding:10px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-height:46px;padding:6px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:1.05rem;box-shadow:0 2px 0 var(--line);transition:transform .08s}
.tile:active{transform:translateY(2px);box-shadow:none} .tile.on{background:var(--soft);border-color:var(--accent)}
.opts,.syl{display:grid;gap:10px}
.syl{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
.opt{min-height:54px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;text-align:left;box-shadow:0 2px 0 var(--line);transition:transform .08s,border-color .15s}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:none} .opt.sel{border-color:var(--accent);background:var(--soft)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;min-height:56px;padding:6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800}
.grades small{font-size:.7rem;color:var(--muted);font-weight:600}
.grades button:nth-child(1){border-color:var(--bad)} .grades button:nth-child(4){border-color:var(--good)}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;animation:rise .2s ease}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fbh{display:flex;gap:10px;align-items:center;font-size:1.1rem}
.fbi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--bad)} .fb.good .fbi{background:var(--good)}
.fbi svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3}
.ring{--p:0;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft) 0)}
.ring b{width:98px;height:98px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:1.7rem;font-family:var(--display)}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:6px}
.kb button{min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;font-weight:700;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
hr{border:0;border-top:1px solid var(--line);width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- playful layer ---- */
body{font-weight:600}
h1,h2,h3,.prompt,.brand b{font-family:var(--display);font-weight:600;letter-spacing:.005em}
h1{font-size:1.75rem} h2{font-size:1.3rem}
.brand b{color:var(--accent);font-size:1.7rem;font-weight:700}
.brand span{font-weight:700}
.card{border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card.hero{background:var(--surface);border-color:var(--soft2)}
.eyebrow{color:var(--accent2);font-weight:900;letter-spacing:.1em}
.btn{border-radius:16px;text-transform:uppercase;letter-spacing:.06em;font-weight:900;font-size:.9rem;box-shadow:0 4px 0 var(--accent-sh);min-height:50px}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--accent-sh)}
.btn.big{min-height:56px;font-size:1.05rem}
.btn.alt{background:var(--surface);color:var(--sky-sh);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.alt:active{box-shadow:none}
.btn.quiet{background:transparent;color:var(--muted);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sm{min-height:40px;padding:6px 16px;font-size:.8rem;box-shadow:0 3px 0 var(--line)}
.btn:not(.alt):not(.quiet).sm{box-shadow:0 3px 0 var(--accent-sh)}
.chip{border:2px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:800}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--blue-soft);border-color:var(--sky)}
.chip.static{background:var(--amber-soft);color:var(--amber);border:0;box-shadow:none}
[aria-checked="true"] .sw{background:var(--sky)}
.seg button{border:2px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);font-weight:800}
.seg button[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--sky);color:var(--blue);box-shadow:0 3px 0 var(--sky)}
select,input[type=text],input[type=search]{border:2px solid var(--line);border-radius:14px;font-weight:700;font-size:1.05rem}
input:focus,select:focus{border-color:var(--sky);outline:none}
.ib{border:2px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--sky)}
.ib:active{transform:translateY(3px);box-shadow:none}
.tabs{border-top:2px solid var(--line)}
.tabs a{font-weight:800;border:2px solid transparent;border-radius:14px}
.tabs a.on{color:var(--sky-sh);background:var(--blue-soft);border-color:var(--sky)}
body:not(.running) .tabs a.on svg{stroke:var(--sky)}
.bar{height:14px;background:var(--line);position:relative}
.bar i{background:var(--accent);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.rhead .bar{height:18px}
.ph{color:var(--blue);font-weight:700}
.ru{font-weight:800}
.prompt{font-size:1.45rem}
.tag{background:var(--blue-soft);color:var(--blue);font-weight:900}
.tag.blue{background:var(--soft);color:var(--accent2)}
.num{background:var(--soft);color:var(--accent2)}
.num.done{background:var(--accent);color:#fff}
.les{border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:16px}
.les.next{border-color:var(--sky);background:var(--blue-soft)}
.goal{background:var(--blue-soft);border:2px solid var(--sky);border-radius:14px}
.ex{background:var(--blue-soft);border-radius:14px}
.note{background:var(--amber-soft);border:2px solid var(--sun);border-radius:14px}
.tile,.opt{border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);font-weight:800}
.opt{min-height:58px;font-size:1.05rem}
.opt:active:not(:disabled),.tile:active{transform:translateY(4px);box-shadow:none}
.opt.sel,.tile.on{border-color:var(--sky);background:var(--blue-soft);box-shadow:0 4px 0 var(--sky)}
.tray{border-bottom:2px solid var(--line);min-height:64px;background:repeating-linear-gradient(transparent 0 55px,var(--line) 55px 57px)}
.grades button{border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);font-weight:900}
.grades button:nth-child(1){border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.grades button:nth-child(2){border-color:var(--sun);box-shadow:0 4px 0 var(--sun)}
.grades button:nth-child(3){border-color:var(--sky);box-shadow:0 4px 0 var(--sky)}
.grades button:nth-child(4){border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.grades button:active{transform:translateY(4px);box-shadow:none}
.stat>div{background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.stat>div:nth-child(1) b{color:var(--accent)} .stat>div:nth-child(2) b{color:var(--sky)} .stat>div:nth-child(3) b{color:var(--flame)}
.stat b{font-family:var(--display)}
.stg{border:2px solid var(--line);background:var(--surface)}
.plan li{border-left:0;border:2px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line)}
.plan li::before{content:"";}
.days i{background:var(--sky)}
.wd i{background:var(--line)} .wd.on i{background:var(--flame);box-shadow:0 0 0 3px var(--amber-soft)}
.ach .a.on{background:var(--amber-soft);border-color:var(--sun)}
.gloss{border:2px solid var(--sky)}
.toast{background:var(--ink);border-radius:16px}
/* header stats */
.stats{display:flex;gap:8px;font-family:var(--display);font-weight:600;font-size:1.05rem}
.stats span{display:inline-flex;gap:4px;align-items:center;padding:4px 12px;border-radius:99px;border:2px solid var(--line);background:var(--surface)}
.stats .fire{color:var(--flame-ink)} .stats .xp{color:var(--blue)}
header.top{row-gap:6px}
/* mascot */
.mascot{display:flex;gap:12px;align-items:center}
.bunny-wrap{flex:none;width:88px}
.bunny-wrap.sm{width:92px}
.bunny,.logo{display:block;width:100%;height:auto;overflow:visible}
.bunny-wrap .bunny{animation:bob 3s ease-in-out infinite}
.ear{transform-box:fill-box}
.ear.l{transform-origin:50% 100%;animation:wig 4.2s ease-in-out infinite}
.ear.r{transform-origin:10% 10%;animation:flop 3.4s ease-in-out infinite}
@keyframes wig{0%,86%,100%{transform:rotate(0)}91%{transform:rotate(-7deg)}96%{transform:rotate(3deg)}}
@keyframes flop{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
.logo-slot{width:40px;flex:none;align-self:center;color:inherit;font-size:inherit}
.brand{align-items:center}
.brand b{font-size:1.75rem;letter-spacing:.01em}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.speech{position:relative;flex:1;padding:12px 14px;border:2px solid var(--line);border-radius:18px;background:var(--surface);font-weight:800;font-size:1rem}
.speech::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.goal-row{display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--amber-soft)}
.gring{--p:0;flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--flame) calc(var(--p)*1%),var(--surface) 0);font-size:1.4rem}
.gring span{width:40px;height:40px;border-radius:50%;background:var(--amber-soft);display:grid;place-items:center}
/* course path */
.lvl{display:flex;flex-direction:column;gap:6px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:18px;background:var(--lv,var(--lv0));color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.banner .eyebrow{color:rgba(255,255,255,.85)} .banner b{font-family:var(--display);font-size:1.15rem;font-weight:600}
.banner span{font-weight:900;background:rgba(255,255,255,.2);padding:2px 12px;border-radius:99px}
.lvl.c0{--lv:var(--lv0)}.lvl.c1{--lv:var(--lv1)}.lvl.c2{--lv:var(--lv2)}.lvl.c3{--lv:var(--lv3)}
.path{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 6px}
.node{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--o,0));width:170px;padding:0}
.disc{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.7rem;font-weight:600;color:var(--muted);background:var(--line);box-shadow:0 6px 0 rgba(0,0,0,.14);transition:transform .1s}
.node:active .disc{transform:translateY(5px);box-shadow:none}
.node.done .disc{background:var(--sun);color:#fff;box-shadow:0 6px 0 var(--sun-sh);font-size:2rem;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.node.next .disc{background:var(--lv);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.28);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.28),0 0 0 0 rgba(28,176,246,.45)}50%{box-shadow:0 6px 0 rgba(0,0,0,.28),0 0 0 14px rgba(28,176,246,0)}}
.nl{font-weight:800;font-size:.85rem;text-align:center;line-height:1.25}
.go{position:absolute;top:-16px;background:var(--surface);color:var(--lv);border:2px solid var(--line);border-radius:12px;padding:1px 10px;font-weight:900;font-size:.78rem;letter-spacing:.06em;animation:bob 1.6s ease-in-out infinite}
/* runner rewards */
.combo{font-family:var(--display);font-weight:600;color:var(--flame-ink);white-space:nowrap;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.runner.sheet{padding-bottom:230px}
.runner .fb{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:760px;z-index:40;border-radius:24px 24px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:62vh;overflow:auto;animation:sheet .25s ease;border-top:3px solid transparent}
@keyframes sheet{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.fb.good{border-top-color:var(--accent)} .fb.bad{border-top-color:var(--bad)}
.fb.good .fbh{color:var(--good)} .fb.bad .fbh{color:var(--bad)}
.fbh{font-family:var(--display);font-size:1.4rem;font-weight:600}
.fbi{width:34px;height:34px;font-size:1.1rem}
.fb.bad .btn{background:var(--bad);box-shadow:0 4px 0 var(--bad-sh)}
.xpop{margin-left:auto;font-family:var(--display);color:var(--flame-ink);font-weight:600;font-size:1.1rem;animation:floatup 1.2s ease both}
@keyframes floatup{0%{opacity:0;transform:translateY(12px) scale(.7)}30%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:1;transform:none}}
.task{border-width:2px}
.stars{display:flex;gap:6px;font-size:2.6rem;line-height:1}
.stars span{color:var(--line);display:inline-block}
.stars span.on{color:var(--sun);text-shadow:0 3px 0 var(--sun-sh);animation:starin .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.ring{background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);width:140px;height:140px}
.ring b{width:108px;height:108px}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pills span{padding:6px 14px;border-radius:99px;font-weight:900;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.bunny-wrap .bunny,.ear,.go,.node.next .disc{animation:none!important}}
/* ---------- audio controls: big speaker, listening player, volume ---------- */
.spkwrap{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 8px}
.bigspk{position:relative;flex:none;width:84px;height:84px;border-radius:50%;border:0;background:var(--sky);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 var(--sky-sh);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s,box-shadow .08s,background .15s}
.bigspk::after{content:'';position:absolute;inset:-10px;border-radius:50%}
.bigspk svg{width:40px;height:40px;fill:currentColor;transition:opacity .15s}
.bigspk:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sky-sh)}
.bigspk:focus-visible{outline:3px solid var(--sun);outline-offset:4px}
.bigspk .spin{position:absolute;inset:-7px;border-radius:50%;border:4px solid transparent;border-top-color:var(--sky);opacity:0;pointer-events:none}
.bigspk.loading svg{opacity:.5}
.bigspk.loading .spin{opacity:1;animation:bspin .8s linear infinite}
.bigspk.playing{background:var(--sky-sh);box-shadow:0 5px 0 var(--sky-sh),0 0 0 7px rgba(28,176,246,.25);animation:bpulse 1.1s ease-in-out infinite}
@keyframes bspin{to{transform:rotate(360deg)}}
@keyframes bpulse{50%{box-shadow:0 5px 0 var(--sky-sh),0 0 0 13px rgba(28,176,246,.1)}}
.ib.loading{opacity:.6;cursor:progress}
.ib.playing{border-color:var(--sky);color:var(--sky);background:var(--blue-soft)}
.ib.pill{border-radius:999px;padding:0 14px;gap:6px;font-size:.85rem}
.ib.pill svg{width:18px;height:18px}
.ib:disabled{opacity:.4;box-shadow:none;cursor:default}
.lplayer{display:flex;align-items:center;gap:18px;padding:16px;margin:10px 0 4px;border-radius:20px;background:var(--blue-soft)}
.lp-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.lp-status{font-weight:700;min-height:1.4em;line-height:1.35}
.lplayer[data-st=playing] .lp-status{color:var(--blue)}
.lplayer[data-st=blocked] .lp-status{color:var(--amber)}
.lp-ctl{gap:8px}
.vol{display:flex;align-items:center;gap:10px;margin:10px 0 2px;font-weight:600}
.vol input{flex:1;min-width:0;accent-color:var(--accent)}
.vol output{min-width:3.2em;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:360px){.lplayer{flex-direction:column;align-items:stretch;text-align:center}.lplayer .bigspk{align-self:center}.lp-ctl{justify-content:center}}
/* ---------- answer review ---------- */
.opt.good{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:0 4px 0 var(--accent-sh)}
.opt.bad{border-color:var(--oops);background:color-mix(in srgb,var(--oops) 12%,var(--surface));box-shadow:0 4px 0 var(--oops-sh);text-decoration:line-through;text-decoration-thickness:1.5px}
.opt.good:disabled,.opt.bad:disabled{opacity:1}
.fb .yours b{color:var(--yours)}
.fb .right b{color:var(--accent2)}
.mcats{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.sndt{font-size:1rem;flex:none}
/* ---------- lesson stages, matching, journey, hub, game ---------- */
.lstages{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin:0 0 12px;padding:0;font-size:.72rem;font-weight:700;letter-spacing:.02em}
.lstages li{padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.lstages li.done{color:var(--accent2);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.lstages li.done::before{content:'✓ '}
.lstages li.on{background:var(--accent);color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.mcol{display:flex;flex-direction:column;gap:8px}
.mcell{min-height:52px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:700;text-align:center;box-shadow:0 4px 0 var(--line);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s,opacity .25s,background .15s;overflow-wrap:anywhere}
.mcell[lang=ru]{font-size:1.05rem}
.mcell:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mcell.sel{border-color:var(--sky);background:var(--blue-soft);box-shadow:0 4px 0 var(--sky-sh)}
.mcell.done{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:none;opacity:.45;cursor:default}
.mcell.bad{border-color:var(--oops);background:color-mix(in srgb,var(--oops) 12%,var(--surface));animation:mshake .35s}
@keyframes mshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.jsteps{list-style:none;margin:12px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.jsteps button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.jsteps .jn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--muted)}
.jsteps .jt{display:flex;flex-direction:column;min-width:0}.jsteps small{color:var(--muted);font-size:.78rem}
.jsteps li.done .jn{background:var(--accent);color:#fff}
.jsteps li.done button{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hub-t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.hub-t:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.hub-i{font-size:1.5rem;line-height:1.2}.hub-t small{color:var(--muted)}
.game .gtime{font-size:1.6rem;font-variant-numeric:tabular-nums}
.gbar{margin:8px 0}.gbar i{transition:width .2s linear}
.btn.sm{padding:6px 12px;font-size:.85rem}
@media (max-width:380px){.match{gap:6px}.mcell{padding:8px;font-size:.9rem}.hub{grid-template-columns:1fr 1fr}}
/* ---------- speaking: conversation partner and shadowing ---------- */
.chat{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.msg{max-width:86%;padding:10px 12px;border-radius:18px;line-height:1.35}
.msg.them{align-self:flex-start;background:var(--blue-soft);border-bottom-left-radius:6px}
.msg.them .en{display:block;margin-top:2px}
.msg.clar{background:color-mix(in srgb,var(--amber,#f5a623) 16%,var(--surface))}
.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-bottom-right-radius:6px;font-weight:600}
.turn{border-top:2px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.model{padding:10px 12px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.model .row{width:100%}
.talkin{display:flex;align-items:center;gap:14px}
.talkin input{flex:1;min-width:0}
.bigspk.mic{background:var(--mic);box-shadow:0 5px 0 var(--mic-sh)}
.bigspk.mic:active{box-shadow:0 1px 0 var(--mic-sh)}
.bigspk.mic.playing{background:var(--mic-on);box-shadow:0 5px 0 var(--mic-on-sh),0 0 0 7px rgba(255,107,107,.25);animation:bpulse 1.1s ease-in-out infinite}
.talkin .bigspk{width:72px;height:72px}
.talkin .bigspk svg{width:34px;height:34px}
.shadow-t{margin:12px 0 4px;line-height:1.4}
.shadow-t .hit{color:var(--accent2)}
.shadow-t .miss{color:var(--yours);text-decoration:underline wavy;text-decoration-thickness:1px}
.ru.lg{font-size:1.5rem;font-weight:700}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.skill{padding:12px;border-radius:16px;background:var(--soft)}
.skill b{display:block;font-size:1.25rem}
.skill .meter{height:8px;border-radius:99px;background:var(--line);margin:6px 0 4px;overflow:hidden}
.skill .meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.skill.low .meter i{background:var(--warn)}
.cando{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.cando li{display:flex;gap:8px;align-items:flex-start}
.cando li.no{color:var(--muted)}
@media (max-width:380px){.talkin{gap:10px}.talkin .bigspk{width:60px;height:60px}}

/* ---------- colour themes: change only the variables, never the layout. Add a theme = add one block below + one entry in PALETTES (core.js). ---------- */

.path li{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:14px;border:1px solid var(--line)}
.path li.on{border-color:var(--accent);background:var(--soft)}.path li.done{opacity:.85}
.abil{display:flex;flex-direction:column;gap:6px}
#bkIn{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;padding:10px;resize:vertical}

 x:[["tiles","У меня есть сестра.","I have a sister.","have"],["fix","Я понимаю не.","Я не понимаю.","neg","Put не directly before the verb."],["type","Do you speak English? (formal)","Вы говорите по-английски?","q"],["cloze","У меня нет ___. (a brother)","брата","gen"],["type","I don't know.","Я не знаю.","neg"],["tiles","Где находится метро?","Where is the metro?","q"],["type","May I come in?","Можно войти?","q"],["dict","Повторите, пожалуйста.","Please repeat."],["listen","Говорите медленнее, пожалуйста.","Please speak more slowly.",["Please sit down.","I am very tired."]]]},
{id:"c11",lvl:"A1",t:"Numbers, time and prices",min:8,obj:"I can count to 100, tell the time and ask a price.",
 intro:"Numbers carry grammar with them: the noun after a number changes form. Learn the pattern with a few common nouns.",
 pts:["1 один, 2 два, 3 три, 4 четыре, 5 пять, 6 шесть, 7 семь, 8 восемь, 9 девять, 10 десять, 20 двадцать, 100 сто.","After 1, the noun stays as it is: один час. After 2, 3 and 4, use the genitive singular: два часа, три минуты.","After 5 and above, use the genitive plural: пять часов, пять минут.","Time: Который час? Сейчас девять часов. At nine: в девять.","Price: Сколько стоит билет? Билет стоит сто рублей."],
 ex:[["Сколько стоит билет?","SKOHL-ka STOH-eet bee-LYET","How much is the ticket?"],["Сейчас девять часов.","see-CHAHS DYEH-vyat chee-SOHF","It is nine o'clock."],["Мне двадцать пять лет.","mnyeh DVAHD-tsat pyat lyet","I am 25 years old."]],v:["v|Numbers & time"],
 x:[["type","seven","семь","num"],["type","twenty","двадцать","num"],["type","one hundred","сто","num"],["cloze","У меня два ___. (brother)","брата","num"],["cloze","У меня пять ___. (brother)","братьев","num"],["cloze","Мне ___ лет. (25)","двадцать пять","num"],["dict","девять","nine"],["tiles","Урок начинается в девять часов.","The lesson begins at nine o'clock.","time"],["type","What time is it?","Который час?","time"],["dict","Сколько стоит билет?","How much is the ticket?"]]},
{id:"c12",lvl:"A1",t:"Where: the prepositional case",min:8,obj:"I can say where I am, live and work using в and на.",
 intro:"Russian endings show a noun's job in the sentence. The prepositional case answers the question where.",
 pts:["Use в (in) or на (on, at) plus the prepositional case. Most nouns add -е: Лондон → в Лондоне, стол → на столе, школа → в школе.","Countries in -ия end in -ии: в Англии, в России.","в is for enclosed places: в офисе, в банке. на is for open spaces and events: на улице, на вокзале, на работе.","A few masculine nouns take a stressed -у: в аэропорту, в саду. Learn them as exceptions."],
 ex:[["Я живу в Лондоне.","ya zhee-VOO v LON-da-nyeh","I live in London."],["Мы на вокзале.","my na vak-ZAH-lyeh","We are at the station."],["Книга на столе.","KNEE-ga na sta-LYEH","The book is on the table."]],v:["p|Getting around","v|Home & places"],
 x:[["cloze","Я живу в ___. (Москва)","Москве","prep"],["cloze","Я живу в ___. (Лондон)","Лондоне","prep"],["cloze","Книга на ___. (стол)","столе","prep"],["cloze","Мы в ___. (ресторан)","ресторане","prep"],["cloze","Я на ___. (работа)","работе","prep"],["cloze","Он в ___. (школа)","школе","prep"],["pick","Which? Мы ___ вокзале.",["в","на"],"на","prep"],["fix","Я живу в Лондон.","Я живу в Лондоне.","prep","After в or на for location, use the prepositional case: Лондон becomes Лондоне."],["type","I work in an office.","Я работаю в офисе.","prep"],["tiles","Мы живём в маленьком городе.","We live in a small town.","prep"]]},
{id:"c13",lvl:"A1",t:"What: the accusative case",min:8,obj:"I can use direct objects and say where I am going.",
 intro:"The accusative marks what you read, see, buy or love. It also shows direction after в and на.",
 pts:["Feminine -а becomes -у and -я becomes -ю: книга → книгу, семья → семью.","Masculine things and neuter nouns do not change: Я читаю журнал. Я вижу окно.","Masculine people and animals take the genitive form instead: Я вижу брата.","Direction, where to: в/на + accusative. Я иду в школу (to school) but Я в школе (at school)."],
 ex:[["Я пью воду.","ya pyu VOH-doo","I am drinking water."],["Я люблю маму.","ya lyu-BLYU MAH-moo","I love my mum."],["Мы идём в школу.","my ee-DYOM f SHKOH-loo","We are going to school."]],v:["p|Café & shopping","v|Food & drink"],
 x:[["cloze","Я читаю ___. (книга)","книгу","acc"],["cloze","Я вижу ___. (машина)","машину","acc"],["cloze","Я люблю ___. (мама)","маму","acc"],["cloze","Я пью ___. (вода)","воду","acc"],["cloze","Я читаю ___. (журнал)","журнал","acc"],["cloze","Я вижу ___. (брат)","брата","acc"],["cloze","Мы идём в ___. (школа)","школу","acc"],["fix","Я люблю мама.","Я люблю маму.","acc","Feminine -а nouns change to -у as direct objects."],["fix","Я читаю книга.","Я читаю книгу.","acc","The thing you read is the direct object: книга becomes книгу."],["tiles","Я хочу купить хлеб.","I want to buy bread.","acc"],["type","I am watching a film.","Я смотрю фильм.","acc"]]},
{id:"c14",lvl:"A1",t:"Of and none: the genitive case",min:8,obj:"I can say what I do not have, show possession and use из, у, до and от.",
 intro:"The genitive does a lot of work: of, from, none of, and the form after нет and many prepositions.",
 pts:["Masculine and neuter singular add -а or -я: брат → брата, друг → друга.","Feminine -а becomes -ы, and -я becomes -и: вода → воды, семья → семьи.","нет + genitive: У меня нет времени. Нет воды.","Possession: Это книга друга. = This is my friend's book.","Prepositions that take the genitive: из, у, от, до, без, для, после."],
 ex:[["У меня нет времени.","oo mee-NYA nyet VRYEH-mee-nee","I have no time."],["Это книга друга.","EH-ta KNEE-ga DROO-ga","This is my friend's book."],["Я из Англии.","ya eez AHN-glee-ee","I am from England."]],v:["v|Prepositions"],
 x:[["cloze","У меня нет ___. (время)","времени","gen"],["cloze","У нас нет ___. (хлеб)","хлеба","gen"],["cloze","Это книга ___. (друг)","друга","gen"],["cloze","Нет ___. (вода)","воды","gen"],["cloze","У ___ есть сестра. (я)","меня","gen"],["cloze","Это дом моей ___. (мама)","мамы","gen"],["cloze","Чашка ___. (чай)","чая","gen"],["fix","У меня нет время.","У меня нет времени.","gen","After нет, use the genitive: время becomes времени."],["type","I have no money.","У меня нет денег.","gen"],["tiles","Я работаю до шести часов.","I work until six o'clock.","gen"]]},
{id:"c15",lvl:"A1",t:"Plurals and adjectives",min:8,obj:"I can make common plurals and make adjectives agree.",
 intro:"Adjectives agree with their noun in gender, number and case. Plurals are mostly regular, with a few common exceptions.",
 pts:["Plural: add -ы, or -и after г, к, х, ж, ш, ч, щ: книга → книги. Many masculine nouns take -а: дом → дома, город → города.","Neuter -о becomes -а: окно → окна. Irregular and common: друг → друзья, человек → люди, ребёнок → дети.","Adjectives: красивый город (m), красивая книга (f), красивое окно (n), красивые книги (plural).","Short form for a person or state: Он занят. Она рада. Ты прав."],
 ex:[["красивый город","kra-SEE-vyy GOH-rat","a beautiful city"],["большая квартира","bal-SHAH-ya kvar-TEE-ra","a big flat"],["новые книги","NOH-vy-ye KNEE-gee","new books"]],v:["v|Adjectives & adverbs","v|More adjectives"],
 x:[["cloze","Это ___ книги. (new)","новые","adj"],["cloze","Это ___ дом. (new)","новый","adj"],["cloze","Это ___ машина. (new)","новая","adj"],["cloze","Это ___ окно. (new)","новое","adj"],["cloze","Это мои ___. (friend)","друзья","plur"],["cloze","Это мои ___. (book)","книги","plur"],["cloze","Это мои ___. (city)","города","plur"],["type","a beautiful city","красивый город","adj"],["type","a big flat","большая квартира","adj"],["fix","Это красивый книга.","Это красивая книга.","adj","Adjectives agree with the noun: книга is feminine, so красивая."]]},
{id:"c16",lvl:"A2",t:"To whom and with whom: dative and instrumental",min:9,obj:"I can use the dative for to/for and the instrumental for with and professions.",
 intro:"Two more cases finish the main set. The dative is for the person something is given, said or addressed to. The instrumental is for with, and for what someone is as a job.",
 pts:["Dative endings: masculine -у/-ю, feminine -е. брат → брату, мама → маме. Used after к and with звонить, помогать, нравиться, нужно.","Мне нравится = I like (literally: to me it is pleasing). Мне нужна помощь = I need help.","Instrumental endings: masculine -ом/-ем, feminine -ой/-ей. друг → другом, сестра → сестрой.","с + instrumental = with: чай с лимоном. A job after работать: Он работает врачом."],
 ex:[["Я звоню маме.","ya zva-NYU MAH-myeh","I am calling my mum."],["Я работаю с другом.","ya ra-BOH-ta-yu s DROO-gam","I work with a friend."],["Мне нравится этот город.","mnyeh NRAH-veet-sya EH-tat GOH-rat","I like this city."]],v:["p|Family & people","p|Work & study"],
 x:[["type","I like this city.","Мне нравится этот город.","dat"],["cloze","Я звоню ___. (мама)","маме","dat"],["cloze","Я иду к ___. (врач)","врачу","dat"],["cloze","Я пью чай с ___. (лимон)","лимоном","ins"],["cloze","Я работаю с ___. (друг)","другом","ins"],["cloze","Я гуляю с ___. (сестра)","сестрой","ins"],["cloze","Он работает ___. (врач)","врачом","ins"],["fix","Я работаю с друг.","Я работаю с другом.","ins","с (with) takes the instrumental: друг becomes другом."],["tiles","Мне нужна помощь.","I need help.","dat"]]},
{id:"c17",lvl:"A2",t:"Past and future",min:8,obj:"I can talk about yesterday and tomorrow.",
 intro:"Past and future are simpler than the present. The past has one ending per gender and no person endings at all.",
 pts:["Past: take off -ть and add -л (m), -ла (f), -ло (n), -ли (plural). читать → он читал, она читала, мы читали.","быть: был, была, было, были. Вчера я был дома.","Future of быть: я буду, ты будешь, он будет, мы будем, вы будете, они будут.","Future with a verb: я буду работать = I will be working.","The same verb form is used for I, you, he in the past. Only gender and number show who did it."],
 ex:[["Вчера я работал.","fchee-RAH ya ra-BOH-tal","Yesterday I worked."],["Завтра я буду дома.","ZAHF-tra ya BOO-doo DOH-ma","Tomorrow I will be at home."],["Она читала книгу.","a-NAH chee-TAH-la KNEE-goo","She was reading a book."]],v:["p|Time & plans"],
 x:[["cloze","Вчера я ___ на работе. (быть, I am a man)","был","past"],["cloze","Вчера она ___ дома. (быть)","была","past"],["cloze","Мы ___ в Москве. (быть, past)","были","past"],["cloze","Он ___ книгу. (читать, past)","читал","past"],["cloze","Завтра я ___ дома. (быть)","буду","fut"],["cloze","Завтра мы ___ работать. (быть)","будем","fut"],["type","I worked yesterday. (a man)","Вчера я работал.","past"],["tiles","Завтра я буду работать.","Tomorrow I will work.","fut"],["fix","Вчера я работать.","Вчера я работал.","past","Past tense: drop -ть and add -л for a man."]]},
{id:"c18",lvl:"A2",t:"Aspect: ongoing or finished",min:9,obj:"I can choose between imperfective and perfective verbs.",
 intro:"Most Russian verbs come in pairs. One form describes an action as a process or habit, the other as a single completed result. This is the biggest difference from English.",
 pts:["Imperfective: process, repetition, background, how long. Я читал книгу весь вечер. Я каждый день пью кофе.","Perfective: one finished action with a result. Я прочитал книгу. Я выпил кофе.","A perfective verb has no present tense. Its present-looking form means the future: Я прочитаю = I will finish reading.","Common pairs: делать/сделать, читать/прочитать, писать/написать, покупать/купить, говорить/сказать, брать/взять, звонить/позвонить.","Clues for imperfective: каждый день, обычно, часто, весь вечер. Clues for perfective: уже, за два дня, вдруг."],
 ex:[["Я читал книгу весь вечер.","ya chee-TAHL KNEE-goo vyes VYEH-cheer","I was reading the book all evening."],["Я прочитал книгу.","ya pra-chee-TAHL KNEE-goo","I finished the book."],["Я куплю хлеб.","ya koop-LYU khlyep","I will buy bread."]],v:["p|Feelings & opinions"],
 x:[["pick","I was reading a book all evening.",["читал","прочитал"],"читал","aspect"],["pick","I finished reading the book.",["читал","прочитал"],"прочитал","aspect"],["cloze","Вчера я весь вечер ___ книгу. (читать, past, ongoing)","читал","aspect"],["cloze","Я ___ книгу за два дня. (finished it, man)","прочитал","aspect"],["cloze","Завтра я ___ эту книгу. (прочитать, will finish)","прочитаю","aspect"],["type","I will buy bread.","Я куплю хлеб.","aspect"],["type","I was buying bread. (a man)","Я покупал хлеб.","aspect"],["cloze","Я ___ тебе завтра. (позвонить, will call)","позвоню","aspect"]]},
{id:"c19",lvl:"A2",t:"Motion verbs",min:9,obj:"I can talk about going and travelling, now and in general.",
 intro:"Russian has separate verbs for going on foot and going by transport, and each comes in two types: one trip now, or habit and round trips.",
 pts:["идти (on foot, now, one direction) and ходить (on foot, habit or round trip). Я иду домой. Я хожу в офис каждый день.","ехать (by transport, now) and ездить (by transport, habit or round trip). Мы едем в Москву. Он часто ездит в Москву.","Past of ходить means went and came back: Вчера мы ходили в кино. Past of идти means was on the way: Он шёл домой.","Prefixes add direction: при- arrive (приходить), у- leave (уходить). пойти = set off: Давай пойдём в кино.","Where to uses в or на + accusative: Я еду на вокзал."],
 ex:[["Я иду домой.","ya ee-DOO da-MOY","I am walking home."],["Мы едем в Москву.","my YEH-dyem v mask-VOO","We are travelling to Moscow."],["Он часто ездит в Москву.","ohn CHAH-sta YEZ-deet v mask-VOO","He often goes to Moscow."]],v:["v|Travel & documents","p|Travel & health"],
 x:[["cloze","Я ___ домой. (идти, now)","иду","motion"],["cloze","Мы ___ в Москву. (ехать, now)","едем","motion"],["cloze","Я каждый день ___ в офис. (ходить, on foot)","хожу","motion"],["cloze","Он часто ___ в Москву. (ездить)","ездит","motion"],["cloze","Вчера мы ___ в кино. (ходить, past)","ходили","motion"],["pick","Which? Я люблю ___ пешком.",["идти","ходить"],"ходить","motion"],["type","I am going home.","Я иду домой.","motion"],["type","We are going to Kazan by train.","Мы едем в Казань на поезде.","motion"]]},
{id:"c20",lvl:"A2",t:"Reflexive verbs and daily routine",min:8,obj:"I can describe my day and use common reflexive verbs.",
 intro:"The ending -ся or -сь points the action back at the subject, or makes a verb intransitive. Many everyday verbs need it.",
 pts:["-сь after a vowel, -ся after a consonant: я учусь, он учится.","Common reflexive verbs: учиться (study), встречаться (meet), заниматься (be engaged in), интересоваться (be interested in), открываться (open).","They keep their normal endings: мы встречаемся, ты занимаешься. Verbs like заниматься and интересоваться take the instrumental: Я занимаюсь спортом.","учить takes an object: Я учу слова. учиться means to study: Я учусь в университете.","Routine words: сначала, потом, обычно, иногда, часто, редко."],
 ex:[["Я учусь каждый день.","ya oo-CHOOS KAHZH-dyy dyen","I study every day."],["Мы встречаемся в шесть.","my fstree-CHAH-yem-sya f shest","We are meeting at six."],["Я встаю в семь часов.","ya fsta-YU f syem chee-SOHF","I get up at seven o'clock."]],v:["v|Adverbs of time, place & frequency"],
 x:[["cloze","Я ___ каждый день. (учиться)","учусь","refl"],["cloze","Мы ___ в шесть. (встречаться)","встречаемся","refl"],["cloze","Ты ___ спортом? (заниматься)","занимаешься","refl"],["cloze","Магазин ___ в девять. (открываться)","открывается","refl"],["fix","Я учу в университете.","Я учусь в университете.","refl","To study at a place is учиться. учить needs an object: Я учу слова."],["tiles","Мы встречаемся в шесть часов.","We are meeting at six o'clock.","refl"],["type","I get up at seven.","Я встаю в семь.","pres"]]},
{id:"c21",lvl:"A2",t:"Modals, requests and would",min:9,obj:"I can ask permission, give polite instructions and say what I would like.",
 intro:"A small set of words lets you say need, may, must and would like. They are the key to polite, useful Russian.",
 pts:["Мне нужно, надо or можно + infinitive: Мне нужно идти. Здесь можно сидеть? Здесь нельзя курить.","мочь is can in the sense of be able. уметь is to know how: Я умею плавать.","должен agrees with the speaker: Я должен (m), Я должна (f).","Imperatives: formal or plural ending -йте or -ите: Читайте, Говорите, Помогите. Informal: Читай, Говори, Помоги.","Would: past tense + бы. Я хотел бы кофе (man), Я хотела бы чай (woman). Polite request: Не могли бы вы помочь?"],
 ex:[["Мне нужно идти.","mnyeh NOOZH-na eet-TEE","I need to go."],["Говорите медленнее.","ga-va-REE-tyeh MYED-lee-nyeh-yeh","Speak more slowly."],["Не могли бы вы помочь?","nee mag-LEE by vy pa-MOCH","Could you help me?"]],v:["v|Modal words"],
 x:[["cloze","Мне ___ идти. (need to)","нужно","modal"],["cloze","Здесь ___ курить. (not allowed)","нельзя","modal"],["cloze","Я ___ говорить по-русски. (can, I am able)","могу","modal"],["cloze","___ войти? (May I)","Можно","modal"],["cloze","Я ___ бы чай. (would like, man)","хотел","cond"],["cloze","___ медленнее, пожалуйста. (говорить, formal imperative)","Говорите","imp"],["cloze","___ мне, пожалуйста. (помочь, formal imperative)","Помогите","imp"],["cloze","___ ко мне в гости! (приходить, informal)","Приходи","imp"],["tiles","Я хотел бы заказать суп.","I would like to order soup.","cond"]]},
{id:"c22",lvl:"A2",t:"Real-world situations",min:10,obj:"I can handle a café, directions, shopping and a doctor's visit in Russian.",
 intro:"Now put everything together. In each situation you hear a line and build your reply. Use whole phrases you already know.",
 pts:["Reuse chunks: Можно...? Мне нужно... У меня болит... Сколько стоит...?","Start polite: Извините, ... or Простите, ...","If you do not understand, say it: Повторите, пожалуйста. Говорите медленнее.","Do not translate word by word. Think of the whole phrase."],
 ex:[["Я возьму суп и чай.","ya vaz-MOO soop ee chai","I will have soup and tea."],["У меня болит живот.","oo mee-NYA ba-LEET zhee-VOHT","I have a stomach ache."],["Это слишком дорого.","EH-ta SLEESH-kam DOH-ra-ga","That is too expensive."]],v:["p|Health & appointments"],
 x:[["scene",[["Добрый день! Что будете заказывать?","Good afternoon! What will you order?","Я возьму суп и чай.","Say you will have soup and tea."],["Что-нибудь ещё?","Anything else?","Нет, спасибо. Счёт, пожалуйста.","Say no thanks and ask for the bill."]]],["scene",[["","","Извините, где находится метро?","Ask a stranger where the metro is."],["Идите прямо, потом налево.","Go straight, then left.","Спасибо большое!","Thank them very much."]]],["scene",[["Здравствуйте! Чем могу помочь?","Hello! How can I help?","Сколько стоит эта куртка?","Ask how much this jacket costs."],["Пять тысяч рублей.","Five thousand roubles.","Это слишком дорого.","Say that is too expensive."]]],["scene",[["Что у вас болит?","What hurts?","У меня болит живот.","Say you have a stomach ache."],["Как давно?","Since when?","Со вчерашнего дня.","Say since yesterday."]]],["type","I need a doctor.","Мне нужен врач.","conv"],["type","Where is the nearest pharmacy?","Где ближайшая аптека?","conv"],["dict","Мне нужно лекарство.","I need medicine."]]},
{id:"c23",lvl:"B1",t:"Connect your ideas",min:9,obj:"I can link sentences with because, so, although and who, and give opinions.",
 intro:"Linking words turn short sentences into real speech. Using them is the quickest way to sound more natural.",
 pts:["потому что = because, поэтому = so. Я дома, потому что болею. Болею, поэтому я дома.","но = but. а contrasts two things: Я студент, а он врач.","если = if, когда = when, хотя = although, чтобы = in order to + infinitive.","который = who or which. It agrees with the noun it refers to: Это человек, который живёт рядом.","Opinions: Я думаю, что... По-моему,... Мне кажется, что..."],

/* split a long line into sections for shadowing: at commas and sentence ends, then at the middle of very long runs */
function shadowChunks(ru){const sents=String(ru).split(/(?<=[.!?…])\s+/),out=[];
 sents.forEach(s=>{let parts=s.split(/(?<=[,;:—])\s+/).map(p=>p.replace(/[,;:—]+$/,'').trim()).filter(Boolean);
  const res=[];parts.forEach(p=>{const w=p.split(/\s+/);if(w.length>=8){const m=Math.ceil(w.length/2);res.push(w.slice(0,m).join(' '),w.slice(m).join(' '));}else res.push(p);});
  res.forEach(p=>{if(p.split(/\s+/).length<2&&out.length)out[out.length-1]+=' '+p;else out.push(p);});});
 return out.length>1?out:[];}

{id:"s24",lid:"c21",lvl:3,kind:"story",theme:"Friends",t:"The surprise party",set:"Dasha plans a surprise for her husband's birthday, and it nearly goes wrong. A story in four scenes.",
 cast:{f:"Dasha",m:"Misha",g:"Lena"},
 parts:[[0,"The plan",["What is the plan?",["A surprise party for Misha","A trip for Lena","A dinner at home","A school reunion"],"A surprise party for Misha"]],[6,"Keeping the secret",["What did Dasha say about the guest list?",["It was for a school reunion","It was a shopping list","It was for work","It was for Lena"],"It was for a school reunion"]],[12,"Saturday",["What does Misha notice at the café door?",["It is quiet and dark","The door is locked","His friends are outside","It is raining"],"It is quiet and dark"]],[18,"Afterwards",["What does Misha ask for next time?",["To be warned to wear a shirt","No more surprises","A bigger cake","A different café"],"To be warned to wear a shirt"]]],
 lines:[
 ["f","Алло, Лена? Ты можешь говорить? Мне надо с тобой кое-что обсудить.","Hello, Lena? Can you talk? I need to discuss something with you."],
 ["g","Да, говори. Я как раз иду домой с работы.","Yes, go on. I am just walking home from work."],
 ["f","У Миши в субботу день рождения, ему тридцать. Я хочу устроить сюрприз, но так, чтобы он ничего не узнал.","It is Misha's birthday on Saturday; he is thirty. I want to arrange a surprise, but so that he finds out nothing."],
 ["g","Отличная идея! А где будем собираться? Дома у вас, наверное, нельзя.","Great idea! And where shall we meet? At your place is probably not possible."],
 ["f","Я думала про кафе «Лето». Там есть отдельный зал. Можешь заказать торт?","I was thinking of the café 'Leto'. It has a private room. Can you order the cake?"],
 ["g","Конечно! Только скажи, какой он любит: шоколадный или медовый?","Of course! Just tell me which he likes: chocolate or honey?"],
 ["f","Шоколадный, он обожает шоколад. Только, пожалуйста, не говори никому, особенно Мише.","Chocolate, he adores chocolate. Just please do not tell anyone, especially Misha."],
 ["g","Ну, конечно, я же не маленькая. Но тебе будет трудно: он всё замечает.","Well, of course, I am not a child. But it will be hard for you: he notices everything."],
 ["f","Это правда. Вчера он нашёл список гостей на столе и спросил, что это такое.","True. Yesterday he found the guest list on the table and asked what it was."],
 ["f","Я сказала, что это список для школьной встречи. Кажется, он поверил.","I said it was a list for a school reunion. I think he believed it."],
 ["g","Ха-ха, ну ты даёшь! Тогда в субботу отведи его в кафе под любым предлогом.","Ha-ha, you are something! Then on Saturday take him to the café on any pretext."],
 ["f","Скажу, что хочу поужинать в ресторане. Он никогда не отказывается от ужина.","I will say I want dinner out. He never turns down dinner."],
 ["f","В субботу всё шло по плану. Мы приехали в кафе почти вовремя, но Миша вдруг остановился у двери.","On Saturday everything went to plan. We reached the café almost on time, but Misha suddenly stopped at the door."],
 ["m","Подожди, а почему здесь так тихо? И почему свет не горит? Кафе закрыто?","Wait, why is it so quiet here? And why are the lights off? Is the café closed?"],
 ["f","Не знаю. Давай зайдём и посмотрим. Может быть, просто сломался выключатель.","I do not know. Let us go in and see. Maybe a switch is just broken."],
 ["f","Мы открыли дверь, и вдруг загорелся свет. Все закричали: «Сюрприз! С днём рождения!»","We opened the door and suddenly the light came on. Everyone shouted: 'Surprise! Happy birthday!'"],
 ["m","Ничего себе! Вы меня обманули! Я правда думал, что мы идём на ужин вдвоём.","Wow! You tricked me! I really thought we were going out to dinner, just the two of us."],
 ["g","Да, обманули! Зато смотри, какой торт: шоколадный, как ты любишь!","Yes, we tricked you! But look what a cake: chocolate, the way you like it!"],
 ["f","Миша ещё долго смеялся. Это был лучший день рождения в его жизни, так он сказал потом.","Misha laughed for a long time. It was the best birthday of his life, so he said afterwards."],
 ["m","Спасибо вам всем. Но в следующий раз, пожалуйста, предупредите хотя бы меня, что надо надеть рубашку!","Thank you all. But next time, please at least warn me that I need to put on a shirt!"]],
 gist:["What is the story about?",["Planning and holding a surprise party","Buying a cake","A dinner for two","A school reunion"],"Planning and holding a surprise party"],
 qs:[["What kind of cake does Misha like?",["Chocolate","Honey","Cheese","Fruit"],"Chocolate"],["Where is the party held?",["In a café","At home","In a park","At work"],"In a café"]],
 keys:[["кое-что","something (a particular thing not yet named)","Said when you are about to tell someone news."],["под любым предлогом","on any pretext",""],["ну ты даёшь","you are something! (informal)","Said with amazement, kindly or not."],["обожает","adores","From обожать."],["сюрприз","surprise",""]],
 gap:[[5,"шоколадный"],[11,"поужинать"]],use:[11,16],
 reply:{say:["g","Какой торт он любит?","What cake does he like?"],goal:"Say he likes chocolate cake.",ans:"Он любит шоколадный|Шоколадный|Шоколадный торт|Он любит шоколадный торт"}},
{id:"s25",lid:"c23",lvl:3,kind:"story",theme:"Work",t:"The first day",set:"Irina starts a new job and makes a small mistake. A story in four scenes.",
 cast:{f:"Irina",m:"Pasha",g:"Svetlana Petrovna, the manager"},
 parts:[[0,"Meeting the team",["Where is Irina's desk?",["Next to the window","In the kitchen","By the door","In the canteen"],"Next to the window"]],[6,"Lunch",["What does Pasha think of the program?",["Awkward, but you get used to it","Excellent","Impossible to learn","Very easy"],"Awkward, but you get used to it"]],[12,"A small mistake",["What mistake does Irina make?",["She sends the wrong file","She loses her keys","She arrives late","She breaks a computer"],"She sends the wrong file"]],[18,"The end of the day",["What does Irina decide in the end?",["A good manager matters more than software","The job is too hard","She should quit","The office is too noisy"],"A good manager matters more than software"]]],
 lines:[
 ["f","Сегодня мой первый день на новой работе. Я пришла рано, чтобы не опоздать.","Today is my first day at my new job. I came early so as not to be late."],
 ["g","Доброе утро, Ирина! Я Светлана Петровна, ваш руководитель. Давайте я покажу вам офис.","Good morning, Irina! I am Svetlana Petrovna, your manager. Let me show you the office."],
 ["g","Это наша кухня, здесь можно пить чай. А вот ваш стол, рядом с окном.","This is our kitchen, you can drink tea here. And here is your desk, next to the window."],
 ["f","Спасибо, очень удобно. Здесь так светло, мне нравится.","Thank you, very convenient. It is so bright here, I like it."],
 ["g","Рада слышать. Сейчас я познакомлю вас с Павлом, он будет помогать вам первые недели.","Glad to hear it. Now I will introduce you to Pavel; he will help you for the first few weeks."],
 ["m","Привет! Я Паша. Не волнуйся, сначала всем трудно. Через неделю ты уже будешь знать всё.","Hi! I am Pasha. Do not worry, it is hard for everyone at first. In a week you will know everything."],
 ["f","В обед Паша позвал меня в столовую. Там мы разговорились.","At lunch Pasha invited me to the canteen. There we got talking."],
 ["m","Ну как тебе здесь? Только честно, что думаешь?","So how do you like it here? Honestly, what do you think?"],
 ["f","Мне кажется, что коллектив очень приятный. Но я пока не понимаю, как работает программа.","It seems to me the team is very nice. But I do not yet understand how the program works."],
 ["m","Это нормально. Программа неудобная, согласен. Но когда привыкнешь, она не такая страшная.","That is normal. The program is awkward, I agree. But when you get used to it, it is not so scary."],
 ["f","А ты давно здесь работаешь?","Have you worked here long?"],
 ["m","Уже три года. Сначала хотел уйти, потому что много работы, но потом остался из-за людей.","Three years now. At first I wanted to leave because of the workload, but then I stayed because of the people."],
 ["f","После обеда я попробовала сама отправить документ клиенту. И, конечно, всё сделала неправильно.","After lunch I tried sending a document to a client myself. And of course I did everything wrong."],
 ["f","Я отправила не тот файл! Я чуть не заплакала.","I sent the wrong file! I almost cried."],
 ["g","Ирина, что случилось? Вы такая бледная.","Irina, what happened? You look so pale."],
 ["f","Светлана Петровна, простите, я отправила клиенту не тот файл. Я очень виновата.","Svetlana Petrovna, sorry, I sent the client the wrong file. It is entirely my fault."],
 ["g","Ничего страшного. Это бывает с каждым. Главное, что вы сразу сказали. Давайте вместе напишем клиенту.","Nothing terrible. It happens to everyone. The main thing is that you said so straight away. Let us write to the client together."],
 ["f","Мы написали письмо, и клиент ответил: «Не беспокойтесь, такое бывает». Я выдохнула.","We wrote a letter, and the client replied: 'Do not worry, it happens.' I breathed out."],
 ["f","Вечером я шла домой усталая, но довольная. Я поняла: хороший руководитель важнее, чем удобная программа.","In the evening I walked home tired but happy. I understood: a good manager matters more than a convenient program."],
 ["m","До завтра, Ира! Ты молодец. Завтра будет легче.","See you tomorrow, Ira! Well done. Tomorrow will be easier."]],
 gist:["What is the story about?",["A first day at a new job","A job interview","A holiday","A complaint"],"A first day at a new job"],
 qs:[["How long has Pasha worked there?",["Three years","One year","Three months","Ten years"],"Three years"],["How does the manager react to the mistake?",["Calmly, and she helps","She is angry","She sacks Irina","She ignores it"],"Calmly, and she helps"]],
 keys:[["ничего страшного","no harm done, it is nothing terrible","The kind answer to an apology."],["чуть не","almost (did)","Я чуть не заплакала = I almost cried."],["разговорились","got talking","From разговориться: to start chatting and keep going."],["виновата","to blame (a woman says it)","A man says виноват."],["сначала","at first",""]],

 reply:{say:["g","Ирина, что случилось?","Irina, what happened?"],goal:"Apologise: you sent the wrong file.",ans:"Простите, я отправила не тот файл|Извините, я отправила не тот файл|Я отправила не тот файл|Я отправил не тот файл|Простите, я отправил не тот файл|Извините, я отправил не тот файл"}},
{id:"s26",lid:"c24",lvl:4,kind:"talk",theme:"Friends",t:"Kitchen talk after midnight",set:"Three friends talk late at night about a big decision. Relaxed, informal speech, with all the fillers.",
 cast:{f:"Vika",m:"Dima",g:"Nastya"},
 parts:[[0,"Big news",["What news does Vika have?",["A job offer in Kazan","She is getting married","She is buying a flat","She has lost her job"],"A job offer in Kazan"]],[6,"For and against",["What does Dima suggest?",["Try it for a year","Refuse at once","Ask her mum","Move together"],"Try it for a year"]],[12,"The decision",["When must Vika reply?",["By Friday","By tomorrow","By next month","By Monday"],"By Friday"]],[16,"After midnight",["What do the friends do at the end?",["Make tea and support her","Go to a restaurant","Phone her boss","Go to bed"],"Make tea and support her"]]],
 lines:[
 ["f","Слушай, мне надо вам кое-что рассказать. Только не перебивайте, ладно?","Listen, I need to tell you something. Just do not interrupt, OK?"],
 ["m","Ну всё, началось. Говори уже, мы слушаем.","Well, here we go. Go on then, we are listening."],
 ["f","Мне предложили работу в Казани. Ну, типа, очень хорошую. Зарплата больше, и команда крутая.","I have been offered a job in Kazan. Like, a really good one. The salary is higher and the team is cool."],
 ["g","Подожди, в Казани? Это же далеко! Ты что, серьёзно хочешь уехать?","Wait, in Kazan? That is far! You really want to leave?"],
 ["f","Не знаю, честно. Я щас об этом только и думаю. Потому и позвала вас.","I do not know, honestly. I am thinking of nothing else right now. That is why I called you over."],
 ["m","Ясно. Тогда давай по порядку. Чем тебе не нравится работа здесь?","Clear. Then let us go in order. What do you not like about your job here?"],
 ["f","Да всё нормально, но я там уже пять лет. Ничего не меняется, каждый день одно и то же.","It is all fine, but I have been there five years. Nothing changes, every day the same."],
 ["g","Ну, это понятно. Но здесь у тебя мы, твоя квартира, мама рядом. Всё родное.","Well, that is understandable. But here you have us, your flat, your mum nearby. Everything familiar."],
 ["m","Настя, подожди. Вика же не навсегда уезжает. Можно попробовать на год, а потом посмотреть.","Nastya, hold on. Vika is not leaving for ever. She can try for a year and then see."],
 ["f","Вот! Именно это я и хотела сказать. Один год, а там будет видно.","Exactly! That is just what I wanted to say. One year, and then we will see."],
 ["g","Ладно, ладно, уговорили. Но ты нас там не забудешь, да? Будешь приезжать?","OK, OK, you have convinced me. But you will not forget us there, will you? You will come back?"],
 ["f","Конечно буду! Каждый месяц, честное слово. Казань ведь недалеко, всего ночь на поезде.","Of course I will! Every month, word of honour. Kazan is not far, only a night by train."],
 ["m","Слушай, а ты уже сказала им, что согласна?","Listen, have you already told them you agree?"],
 ["f","Нет, пока нет. Мне надо ответить до пятницы. Вот я и думаю.","No, not yet. I need to reply by Friday. So I am thinking."],
 ["g","Ну, по-моему, и думать тут нечего. Поезжай! Мы тебе поможем с переездом.","Well, I think there is nothing to think about. Go! We will help you move."],
 ["m","Точно. Только чур, комната для гостей. Мы же будем приезжать к тебе.","Exactly. Just - dibs - a guest room. We will be visiting you too."],
 ["f","Короче, вы лучшие. Я щас, наверное, заплачу.","In short, you are the best. I am probably going to cry now."],
 ["g","Только не плачь! Давай лучше чай поставим. Или у тебя есть что-нибудь покрепче?","Just do not cry! Let us put the kettle on instead. Or do you have something stronger?"],
 ["f","Чай, чай. Завтра рано вставать. А в пятницу я позвоню им и скажу «да».","Tea, tea. Tomorrow I have to get up early. And on Friday I will ring them and say 'yes'."],
 ["m","Вот это правильно. За твою новую жизнь! Ой, чайник кипит, я щас налью.","Now that is right. To your new life! Oh, the kettle is boiling, I will pour it now."]],
 gist:["What is the conversation about?",["A friend deciding whether to move for a job","Planning a party","Choosing a flat","Going on holiday"],"A friend deciding whether to move for a job"],
 qs:[["Why does Vika want a change?",["Nothing changes at her job","She dislikes her friends","The salary is low","Her flat is small"],"Nothing changes at her job"],["How often does she promise to visit?",["Every month","Every week","Once a year","Never"],"Every month"]],
 keys:[["слушай","listen (to get attention)","An informal opener. You do not literally want them to listen: it means hey, look."],["короче","in short, anyway","A very common filler that moves the talk on."],["щас","right now (casual сейчас)","The spoken short form. You will hear it more than you will read it."],["ну, типа","like, sort of (filler)",""],["уговорили","you have convinced me","From уговорить: to talk someone round."]],
 gap:[[2,"предложили"],[9,"Именно"]],use:[0,11],
 reply:{say:["g","Ты что, серьёзно хочешь уехать?","Do you really want to leave?"],goal:"Say that honestly you do not know, you think about it all the time.",ans:"Не знаю, честно|Не знаю, честно, я только об этом и думаю|Честно, не знаю|Не знаю|Я только об этом и думаю"}},
{id:"s27",lid:"c24",lvl:4,kind:"talk",theme:"Friends",t:"The trip that went wrong",set:"Voice messages and replies between friends planning a day at the dacha. Fast, casual and full of natural spoken Russian.",
 cast:{f:"Alina",m:"Kostya",g:"Polina"},
 parts:[[0,"The first voice message",["Where does Kostya suggest going?",["His brother's dacha","The sea","A café","A museum"],"His brother's dacha"]],[3,"Alina replies",["What does Alina offer to buy?",["The meat","The bread","The drinks","The tickets"],"The meat"]],[7,"Saturday morning",["What is the problem on Saturday?",["The car will not start","They lost the meat","It is raining","Polina is ill"],"The car will not start"]],[13,"At the dacha",["How did they finally get there?",["By train","By bus","On foot","By taxi"],"By train"]]],
 lines:[
 ["m","Привет, Алин! Это Костя. Слушай, короче, насчёт субботы. Я щас еду на работу, поэтому говорю на ходу, извини, если шумно.","Hi Alin! It is Kostya. Listen, anyway, about Saturday. I am on my way to work now, so I am talking on the go, sorry if it is noisy."],
 ["m","Я тут подумал: давайте поедем на дачу к моему брату? Погода обещает быть классной, можно пожарить шашлык. Только скажи Полине, чтобы взяла плед.","I was thinking: shall we go to my brother's dacha? The weather promises to be great, we can barbecue. Just tell Polina to bring a blanket."],
 ["m","В общем, напиши мне, как будешь готова. Ну всё, пока, мне выходить!","Anyway, text me when you are ready. OK, bye, I am getting off!"],
 ["f","Привет, Кость! Получила твоё сообщение. Дача — это супер, я за. Полине я уже написала, она в восторге.","Hi Kost! Got your message. The dacha is great, I am in. I have already written to Polina, she is thrilled."],
 ["f","Только давай договоримся про время. Я не могу рано, у меня утром дела. Выезжаем часов в одиннадцать?","Just let us agree on the time. I cannot do early, I have things to do in the morning. Shall we set off around eleven?"],
 ["f","И ещё: кто купит мясо? Я могу заехать в магазин по дороге, если скажешь, сколько брать.","And also: who will buy the meat? I can pop into a shop on the way if you tell me how much to get."],
 ["m","Окей, в одиннадцать — отлично. Мяса возьми килограмма три, нас же шестеро, а Серёга ест за двоих.","OK, eleven is great. Take about three kilos of meat, there are six of us, and Seryoga eats for two."],
 ["g","Привет, ребята! Это Полина. Я щас стою у машины и, короче, у нас проблема. Машина не заводится!","Hi guys! It is Polina. I am standing by the car now and, well, we have a problem. The car will not start!"],
 ["g","Костя пытался завести её минут двадцать, но мотор только чихает. Серёга говорит, что, наверное, сел аккумулятор.","Kostya tried to start it for about twenty minutes, but the engine only splutters. Seryoga says the battery is probably dead."],
 ["g","А я, между прочим, уже купила и мясо, и угли, и даже взяла плед. Обидно!","And I, by the way, have already bought the meat and the charcoal, and even brought the blanket. What a shame!"],
 ["m","Так, не паникуем. Серёга звонит знакомому, у которого есть кабель. Он живёт тут, за углом.","Right, no panic. Seryoga is ringing an acquaintance who has a cable. He lives right here, round the corner."],
 ["f","Ну а я предлагаю запасной план. Если машина не заведётся, поедем на электричке. Она идёт каждые полчаса.","Well I suggest a backup plan. If the car does not start, we will go by train. It runs every half hour."],
 ["g","О, это мысль! Электричка, плед и шашлык, чем плохо? Даже веселее получится!","Oh, that is an idea! Train, blanket and barbecue, what is wrong with that? It will even be more fun!"],
 ["m","В итоге машина так и не завелась. Мы поехали на электричке, и знаешь, было даже круто.","In the end the car never started. We went by train, and, you know, it was actually cool."],
 ["m","Всю дорогу пели песни, Серёга рассказывал анекдоты, а Полина умудрилась уснуть у меня на плече.","All the way we sang songs, Seryoga told jokes, and Polina managed to fall asleep on my shoulder."],
 ["g","Эй, я не спала! Я просто закрыла глаза на минутку!","Hey, I was not asleep! I just closed my eyes for a minute!"],
 ["f","Ага, конечно. А потом мы пришли на дачу, и оказалось, что брат Кости уже приготовил нам суп.","Yeah, sure. And then we arrived at the dacha, and it turned out Kostya's brother had already made us soup."],
 ["m","Вот так суббота, которая пошла не по плану, стала лучшей за всё лето. Надо повторить!","That is how a Saturday that went wrong turned out the best of the whole summer. We must repeat it!"]],
 gist:["What happens in this story?",["A trip goes wrong but turns out well","A birthday party","A job interview","A flat search"],"A trip goes wrong but turns out well"],
 qs:[["How many people are going?",["Six","Three","Ten","Two"],"Six"],["What did Polina bring?",["A blanket","A guitar","Soup","A tent"],"A blanket"]],
 keys:[["на ходу","on the go, while moving","Говорю на ходу = I am talking as I walk."],["в итоге","in the end, as a result",""],["не заводится","will not start (an engine)","From заводиться."],["между прочим","by the way",""],["не паникуем","let us not panic","The we-form used as an invitation."]],
