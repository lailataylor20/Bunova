 lines:[
 ["g","Дедушка, расскажи, как ты первый раз приехал в Москву! Ты обещал.","Grandpa, tell me how you first came to Moscow! You promised."],
 ["m","Ну, слушай. Мне было восемнадцать лет, и я никогда не видел большого города. Я жил в деревне, под Тулой.","Well, listen. I was eighteen and had never seen a big city. I lived in a village near Tula."],
 ["m","Мама собрала мне чемодан, положила бутерброды и дала десять рублей. Сказала: «Толя, не потеряйся».","Mum packed me a suitcase, put in sandwiches and gave me ten roubles. She said: 'Tolya, do not get lost.'"],
 ["g","И ты потерялся?","And did you get lost?"],
 ["m","Ещё как! Но это было потом. Сначала я ехал в поезде и всю ночь не спал от волнения.","And how! But that was later. First I travelled on the train and did not sleep all night from excitement."],
 ["m","Утром я приехал на вокзал и вышел на площадь. Там было столько людей, машин и шума, что у меня закружилась голова.","In the morning I arrived at the station and went out onto the square. There were so many people, cars and so much noise that my head spun."],
 ["m","У меня был адрес общежития на бумажке, но я не знал, куда идти. Я спросил у одного человека, он показал налево, а я пошёл направо.","I had the hostel's address on a scrap of paper, but I did not know where to go. I asked one man, he pointed left, and I went right."],
 ["g","Ой, дедушка! Почему направо?","Oh grandpa! Why right?"],
 ["m","Не знаю, от страха, наверное. Я шёл часа три и совсем заблудился. Начался дождь, а зонта у меня, конечно, не было.","I do not know, from fear probably. I walked about three hours and got completely lost. It began to rain, and I of course had no umbrella."],
 ["m","Я сел на лавочку, достал бутерброд и подумал: всё, домой поеду.","I sat on a bench, took out a sandwich and thought: that is it, I am going home."],
 ["g","Бедный дедушка!","Poor grandpa!"],
 ["m","И тут ко мне подошла женщина с большим зонтом. Она посмотрела на меня и сказала: «Молодой человек, вы чего тут сидите под дождём?»","And then a woman with a big umbrella came up to me. She looked at me and said: 'Young man, why are you sitting here in the rain?'"],
 ["m","Я показал ей бумажку с адресом. Она засмеялась и ответила: «Так это же рядом! Пойдёмте, я вас провожу».","I showed her the paper with the address. She laughed and answered: 'But that is close by! Come on, I will see you there.'"],
 ["g","Какая добрая женщина!","What a kind woman!"],
 ["m","Добрая, да. Мы шли минут десять, и она всю дорогу рассказывала мне про Москву: где купить хлеб, как ездить на метро, где дешёвая столовая.","Kind, yes. We walked about ten minutes, and all the way she told me about Moscow: where to buy bread, how to take the metro, where the cheap canteen is."],
 ["m","Я потом много лет вспоминал эту женщину. Даже имя запомнил: Анна Сергеевна.","For many years afterwards I remembered that woman. I even remembered her name: Anna Sergeevna."],
 ["g","А бабушку ты когда встретил?","And when did you meet grandma?"],
 ["m","Через год, на заводе. Она работала в соседнем цеху. Я увидел её и сразу понял: вот она, моя судьба.","A year later, at the factory. She worked in the next workshop. I saw her and understood at once: that is her, my destiny."],
 ["g","Ой, как романтично! А бабушка что сказала?","Oh, how romantic! And what did grandma say?"],
 ["m","Бабушка сказала, что я дурак, потому что цветы нельзя дарить в чётном количестве. Но замуж всё равно вышла.","Grandma said I was a fool because you must not give flowers in an even number. But she married me all the same."]],

/* sections of a piece: [{i, from, to, t, q}] (a piece without parts is one section) */
function epParts(ep){const n=ep.lines.length;if(!ep.parts)return [{i:0,from:0,to:n,t:'',q:null}];return ep.parts.map((p,i)=>({i,from:p[0],to:ep.parts[i+1]?ep.parts[i+1][0]:n,t:p[1],q:p[2]||null}));}
/* longer passages for shadowing: up to three lines in a row by the same voice, kept under 380 characters (the voice limit is 400) */
function epPassages(ep){const out=[];epParts(ep).forEach(pt=>{let i=pt.from;while(i<pt.to){let j=i,txt=ep.lines[i][1];const w=ep.lines[i][0];while(j+1<pt.to&&ep.lines[j+1][0]===w&&j-i<2&&(txt+' '+ep.lines[j+1][1]).length<=380){j++;txt+=' '+ep.lines[j][1];}
  if(j>i)out.push({w,t:txt,en:ep.lines.slice(i,j+1).map(l=>l[2]).join(' '),from:i,to:j+1});i=j+1;}});return out;}
/* about how long a piece takes to hear, in minutes (natural speech is roughly 2 words a second) */
function epMinutes(ep){const w=ep.lines.reduce((a,l)=>a+l[1].split(/\s+/).length,0);return Math.max(1,Math.round(w/2/60*10)/10);}

/* Conversation partner scenarios. Each unlocks after the lesson ("need") that teaches its language.

   turns: say/en = partner line, goal = what you should say, model = a natural answer,
   acc = patterns, any of which accepts your reply (checked in lower case, ё written as е, without punctuation),
   ok = optional reaction [Russian, English], tip = advice shown at the end if the reply lacks the pattern in tip[0],

function distractors(it,field,pool){const cand=shuffle(pool.filter(x=>x.id!==it.id&&x.col===it.col&&x[field]!==it[field]));cand.sort((a,b)=>(b.cat===it.cat)-(a.cat===it.cat));

  if(f.done.length===f.cards.length)flipEnd();render();return;}

/* ---------- speaking: microphone (browser speech recognition), conversation partner, shadowing ---------- */
const SRC=(typeof window!=='undefined'&&(window.SpeechRecognition||window.webkitSpeechRecognition))||null;
let recog=null;

function micListen(onText,onState){if(!SRC)return false;stopAudio();try{if(recog)recog.abort();}catch(e){}

 /* finish exactly once, whatever the browser does: some phones never send "end" */
 const finish=(kind,info)=>{if(over)return;over=true;clearTimeout(wd);clearTimeout(hard);if(recog===r)recog=null;try{r.abort();}catch(e){}
  if(kind==='error')onState('error',info);else if(alts&&alts.length)onText(alts);else if(interim)onText([interim]);else onState('nothing','');};
 const arm=ms=>{clearTimeout(wd);wd=setTimeout(()=>{try{r.stop();}catch(e){}hard=setTimeout(()=>finish('end'),1500);},ms);};
 r.onresult=e=>{arm(2500);const res=e.results[e.results.length-1];if(res.isFinal){alts=[];for(let k=0;k<res.length;k++)alts.push(res[k].transcript);finish('end');}else{interim=res[0].transcript;onState('interim',interim);}};
 r.onerror=e=>{const er=e&&e.error||'error';if(er==='aborted')return finish('end');if(er==='no-speech')return finish('end');finish('error',er);};
 r.onspeechend=()=>{try{r.stop();}catch(e){}};
 r.onend=()=>finish('end');
 try{r.start();}catch(e){return false;}arm(9000);onState('listening','');return true;}
function micStop(){try{if(recog){const r=recog;r.stop();setTimeout(()=>{try{r.abort();}catch(e){}},1200);}}catch(e){}}
const MIC_ERR={'not-allowed':'Microphone access is blocked. Allow it in your browser settings, or type instead.','service-not-allowed':'Speech recognition is not available here. You can type instead.','no-speech':"I didn't hear anything. Tap the microphone and speak after the beep.",'audio-capture':'No microphone was found. You can type instead.','network':'Speech recognition needs an internet connection.'};
const MIC_NOTE='Your browser cannot listen to speech here. Type instead, or tap the microphone on your phone keyboard after adding a Russian keyboard.';

/* comparing replies: lower case, ё as е, no punctuation. \b in patterns means a Cyrillic-aware word edge. */
const talkNorm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const reCache={};
function talkRe(p){return reCache[p]||(reCache[p]=new RegExp(p.replace(/\\b(?=[a-zа-я(\[])/g,'(?:^|[^a-zа-я0-9])').replace(/\\b/g,'(?=[^a-zа-я0-9]|$)')));}
const talkAccepts=(tn,text)=>{const c=talkNorm(text);return !!c&&tn.acc.some(p=>talkRe(p).test(c));};

/* ---------- conversation partner ---------- */
const talkUnlocked=sc=>{const l=LESSONS.find(x=>x.id===sc.need);return !l||lessonDone(l);};
const talkLessonNo=sc=>LESSONS.findIndex(x=>x.id===sc.need)+1;
function talkOpen(id){const sc=TALKBY[id];if(!sc)return;stopAudio();micStop();
 ui.talk={id,phase:'intro',i:0,log:[],tries:0,notes:[],own:0,helped:0,showEn:S.set.talkEn!==undefined?!!S.set.talkEn:doneCount()<10,showModel:false,mic:'idle',heard:'',used:false};}
function talkSpeak(lines){const sc=TALKBY[ui.talk.id];if(!lines.length)return;sayAll(lines.map(l=>({t:l[0],w:'!'+sc.who})),false,null,true);}
function talkStart(){const g=ui.talk,sc=TALKBY[g.id];g.phase='chat';g.i=0;g.log=[{p:1,ru:sc.turns[0].say,en:sc.turns[0].en}];talkSpeak([[sc.turns[0].say]]);}
function talkNote(g,n){n.turn=g.i;const k=g.notes.findIndex(x=>x.turn===g.i);if(k<0){g.notes.push(n);return;}const o=g.notes[k];if(o.tip&&!n.tip)g.notes[k]=n;else if(!o.tip&&!n.tip&&o.why!==n.why)o.why+=' '+n.why;else o.you=n.you;}
function talkReply(alts,viaModel){const g=ui.talk,sc=TALKBY[g.id],tn=sc.turns[g.i];if(!tn)return;
 alts=(alts||[]).map(a=>String(a).trim()).filter(Boolean);if(!alts.length)return;
 const hitIdx=alts.findIndex(a=>talkAccepts(tn,a)),said=hitIdx>=0?alts[hitIdx]:alts[0];g.heard='';
 g.log.push({u:1,ru:said});
 if(hitIdx>=0){const c=talkNorm(said);
  (tn.fix||[]).map(f=>typeof f==='string'?TALK_FIX[f]:f).filter(Boolean).forEach(f=>{if(talkRe(f[0]).test(c)){talkNote(g,{you:said,model:tn.model,why:f[1]});if(f[2])errTag(f[2],false);}});
  if(tn.tip&&!talkRe(tn.tip[0]).test(c))talkNote(g,{you:said,model:tn.model,why:tn.tip[1],tip:1});
  if(viaModel||g.used){g.helped++;if(!viaModel)talkNote(g,{you:said,model:tn.model,why:'You got there with the hint. Say the natural version out loud a few times.',tip:1});}else if(g.tries>0){g.own++;}else g.own++;
  errTag('speak',!(viaModel||g.used));
  g.tries=0;g.used=false;g.showModel=false;g.i++;
  const next=sc.turns[g.i],say=[];if(tn.ok){g.log.push({p:1,ru:tn.ok[0],en:tn.ok[1]});say.push(tn.ok);}
  if(next){g.log.push({p:1,ru:next.say,en:next.en});say.push([next.say]);talkSpeak(say);}
  else{talkSpeak(say);talkFinish();}
  return true;}
 g.tries++;if(g.tries===1)errTag('speak',false);
 if(g.tries>=2){g.showModel=true;talkNote(g,{you:said,model:tn.model,why:'Here is a natural way to say this. Try it out loud.',tip:1});}
 const cl=TALK_CLAR[sc.who+(sc.formal?'F':'I')];g.log.push({p:1,ru:cl[0],en:cl[1],clar:1});talkSpeak([cl]);return false;}
function talkFinish(){const g=ui.talk,sc=TALKBY[g.id],n=sc.turns.length,pct=Math.round(g.own/n*100),prev=S.talk[g.id]||{best:0,n:0};
 S.talk[g.id]={best:Math.max(prev.best||0,pct),n:(prev.n||0)+1,t:Date.now()};S.xp+=10+g.own*5;logHist('talk',n,g.own);
 const k=dkey(Date.now());S.days[k]=(S.days[k]||0)+n;checkAch();save();g.phase='end';g.pct=pct;sfx(pct>=60?'win':'coin');if(pct>=60)setTimeout(()=>{try{confetti();}catch(e){}},50);}
function talkMic(){const g=ui.talk;if(g.mic==='listening'){micStop();return;}
 const ok=micListen(alts=>{g.mic='idle';render();talkReply(alts);render();talkScroll();},(st,info)=>{
  if(st==='listening'){g.mic='listening';g.heard='';render();}
  else if(st==='interim'){g.heard=info;const el=document.getElementById('heard');if(el)el.textContent=info;}

  else if(st==='nothing'){g.mic='idle';toast(MIC_ERR['no-speech']);render();}});

function talkScroll(){const el=document.querySelector('.chat');if(el&&el.lastElementChild&&el.lastElementChild.scrollIntoView){try{el.lastElementChild.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}}}
/* the conversation's lines, plus the natural model answers, as shadowing practice */
function talkShadowTasks(sc){const ts=[];sc.turns.forEach(tn=>{ts.push({k:'shadow',ru:tn.say,en:tn.en,who:'!'+sc.who,tag:'speak'});ts.push({k:'shadow',ru:tn.model,en:tn.goal,tag:'speak'});});return ts.slice(0,8);}

/* ---------- shadowing: listen, say it aloud, compare word by word ---------- */
function shadowScore(target,heard){const tw=talkNorm(target).split(' ').filter(Boolean),hw=talkNorm(heard).split(' ').filter(Boolean);const pool=hw.slice();
 const marks=tw.map(w=>{const i=pool.findIndex(h=>h===w||(w.length>4&&h.slice(0,w.length-2)===w.slice(0,w.length-2)));if(i>=0){pool.splice(i,1);return 1;}return 0;});
 return {pct:tw.length?Math.round(marks.reduce((a,b)=>a+b,0)/tw.length*100):0,marks,words:String(target).split(/\s+/)};}
function shadowTasksFromSeen(n){const out=[],seen=new Set();
 ITEMS.filter(i=>S.cards[i.id]&&S.cards[i.id].seen).sort((a,b)=>mast(a.id)-mast(b.id)).forEach(i=>{if(i.ex&&!seen.has(i.ex)&&i.ex.split(' ').length>=3){seen.add(i.ex);out.push({k:'shadow',id:i.id,ru:i.ex,en:i.exEn,tag:'speak'});}});
 EPISODES.filter(e=>S.eps[e.id]).forEach(e=>e.lines.forEach(l=>{if(!seen.has(l[1])&&l[1].split(' ').length>=2){seen.add(l[1]);out.push({k:'shadow',ru:l[1],en:l[2],who:l[0],tag:'speak'});}}));
 if(out.length<n)LESSONS.slice(0,Math.max(1,doneCount())).forEach(l=>l.ex.forEach(e=>{if(!seen.has(e[0])){seen.add(e[0]);out.push({k:'shadow',ru:e[0],en:e[2],tag:'speak'});}}));

function shadowMic(){const r=ui.run,t=cur(),st=r.st;if(st.checked)return;if(st.mic==='listening'){micStop();return;}
 const ok=micListen(alts=>{st.mic='idle';let best=null;alts.forEach(a=>{const s=shadowScore(t.ru,a);if(!best||s.pct>best.pct)best=Object.assign(s,{heard:a});});
  st.sc=best;st.tries=(st.tries||0)+1;if(best.pct>=70||st.tries>=3){commit(t,{ok:best.pct>=70,ans:t.ru},best.heard);sfx(best.pct>=70?'coin':'no');}render();afterCheckScroll();},
  (s,info)=>{if(s==='listening'){st.mic='listening';render();}else if(s==='interim'){const el=document.getElementById('heard');if(el)el.textContent=info;}else if(s==='error'){st.mic='idle';toast(MIC_ERR[info]||'Speech recognition stopped. Try again, or tap "I said it".');render();}else if(s==='nothing'){st.mic='idle';toast(MIC_ERR['no-speech']);render();}});
 if(!ok){st.noMic=true;render();}}

/* =====================================================================
   COACH: a rule-based tutor that runs entirely in the browser.
   It reads only what is already stored on this device (word steps, per-skill answer history, response times, weekly log)
   and turns it into: six progress indicators, a ranked list of recommendations with the real numbers behind each one,
   and a weekly summary. No server, no AI service. Views call coachRecs(), coachIndicators(), coachWeek() and coachPath();
   a real AI tutor could later replace coachRecs() without touching anything else.
   ===================================================================== */

/* ---------- weekly log (new, optional data: S.wk) ---------- */
const wkOf=t=>{const d=new Date(t);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d.getTime());};   /* the Monday of that week */
function wkRec(t){const k=wkOf(t||Date.now());let w=S.wk[k];
 if(!w){w=S.wk[k]={n:0,ok:0,xp:0,up:0,sk:{},tags:{}};const ks=Object.keys(S.wk).sort();while(ks.length>12)delete S.wk[ks.shift()];}return w;}
function coachLog(tag,ok){const g=TAGS[tag]&&TAGS[tag][1];if(!g)return;const w=wkRec();w.n++;if(ok)w.ok++;
 const a=w.sk[g]||(w.sk[g]=[0,0]);a[0]++;if(ok)a[1]++;const b=w.tags[tag]||(w.tags[tag]=[0,0]);b[0]++;if(ok)b[1]++;
 /* a weak spot that recovers is a real achievement: remember it and say so once */
 const e=S.err[tag],wk=S.flags.weak||(S.flags.weak={});
 if(weakRate(tag)>=0.34)wk[tag]=1;
 else if(wk[tag]&&e&&e.r.length>=8&&weakRate(tag)<=0.15){delete wk[tag];S.flags.fixed=(S.flags.fixed||0)+1;S.flags.fixedLast=Date.now();try{toast('You have turned this around: '+TAGS[tag][0]+' 🎉');}catch(x){}}}

/* ---------- helpers over the existing history ---------- */
const COACH_TAGS=()=>({listening:['listen','stress'],reading:['read'],grammar:Object.keys(TAGS).filter(t=>TAGS[t][1]==='grammar'),sentence:['order','tr','conv','phone'],speaking:['speak']});
function tagAcc(tags){let n=0,ok=0;tags.forEach(t=>{const e=S.err[t];if(e){n+=e.r.length;ok+=e.r.filter(Boolean).length;}});return {n,acc:n?ok/n:null};}
const avg=xs=>xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null;
const pc=v=>Math.round(v*100);
const lc=s=>String(s||'').toLowerCase();
function blend(parts){const ps=parts.filter(p=>p&&p.v!==null&&p.w>0);if(!ps.length)return null;const w=ps.reduce((a,p)=>a+p.w,0);return ps.reduce((a,p)=>a+p.v*p.w,0)/w;}
const seenItems=()=>ITEMS.filter(i=>S.cards[i.id]&&S.cards[i.id].seen);

/* what you can do with each word: recognise it, recall it, use it in a sentence, understand it spoken, say it aloud */
function coachAbilities(){const s=seenItems(),c=i=>S.cards[i.id];
 return {n:s.length,recognise:s.filter(i=>c(i).rg>=2).length,recall:s.filter(i=>c(i).pr>=2).length,use:s.filter(i=>c(i).us>=1).length,hear:s.filter(i=>c(i).li>=1).length,say:s.filter(i=>c(i).sp>=1).length};}

/* six indicators, each 0..1 or null while there is too little data. Completing an exercise is never enough on its own:
   vocabulary counts only words recalled correctly more than once and not left unreviewed for weeks; the rest use recent answers. */
function coachIndicators(){const T=COACH_TAGS(),now=Date.now(),sn=seenItems();
 const kept=sn.filter(i=>{const c=S.cards[i.id];return c.b>=3&&c.pr>=2&&c.due>now-14*DAY;}).length;
 const g=tagAcc(T.grammar),sc=tagAcc(T.sentence),li=tagAcc(T.listening),rd=tagAcc(T.reading);
 const epS=Object.values(S.eps).map(e=>e.s/100),rdS=Object.keys(S.read).map(k=>(S.read[k].s||0)/100);
 const listening=blend([{v:li.n>=6?li.acc:null,w:Math.min(li.n,12)},{v:epS.length?avg(epS):null,w:epS.length*4}]);
 const reading=blend([{v:rd.n>=6?rd.acc:null,w:Math.min(rd.n,12)},{v:rdS.length?avg(rdS):null,w:rdS.length*4}]);
 const act=Object.keys(S.days).filter(k=>S.days[k]>0&&now-new Date(k+'T12:00:00').getTime()<14*DAY).length;
 return [
  {k:'vocab',label:'Vocabulary retention',v:sn.length>=5?kept/sn.length:null,note:sn.length>=5?kept+' of '+sn.length+' words you have studied are recalled and still fresh':'Study a few more words to see this'},
  {k:'grammar',label:'Grammar accuracy',v:g.n>=6?g.acc:null,note:g.n>=6?'Your last '+g.n+' answers on grammar topics':'Needs a few more grammar answers'},
  {k:'reading',label:'Reading comprehension',v:reading,note:reading!==null?'Reading questions and passages':'Open a reading passage to see this'},
  {k:'listening',label:'Listening comprehension',v:listening,note:listening!==null?'Listening questions, dictation and episodes':'Try some listening practice to see this'},
  {k:'sentence',label:'Sentence construction',v:sc.n>=6?sc.acc:null,note:sc.n>=6?'Building and translating sentences, last '+sc.n+' answers':'Build a few sentences to see this'},
  {k:'consistency',label:'Consistency',v:Object.keys(S.days).length>=2?Math.min(1,act/10):null,note:act+' of the last 14 days. Ten is plenty, and missed days cost nothing'}];}

/* where you are on the path from beginner to intermediate */
function coachPath(){return LEVELS.map(([lv,desc])=>{const ls=LESSONS.filter(l=>l.lvl===lv),d=ls.filter(lessonDone).length;return {lvl:lv,desc,done:d,total:ls.length};});}
const pathNow=()=>{const p=coachPath();return p.find(x=>x.done<x.total)||p[p.length-1];};

/* words you answer correctly but slowly: knowing is not yet fluency */
function slowWords(){const xs=ITEMS.filter(i=>{const c=S.cards[i.id];return c&&c.rn>=3&&c.rt>0&&c.ok>=3;});if(xs.length<6)return [];
 const med=xs.map(i=>S.cards[i.id].rt).sort((a,b)=>a-b)[Math.floor(xs.length/2)];
 return xs.filter(i=>S.cards[i.id].rt>Math.max(6000,med*2)).sort((a,b)=>S.cards[b.id].rt-S.cards[a.id].rt).map(i=>i.id);}
const lessonFor=tag=>LESSONS.find(l=>l.x&&l.x.some(a=>a.includes(tag)));

/* ---------- recommendations: ranked rules, each explained with real numbers ---------- */
function coachRecs(){const R=[],T=COACH_TAGS(),ind=Object.fromEntries(coachIndicators().map(x=>[x.k,x])),nx=nextLesson(),done=doneCount();
 const add=(prio,id,title,why,btn,act,data,more)=>R.push({prio,id,title,why,btn,act,data:data||{},more:more||null});
 const started=ITEMS.some(i=>S.cards[i.id]&&S.cards[i.id].seen);
 if(!started&&!done){if(nx)add(1,'first','Start with your first lesson','Each lesson takes about ten minutes and builds the sounds, words and phrases you need first. As you answer, this page learns what to focus on.','Start Lesson 1','openLesson',{id:nx.id});return R;}
 /* reviews that are due */
 const due=dueSorted();if(due.length){const old=Math.floor((Date.now()-S.cards[due[0]].due)/DAY);
  add(due.length>=8?10:30,'due',due.length+' word'+(due.length>1?'s':'')+' to review','These are due now. Reviewing just before you would forget is what makes words stay.'+(old>=2?' The oldest has been waiting '+old+' days.':''),'Start session','startPlan');}
 /* repeated mistakes by topic */
 const wt=weakTags()[0];if(wt){const e=S.err[wt.tag],n=e.r.length,L=lessonFor(wt.tag),name=TAGS[wt.tag][0];
  add(15,'weak',name,'You missed '+pc(wt.rate)+'% of your last '+n+' answers on '+lc(name)+'. Let us revisit the idea before moving on.','Practise this','targeted',{tag:wt.tag},L&&LESSONS.indexOf(L)>=0?['Revisit Lesson '+(LESSONS.indexOf(L)+1),'openLesson',{id:L.id}]:null);}
 /* listening behind reading */
 const r=ind.reading.v,l=ind.listening.v;
 if(r!==null&&l!==null&&r-l>=0.12)add(12,'listenGap','Listening is behind your reading','You are reading at '+pc(r)+'% but understanding speech at '+pc(l)+'%. Let us practise hearing words you already know, in context.','Listening practice','lStart',{go:1});
 else if(l!==null&&l<0.7&&tagAcc(T.listening).n>=8)add(14,'listenLow','Your ears need more practice','Your recent listening accuracy is '+pc(l)+'%. A little every day, with the audio only, works better than one long session.','Listening practice','lStart',{go:1});
 /* repeated words */
 const lcs=leeches();if(lcs.length){const w=lcs.slice(0,3).map(id=>BY[id].ru);add(18,'leech','Words that keep slipping','You have forgotten '+w.join(', ')+(lcs.length>3?' and '+(lcs.length-3)+' more':'')+' several times. They come back in new sentences until they stick.','Practise them','leechStart',{go:1});}
 /* recognise but not produce */
 const kn=knownNotMade();if(kn.length>=6)add(20,'produce','Move from recognising to producing','You can recognise '+kn.length+' words but have not yet produced them yourself. Typing or building them turns passive knowledge into speech.','Produce them','pStart',{go:1});
 /* speaking */
 const talks=Object.keys(S.talk).length,sp=tagAcc(T.speaking);
 if(!talks&&done>=2&&TALKS.some(talkUnlocked))add(25,'talk0','Have your first conversation','You have finished '+done+' lessons but not yet spoken in a scene. Speaking is where the words come together.','Start a conversation','goRoute',{r:'talk'});
 else if(sp.n>=6&&sp.acc<0.6)add(22,'speakLow','Say it aloud','Only '+pc(sp.acc)+' of your recent spoken answers matched. Repeating real sentences after the audio trains your mouth and your ear.','Shadowing','shStart');
 /* missed questions and skipped exercises */
 const mk=missList().length;if(mk>=3)add(24,'miss','Retake your missed questions',mk+' questions you got wrong are saved. Answering them again is the quickest way to fix them.','Retake','missStart');
 /* slow recall */
 const sw=slowWords();if(sw.length>=3){const w=sw.slice(0,2).map(id=>BY[id].ru),s=Math.round(S.cards[sw[0]].rt/1000);add(40,'slow','Speed up what you know','You get '+w.join(' and ')+' right, but it takes about '+s+' seconds. Conversation needs words to arrive quickly, so these come back as quick drills.','Quick drills','slowStart');}
 /* what is going well: step up instead of repeating */
 [['grammar','grammar'],['sentence','sentence construction'],['listening','listening']].forEach(([k,name])=>{const v=ind[k].v,n=k==='listening'?tagAcc(T.listening).n:tagAcc(T[k]).n;
  if(v!==null&&v>=0.88&&n>=12){const talk=k!=='grammar';add(35,'up-'+k,'Your '+name+' is strong','You have been getting '+pc(v)+'% right over your last '+n+' answers, so less repeating and more challenge: '+(k==='grammar'?'on to the next lesson.':k==='sentence'?'try a real conversation next.':'speech is played a little faster now.'),k==='grammar'&&nx?'Next lesson':talk?'Start a conversation':'Listening practice',k==='grammar'&&nx?'openLesson':talk?'goRoute':'lStart',k==='grammar'&&nx?{id:nx.id}:talk?{r:'talk'}:{go:1});}});
 /* the path forward */
 if(nx){const gw=weakTags().some(x=>x.rate>=0.5);add(gw?45:28,'next','Next lesson: '+nx.t,'Goal: '+nx.obj+(gw?' (You may want to fix the weak spot above first.)':''),'Open Lesson '+(LESSONS.indexOf(nx)+1),'openLesson',{id:nx.id});}
 const pend=LESSONS.filter(x=>S.les[x.id]&&!S.les[x.id].placed&&epFor(x.id)&&!S.eps[epFor(x.id).id])[0];
 if(pend)add(32,'ep','Listen to a short episode','A two-person conversation that uses the words from "'+pend.t+'". Listen for the meaning first, then the details.','Listen','epStart',{id:epFor(pend.id).id});
 try{const ln=listenNext();if(ln&&!pend){const ab=listenAbility();add(33,'lpath','Listen: '+ln.t,'Level '+ab.lv+' ('+LISTEN_LV[ab.lv][0]+'). '+ab.why,'Listen','epStart',{id:ln.id});}}catch(e){}
 const sk=Object.keys(S.skip).length;if(sk)add(50,'skip',sk+' skipped exercise'+(sk>1?'s':''),'You skipped these. That never counts against you, and they are here whenever you want them.','Try them','skipStart');
 return R.sort((a,b)=>a.prio-b.prio);}

/* ---------- weekly summary ---------- */
function coachWeek(){const now=Date.now(),cur=wkRec(now),prev=S.wk[wkOf(now-7*DAY)]||null,out={cur,prev,improved:[],struggling:[],review:[]};
 const names={vocab:'Vocabulary',grammar:'Grammar',listening:'Listening',reading:'Reading',production:'Producing Russian',speaking:'Speaking'};
 Object.keys(names).forEach(g=>{const a=cur.sk[g],b=prev&&prev.sk[g];if(a&&b&&a[0]>=5&&b[0]>=5){const d=a[1]/a[0]-b[1]/b[0];if(d>=0.08)out.improved.push(names[g]+' accuracy is up '+Math.round(d*100)+' points ('+pc(a[1]/a[0])+'%)');}});
 if(cur.up)out.improved.push(cur.up+' word'+(cur.up>1?'s':'')+' moved into secure memory');
 if(S.flags.fixedLast&&now-S.flags.fixedLast<7*DAY)out.improved.push('You recovered from a weak spot');
 Object.keys(cur.tags).forEach(t=>{const a=cur.tags[t];if(TAGS[t]&&a[0]>=4&&a[1]/a[0]<0.6)out.struggling.push(TAGS[t][0]+' ('+pc(a[1]/a[0])+'% this week)');});
 const old=ITEMS.filter(i=>{const c=S.cards[i.id];return c&&c.b>=3&&(now-c.last>21*DAY||c.due<now-7*DAY);});out.review=old;
 out.days=Object.keys(S.days).filter(k=>S.days[k]>0&&wkOf(new Date(k+'T12:00:00').getTime())===wkOf(now)).length;
 out.next=coachRecs().slice(0,3);return out;}

/* ---------- Home: today's focus ---------- */
function recBtn(r,cls){const d=Object.keys(r.data||{}).map(k=>' data-'+k+'="'+esc(r.data[k])+'"').join('');return `<button class="btn ${cls||''}" data-act="${r.act}"${d}>${esc(r.btn)}</button>`;}
function coachHTML(){const recs=coachRecs();if(!recs.length)return '';const top=recs[0],more=recs.slice(1,3);
 const ind=coachIndicators().filter(x=>x.k!=='consistency'),wk=coachWeek();
 const imp=wk.improved.length?wk.improved.slice(0,2).map(x=>`<li>✅ <span>${esc(x)}</span></li>`).join(''):'';
 const q=(n,h,body)=>`<div class="q"><span class="qn" aria-hidden="true">${n}</span><div class="qb"><div class="qh">${h}</div>${body}</div></div>`;
 return `<section class="card coach"><div class="eyebrow">Your coach</div>
 ${q(1,'What to practise today',`<h2>${esc(top.title)}</h2>`)}
 ${q(2,'Why Bunova suggests it',`<p class="why">${esc(top.why)}</p><div class="row">${recBtn(top)}${top.more?recBtn({btn:top.more[0],act:top.more[1],data:top.more[2]},'alt'):''}</div>`)}
 ${q(3,'What to do next',more.length?`<ul class="recs">${more.map(r=>`<li><div><b>${esc(r.title)}</b><span class="small muted">${esc(r.why)}</span></div>${recBtn(r,'alt sm')}</li>`).join('')}</ul>`:'<p class="small muted">After this, finish your daily session. It is chosen from your reviews and weak spots.</p>')}
 ${q(4,'How you are improving',`${imp?`<ul class="cando">${imp}</ul>`:'<p class="small muted">Improvements show here once there are two weeks of answers to compare. Until then, the bars below are your current skills.</p>'}<div class="skills mini" aria-label="Skill snapshot">${ind.map(x=>`<div class="skill"><span class="small">${esc(x.label)}</span><b>${x.v===null?'–':pc(x.v)+'%'}</b><div class="meter"><i style="width:${x.v===null?0:pc(x.v)}%"></i></div></div>`).join('')}</div>`)}
 <p class="small muted">You are free to use any part of the app. This is only a suggestion, based on your recent answers.</p></section>`;}

/* ---------- Progress: indicators, path to fluency, weekly summary ---------- */
function coachProgressHTML(){const ind=coachIndicators(),P=coachPath(),cur=pathNow(),wk=coachWeek(),ab=coachAbilities();
 const li=x=>`<li>${esc(x)}</li>`,none=t=>`<p class="small muted">${t}</p>`;
 let h=`<section class="card"><h2>Your skills</h2><p class="small muted">Worked out from your actual answers, not from lessons completed. A skill shows a dash until there is enough data.</p>
 <div class="skills">${ind.map(x=>{const p=x.v===null?0:pc(x.v);return `<div class="skill${x.v!==null&&p<65?' low':''}"><span class="small">${esc(x.label)}</span><b>${x.v===null?'–':p+'%'}</b><div class="meter" role="img" aria-label="${esc(x.label)} ${x.v===null?'not enough data':p+'%'}"><i style="width:${p}%"></i></div><span class="small muted">${esc(x.note)}</span></div>`;}).join('')}</div>
 <details class="how"><summary>How these are calculated</summary><div class="small stack"><p><b>Vocabulary retention</b>: of the words you have studied, the share you have recalled correctly more than once and reviewed within the last two weeks. Recognising a word once does not count.</p><p><b>Grammar, sentence construction, reading, listening</b>: your most recent answers (up to 12 per topic) in each area. Reading and listening also include passage and episode scores.</p><p><b>Consistency</b>: days practised in the last 14, with ten days counting as full marks. Streaks are shown elsewhere and never punish a missed day.</p></div></details></section>
 <section class="card"><h2>Path to fluency</h2><p class="small muted">You are working on <b>${esc(cur.lvl)}</b>: ${esc(cur.desc)}.</p><ol class="path">${P.map(x=>{const p=x.total?Math.round(x.done/x.total*100):0;return `<li class="${x.done===x.total&&x.total?'done':x.lvl===cur.lvl?'on':''}"><div class="row sp"><b>${esc(x.lvl)}</b><span class="small muted">${x.done} of ${x.total} lessons</span></div><div class="bar" role="img" aria-label="${esc(x.lvl)} ${p}%"><i style="width:${p}%"></i></div><span class="small muted">${esc(x.desc)}</span></li>`;}).join('')}</ol></section>
 <section class="card"><h2>What you can do with your words</h2>${ab.n?`<div class="abil">${[['recognise','Recognise',ab.recognise],['recall','Recall by yourself',ab.recall],['use','Use in a sentence',ab.use],['hear','Understand when spoken',ab.hear],['say','Say aloud',ab.say]].map(([k,t,n])=>`<div class="row sp"><span>${t}</span><span class="small muted">${n} of ${ab.n} words</span></div><div class="bar" role="img" aria-label="${t} ${n} of ${ab.n}"><i style="width:${Math.round(n/ab.n*100)}%"></i></div>`).join('')}</div><p class="small muted">These are different abilities. A word can be easy to recognise and still hard to say, which is why practice mixes all five.</p>`:none('Learn a few words and this fills in.')}</section>
 <section class="card"><h2>This week</h2><div class="stat"><div><b>${wk.cur.n}</b><span>answers</span></div><div><b>${wk.days}</b><span>days practised</span></div><div><b>${wk.cur.up}</b><span>words made secure</span></div></div>
 <div class="eyebrow">You improved at</div>${wk.improved.length?`<ul class="cando">${wk.improved.map(x=>`<li>✅ <span>${esc(x)}</span></li>`).join('')}</ul>`:none('Keep going. Improvements show here once there are two weeks to compare.')}
 <div class="eyebrow">Still tricky</div>${wk.struggling.length?`<ul class="cando">${wk.struggling.map(x=>`<li class="no">⬜ <span>${esc(x)}</span></li>`).join('')}</ul>`:none('Nothing stands out this week.')}
 <div class="eyebrow">Prioritise next</div>${wk.next.length?`<ul class="recs">${wk.next.map(r=>`<li><div><b>${esc(r.title)}</b><span class="small muted">${esc(r.why)}</span></div>${recBtn(r,'alt sm')}</li>`).join('')}</ul>`:none('You are all caught up.')}
 <div class="eyebrow">Worth reviewing</div>${wk.review.length?`<p class="small">${wk.review.length} word${wk.review.length>1?'s':''} you learned a while ago have not been reviewed recently, for example ${wk.review.slice(0,3).map(i=>`<span lang="ru">${esc(i.ru)}</span>`).join(', ')}. They return in your daily session.</p>`:none('Nothing old is slipping.')}</section>`;
 return h;}

function buniCard(){const s=S.set.buni||{};
 const preview=`<div class="buni-preview">${buniScene(null,true)}</div>`;
 const grp=BUNI_GROUPS.map(([g,gl])=>`<div class="eyebrow">${gl}</div><div class="chips" role="group" aria-label="${gl}">${BUNI_ITEMS[g].map(it=>{const open=buniOpen(g,it[0]),on=buniPick(g)===it[0];
   const sw=g==='fur'?`<i class="swc" style="background:${it[2]}"></i>`:g==='scarf'?`<i class="swc" style="background:${it[2][0]}"></i>`:'';
   return `<button class="chip${on?' on':''}${open?'':' lock'}" data-act="buniSet" data-g="${g}" data-v="${it[0]}" aria-pressed="${on}"${open?'':` aria-label="${esc(it[1])}, locked: ${esc(buniNeed(g,it[0]))}"`}>${sw}${open?'':'🔒 '}${esc(it[1])}</button>`;}).join('')}</div>`).join('');
 const got=BUNI_GROUPS.reduce((n,[g])=>n+BUNI_ITEMS[g].filter(it=>buniOpen(g,it[0])).length,0),all=BUNI_GROUPS.reduce((n,[g])=>n+BUNI_ITEMS[g].length,0);
 return `<section class="card"><h2>Your Buni</h2><p class="muted">Dress your companion. New items are earned by learning: finishing lessons, building vocabulary, listening well and holding conversations. Nothing here is for sale, and none of it affects your lessons. ${got} of ${all} unlocked.</p>${preview}${grp}</section>`;}

/* Buni's Russian Tip. Each tip belongs to a lesson (lid) and is shown once the learner has reached it.
   Only well-established facts. kind: everyday | mistake | sound | grammar | culture | natural | compare
   ex = [Russian, English] pairs; each plays aloud. */
const TIP_KINDS={everyday:'Everyday expression',mistake:'Common mistake',sound:'Sound and stress',grammar:'Grammar shortcut',culture:'Culture',natural:'How people really say it',compare:'English vs Russian'};
const TIPS=[
{id:'t01',lid:'c01',kind:'compare',t:'Letters that look English but are not',b:'Several Cyrillic letters look like Latin ones but sound different: В is v, Н is n, Р is r, С is s, У is oo. So ресторан is read “restoran”, not “pectopah”.',ex:[['ресторан','restaurant'],['нет','no']]},
{id:'t02',lid:'c02',kind:'sound',t:'Unstressed о sounds like “a”',b:'In Russian the stressed vowel is clear and the others are weakened. An unstressed о is pronounced close to “a”, so молоко sounds like “malaKO”. Learn the stressed syllable with every new word.',ex:[['молоко','milk'],['хорошо','good, well']]},
{id:'t03',lid:'c02',kind:'sound',t:'Stress can change the meaning',b:'Stress is not written in normal Russian texts, but it matters. The letter ё is always stressed, and it is often printed as е. Compare все (everyone) and всё (everything).',ex:[['Все дома.','Everyone is at home.'],['Я всё знаю.','I know everything.']]},
{id:'t04',lid:'c03',kind:'sound',t:'Voiced consonants go quiet at the end of a word',b:'At the end of a word, consonants like б, в, г, д, ж, з are pronounced as their unvoiced partners. So хлеб sounds like “khlep” and друг ends in a “k” sound.',ex:[['хлеб','bread'],['друг','friend']]},
{id:'t05',lid:'c05',kind:'everyday',t:'Привет or здравствуйте?',b:'Привет is informal, for friends, family and people your age. Здравствуйте is polite and neutral: use it with strangers, older people, in shops and to more than one person. The first в in здравствуйте is not pronounced: “ZDRAST-vuy-tye”.',ex:[['Привет, Анна!','Hi, Anna!'],['Здравствуйте, Иван Петрович.','Hello, Ivan Petrovich.']]},
{id:'t06',lid:'c05',kind:'natural',t:'Пожалуйста does two jobs',b:'Пожалуйста means both “please” and “you’re welcome”. After спасибо, you will usually hear пожалуйста or не за что (don’t mention it).',ex:[['Спасибо! — Пожалуйста.','Thanks! — You’re welcome.'],['Не за что.','Don’t mention it.']]},
{id:'t07',lid:'c05',kind:'natural',t:'Ничего has several meanings',b:'Ничего literally means “nothing”, but in conversation it often means “not bad” or “no problem”. Asked how things are, ничего is a modest, perfectly normal answer.',ex:[['Как дела? — Ничего.','How are things? — Not bad.'],['Ничего страшного.','No harm done.']]},
{id:'t08',lid:'c05',kind:'culture',t:'Names and patronymics',b:'In polite or formal situations Russians use a first name plus a patronymic, made from the father’s name: Иван Петрович is Ivan, son of Peter. It shows respect, and it goes with вы.',ex:[['Здравствуйте, Анна Ивановна.','Hello, Anna Ivanovna.']]},
{id:'t09',lid:'c06',kind:'mistake',t:'No “am / is / are” in the present',b:'Russian leaves out the verb “to be” in the present tense. Say Я студент, not “I am student” with a verb. The dash or just a pause does the job.',ex:[['Я студент.','I am a student.'],['Это мой дом.','This is my house.']]},
{id:'t10',lid:'c06',kind:'everyday',t:'ты or вы?',b:'Ты is for one friend, family member or child. Вы is for one person you do not know well, someone older or in a formal setting, and always for more than one person. When unsure, use вы.',ex:[['Как тебя зовут?','What is your name? (informal)'],['Как вас зовут?','What is your name? (formal)']]},
{id:'t11',lid:'c06',kind:'compare',t:'No “a” or “the”',b:'Russian has no articles. Книга can mean “a book” or “the book”: context and word order decide.',ex:[['Это книга.','This is a book.'],['Книга на столе.','The book is on the table.']]},
{id:'t12',lid:'c07',kind:'grammar',t:'Guess gender from the ending',b:'A noun ending in a consonant is usually masculine, -а or -я usually feminine, -о or -е usually neuter. Watch for exceptions: папа and дедушка are masculine, and nouns ending in a soft sign need to be learned.',ex:[['стол','table (masculine)'],['книга','book (feminine)'],['окно','window (neuter)']]},
{id:'t13',lid:'c07',kind:'mistake',t:'Кофе is masculine',b:'Many borrowed words ending in -е or -о do not change and are neuter, but кофе is masculine in standard Russian: чёрный кофе, мой кофе.',ex:[['Мой кофе горячий.','My coffee is hot.']]},
{id:'t14',lid:'c08',kind:'grammar',t:'One present tense, two English meanings',b:'The Russian present covers both “I read” and “I am reading”. For regular -ать verbs the endings are -ю, -ешь, -ет, -ем, -ете, -ют.',ex:[['Я читаю, ты читаешь, она читает.','I read, you read, she reads.'],['Я читаю книгу.','I read / I am reading a book.']]},
{id:'t15',lid:'c10',kind:'mistake',t:'Double negatives are required',b:'In Russian a negative sentence with ничего, никто or никогда needs не before the verb as well. It is not wrong or emphatic, it is the rule.',ex:[['Я ничего не знаю.','I don’t know anything.'],['Он никогда не опаздывает.','He is never late.']]},
{id:'t16',lid:'c10',kind:'grammar',t:'“I have” is “at me (there) is”',b:'Russian has no everyday verb for “to have”. Use у меня + есть + thing. Есть can be dropped when you describe the thing: у меня есть машина, but у меня красная машина.',ex:[['У меня есть брат.','I have a brother.'],['У меня красная машина.','I have a red car.']]},
{id:'t17',lid:'c10',kind:'grammar',t:'Yes/no questions: just change your voice',b:'You do not need to change word order or add “do”. Say the sentence with a rising tone on the word you are asking about.',ex:[['Ты говоришь по-русски?','Do you speak Russian?'],['Это твой телефон?','Is this your phone?']]},
{id:'t18',lid:'c11',kind:'grammar',t:'One and two have genders',b:'Один, одна, одно and два, две change with the noun. After 2, 3 and 4 the noun takes a genitive singular form (три книги). After 5 and above it takes genitive plural (пять книг).',ex:[['один стол, одна книга','one table, one book'],['два стола, две книги','two tables, two books']]},
{id:'t19',lid:'c11',kind:'everyday',t:'Asking the time and the price',b:'Both Сколько времени? and Который час? mean “What time is it?”. To ask the price say Сколько стоит? for one thing, Сколько стоят? for several.',ex:[['Сколько времени?','What time is it?'],['Сколько это стоит?','How much does this cost?']]},
{id:'t20',lid:'c12',kind:'grammar',t:'В or на? Learn it with the word',b:'Both can mean “in/at”. В is used for enclosed places (в школе, в городе). На is used for open spaces, events and many others (на работе, на улице, на почте). Learn the preposition together with each place.',ex:[['Я на работе.','I am at work.'],['Я в школе.','I am at school.']]},
{id:'t21',lid:'c12',kind:'sound',t:'Small words join the next word',b:'A one-syllable preposition is said together with the word after it, as one unit. В Москве sounds like “vmaskVYE”. Hearing it as one chunk makes Russian speech much easier to follow.',ex:[['в Москве','in Moscow'],['на столе','on the table']]},
{id:'t22',lid:'c12',kind:'culture',t:'Shoes off at home',b:'In many Russian homes guests are asked to take off their shoes and may be offered тапочки (house slippers). Проходите is what the host says when inviting you in.',ex:[['Проходите, пожалуйста.','Please, come in.'],['Можно войти?','May I come in?']]},
{id:'t23',lid:'c13',kind:'grammar',t:'Only living masculine nouns change in the accusative',b:'Feminine nouns in -а change to -у (книга to книгу). For masculine nouns, animate ones take the genitive form (брат to брата), inanimate ones stay the same (стол).',ex:[['Я вижу брата.','I see my brother.'],['Я вижу стол.','I see the table.']]},
{id:'t24',lid:'c13',kind:'compare',t:'Flexible word order, new information last',b:'Cases show who does what, so Russian word order can change. The new or most important information tends to come last, which is what you stress.',ex:[['Анна любит Ивана.','Anna loves Ivan.'],['Ивана любит Анна.','It is Anna who loves Ivan.']]},
{id:'t25',lid:'c14',kind:'natural',t:'Нет takes the genitive',b:'To say you do not have something, or that there is none of it, put the thing in the genitive: у меня нет времени, здесь нет магазина.',ex:[['У меня нет времени.','I don’t have time.'],['Здесь нет магазина.','There is no shop here.']]},
{id:'t26',lid:'c15',kind:'grammar',t:'Adjectives agree with the noun',b:'An adjective matches the gender, number and case of its noun: красный стол, красная книга, красное окно, красные книги.',ex:[['красный стол, красная книга','a red table, a red book'],['красное окно','a red window']]},
{id:'t27',lid:'c15',kind:'grammar',t:'The spelling rule: no ы after г, к, х, ж, ч, ш, щ',b:'After these letters Russian writes и instead of ы. That is why the plural of книга is книги, and the plural of русский is русские.',ex:[['книги','books'],['русские','Russian (plural)']]},
{id:'t28',lid:'c16',kind:'everyday',t:'Age uses the dative',b:'Russians say “to me is twenty years”: мне двадцать лет. Мне нравится (“to me is pleasing”) works the same way, which is why the thing you like is the subject.',ex:[['Мне двадцать пять лет.','I am twenty-five.'],['Мне нравится этот город.','I like this city.']]},
{id:'t29',lid:'c16',kind:'grammar',t:'С means “with”, and the next word changes',b:'After с meaning “with”, use the instrumental case: с другом, с Анной, с братом.',ex:[['Я иду в кино с другом.','I am going to the cinema with a friend.'],['Я говорю с Анной.','I am talking with Anna.']]},
{id:'t30',lid:'c17',kind:'grammar',t:'Past tense agrees with gender, not person',b:'The past is made with -л and shows only gender and number: он читал, она читала, оно читало, они читали. The speaker’s own gender decides я читал or я читала.',ex:[['Я читал.','I read. (a man speaking)'],['Я читала.','I read. (a woman speaking)']]},
{id:'t31',lid:'c17',kind:'grammar',t:'Future with “be” + infinitive',b:'To say you will be doing something, use буду, будешь, будет… followed by an imperfective infinitive.',ex:[['Я буду читать.','I will be reading.'],['Мы будем ужинать дома.','We will have dinner at home.']]},
{id:'t32',lid:'c18',kind:'grammar',t:'Process or result?',b:'Imperfective verbs focus on the process, repetition or fact. Perfective verbs focus on a completed result. Я читал книгу means I was reading it (or read it at some time); я прочитал книгу means I finished it.',ex:[['Я читал книгу.','I was reading the book.'],['Я прочитал книгу.','I finished reading the book.']]},
{id:'t33',lid:'c18',kind:'natural',t:'Давай: let’s',b:'Давай (to one person) and давайте (to several, or politely) make suggestions. With a perfective verb they mean “let’s do it”.',ex:[['Давай встретимся завтра.','Let’s meet tomorrow.'],['Давайте начнём.','Let’s begin.']]},
{id:'t34',lid:'c19',kind:'mistake',t:'Two verbs for “to go”',b:'Идти means to be walking somewhere now, in one direction. Ходить means to go regularly or to make a round trip. The same split exists for travelling by vehicle: ехать and ездить.',ex:[['Я иду в магазин.','I am walking to the shop (now).'],['Я часто хожу в магазин.','I often go to the shop.']]},
{id:'t35',lid:'c20',kind:'grammar',t:'-ся means “oneself”',b:'The ending -ся (after a vowel, -сь) turns many verbs reflexive: учить is to learn or teach something, учиться is to study or be a student.',ex:[['Я учусь в университете.','I study at university.'],['Я одеваюсь.','I am getting dressed.']]},
{id:'t36',lid:'c21',kind:'natural',t:'Polite requests',b:'Можно is the everyday way to ask permission. For a polite request use не могли бы вы… (could you…). Adding бы to a verb makes it “would”, as in я хотел бы.',ex:[['Можно войти?','May I come in?'],['Вы не могли бы мне помочь?','Could you help me?'],['Я хотел бы чай.','I would like tea.']]},
{id:'t37',lid:'c22',kind:'everyday',t:'In a café',b:'A common question when you order is здесь или с собой? (here, or to take away?). To ask for directions, Как пройти в музей? means “How do I get to the museum?”',ex:[['Здесь или с собой?','Here or to take away?'],['Как пройти в музей?','How do I get to the museum?']]},
{id:'t38',lid:'c23',kind:'grammar',t:'Because, so, in order to',b:'Потому что gives the reason, поэтому gives the result, and чтобы expresses purpose.',ex:[['Я дома, потому что я болен.','I am at home because I am ill.'],['Я учу русский, чтобы говорить с друзьями.','I am learning Russian in order to talk with friends.']]},
{id:'t39',lid:'c24',kind:'everyday',t:'Answering the phone',b:'People answer with Алло, or Слушаю вас when it is a more formal call. Introduce yourself with Это and your name.',ex:[['Алло, слушаю вас.','Hello, speaking.'],['Это Анна.','It is Anna.']]},
{id:'t40',lid:'c24',kind:'natural',t:'Ну: the little word everywhere',b:'Ну is a very common filler in speech. Depending on tone it can mean “well…”, “come on” or “so”. Listen for it in informal conversations.',ex:[['Ну, давай.','Well, okay then.'],['Ну что, пойдём?','So, shall we go?']]}
];
const TIPBY={};TIPS.forEach(t=>TIPBY[t.id]=t);
/* ---- choosing and showing a tip ---- */
const tipLessonIdx=t=>LESSONS.findIndex(l=>l.id===t.lid);
function tipReached(){let hi=-1;LESSONS.forEach((l,i)=>{if(lessonDone(l))hi=i;});return hi+1;} /* the lesson being learned now */
function tipPool(){const r=tipReached();return TIPS.filter(t=>{const i=tipLessonIdx(t);return i>=0&&i<=r;});}
function tipPick(avoid){const T=S.tips,pool=tipPool().filter(t=>t.id!==avoid);if(!pool.length)return TIPS[0].id;
 const unseen=pool.filter(t=>!T.seen[t.id]);
 /* most recent lesson first, so tips follow what the learner is doing now */
 const byRecent=(a,b)=>tipLessonIdx(b)-tipLessonIdx(a);
 if(unseen.length)return unseen.sort(byRecent)[0].id;
 return pool.sort((a,b)=>(T.seen[a.id]||0)-(T.seen[b.id]||0)||byRecent(a,b))[0].id;}
function tipCurrent(){const T=S.tips,today=dkey(Date.now());
 if(!T.cur||!TIPBY[T.cur]||T.day!==today||!tipPool().some(t=>t.id===T.cur)){T.cur=tipPick(T.cur);T.day=today;T.seen[T.cur]=Date.now();save();}
 return TIPBY[T.cur];}
function tipNext(){const T=S.tips;T.cur=tipPick(T.cur);T.day=dkey(Date.now());T.seen[T.cur]=Date.now();save();}
function tipSave(id){const T=S.tips;if(!TIPBY[id])return;const i=T.saved.indexOf(id);if(i>=0)T.saved.splice(i,1);else T.saved.push(id);save();}
const tipBody=(t,withSave)=>`<div class="eyebrow">${esc(TIP_KINDS[t.kind])}</div><h3>${esc(t.t)}</h3><p>${esc(t.b)}</p><div class="tipex">${t.ex.map(e=>`<div class="tex"><span class="grow"><b lang="ru">${esc(stressify(e[0]))}</b><br><span class="small muted">${esc(e[1])}</span></span>${sayBtns(e[0])}</div>`).join('')}</div>`;
function tipHTML(){const t=tipCurrent(),T=S.tips,saved=T.saved.map(id=>TIPBY[id]).filter(Boolean),on=T.saved.includes(t.id);
 return `<section class="card tipcard"><div class="buni-note"><div class="bunny-wrap sm">${buni('think')}</div><p><b>Buni’s Russian Tip</b><br><span class="small">From your lessons so far</span></p></div>${tipBody(t)}
 <div class="row"><button class="btn quiet sm" data-act="tipSave" data-id="${t.id}" aria-pressed="${on}">${on?'★ Saved':'☆ Save tip'}</button><button class="btn alt sm" data-act="tipNext">Another tip</button></div>
 ${saved.length?`<details class="how"><summary>Saved tips (${saved.length})</summary><div class="stack">${saved.map(s=>`<div class="tipsaved">${tipBody(s)}<button class="btn quiet sm" data-act="tipSave" data-id="${s.id}">Remove</button></div>`).join('')}</div></details>`:''}</section>`;}
/* ---------- LISTENING: graded pieces, interactive tasks, ear training, shadowing and a path that follows your ability ---------- */
const LS_OK=70;
const lsDone=e=>((S.eps[e.id]||{}).s||0)>=LS_OK;
const lsIdx=e=>LESSONS.findIndex(l=>l.id===e.lid);
const lsReady=e=>lsIdx(e)<=tipReached()+1;   /* at most one lesson ahead: understandable, with a little new language */
const KEYPOOL=(()=>{const a=[];EPISODES2.forEach(e=>e.keys.forEach(k=>a.push(k[1])));return a;})();
function episodeTasks2(ep){const ts=[],lid=ep.lid,L=(a,b)=>ts.push(Object.assign({tag:'listen',lid},a,b));
 L({k:'pick',ep:ep.id,epAuto:1,q:ep.gist[0],opts:shuffle(ep.gist[1]),ans:ep.gist[2],stage:'Listen for the gist'});
 if(ep.parts)epParts(ep).forEach(pt=>{if(pt.q)L({k:'pick',ep:ep.id,sec:pt.i,q:pt.q[0],opts:shuffle(pt.q[1]),ans:pt.q[2],stage:'Scene '+(pt.i+1)+': '+pt.t});});
 ep.qs.forEach(q=>L({k:'pick',ep:ep.id,q:q[0],opts:shuffle(q[1]),ans:q[2],stage:'Understand the details'}));
 ep.keys.slice(0,3).forEach(k=>{const pool=shuffle(ep.keys.filter(x=>x!==k).map(x=>x[1]).concat(KEYPOOL.filter(x=>x!==k[1]&&!ep.keys.some(y=>y[1]===x)))).slice(0,3);
  L({k:'pick',q:k[0],qRu:1,opts:shuffle([k[1]].concat(pool)),ans:k[1],stage:'Key words and expressions'});});
 if(ep.keys.some(k=>k[2]))ts.push({k:'learn',v:'expr',ep:ep.id,lid,tag:'listen',stage:'Useful expressions'});
 ts.push({k:'learn',v:'script',ep:ep.id,stage:'Read the transcript'});
 ep.gap.forEach(g=>{const l=ep.lines[g[0]];L({k:'cloze',q:l[1].replace(g[1],'___'),ans:g[1],audio:l[1],hint:l[2],tol:true,stage:'Fill the missing word'});});
 const n=(parseInt(ep.id.slice(1),10)||0);const pairs=[SOUNDPAIRS[n%SOUNDPAIRS.length]];if(ep.lvl>=2)pairs.push(SOUNDPAIRS[(n+5)%SOUNDPAIRS.length]);
 pairs.forEach(p=>{const first=Math.random()<.5;L({k:'listen',rw:1,optRu:1,ru:first?p[0]:p[1],opts:shuffle([p[0],p[1]]),ans:first?p[0]:p[1],pair:p,stage:'Similar sounds'});});
 ep.use.forEach(i=>{const l=ep.lines[i];ts.push(l[1].split(' ').length>=3?tilesTask(l[1],l[2],'order',{lid,stage:'Practise useful lines',say0:l[0]}):{k:'dict',ru:l[1],en:l[2],ans:l[1],tag:'listen',lid,stage:'Practise useful lines'});});
 shadowTasksFor(ep.lines[ep.use[0]],lid,'Shadow in sections').forEach(t=>ts.push(t));
 const rp=ep.reply;ts.push({k:'type',q:rp.goal,ans:rp.ans,say:rp.say[1],sayEn:rp.say[2],sayW:rp.say[0],tag:'conv',tol:true,lid,reply:1,stage:'Your turn'});
 return ts;}
/* a line broken into sections, then the whole line again */
function shadowTasksFor(l,lid,stage){const ch=shadowChunks(l[1]),out=[];
 ch.forEach((c,i)=>out.push({k:'shadow',ru:c,en:'Part '+(i+1)+' of '+ch.length+'. Whole line: '+l[2],who:l[0],tag:'speak',lid,stage}));
 out.push({k:'shadow',ru:l[1],en:l[2],who:l[0],tag:'speak',lid,stage});return out;}
function shadowTasks(ep){const out=[];ep.lines.forEach(l=>{if(l[1].split(' ').length>=2)shadowTasksFor(l,ep.lid,'Shadow the conversation').forEach(t=>out.push(t));});return out.slice(0,40);}
/* longer passages: up to three lines in a row by one voice, played in that character's voice */
function passageTasks(ep){return epPassages(ep).slice(0,10).map(p=>({k:'shadow',ru:p.t,en:p.en,who:p.w,tag:'speak',lid:ep.lid,stage:'Shadow longer passages'}));}
/* role-play: the other character speaks, then you say your line */
function roleName(ep,v){return (ep.cast&&ep.cast[v])||(v==='f'?'the woman':v==='g'?'the girl':'the man');}
function roleVoices(ep){const seen=[];ep.lines.forEach(l=>{if(!seen.includes(l[0]))seen.push(l[0]);});return seen.filter(v=>ep.lines.filter(l=>l[0]===v&&l[1].split(' ').length>=3).length>=2);}
function roleTasks(ep,role){const out=[];role=role||roleVoices(ep)[0];
 ep.lines.forEach((l,i)=>{if(l[0]!==role||l[1].split(' ').length<3)return;const pv=ep.lines[i-1];
  out.push({k:'shadow',ru:l[1],en:l[2],who:l[0],role:roleName(ep,role),prev:pv&&pv[0]!==role?{ru:pv[1],en:pv[2],w:pv[0],name:roleName(ep,pv[0])}:null,tag:'speak',lid:ep.lid,stage:'Role-play: you are '+roleName(ep,role)});});
 return out.slice(0,12);}
function soundTasks(n){const ps=shuffle(SOUNDPAIRS).slice(0,n);return ps.map(p=>{const first=Math.random()<.5;return {k:'listen',rw:1,optRu:1,ru:first?p[0]:p[1],opts:shuffle([p[0],p[1]]),ans:first?p[0]:p[1],pair:p,tag:'listen',stage:'Similar sounds'};});}
/* ability: move up only when answers show the learner is ready, never just because time passed */
function listenAbility(){const a=tagAcc(['listen','stress']),pc=a.acc==null?null:Math.round(a.acc*100);let lv=1;
 for(let k=1;k<=3;k++){const all=EPISODES2.filter(e=>e.lvl===k),done=all.filter(lsDone).length;if(done>=Math.min(2,all.length)&&(a.n<10||a.acc>=.7))lv=k+1;else break;}
 let why;
 if(a.n>=15&&a.acc<.55){if(lv>1)lv--;why='Your recent listening answers were '+pc+'% correct, so Buni suggests a gentler level. Listen twice, use Slow, then read the transcript.';}
 else if(lv===1)why=a.n>=10?'You have answered '+pc+'% of recent listening questions correctly. Finish two level 1 pieces with '+LS_OK+'% or more to move up.':'Start with short, slow pieces. Buni raises the level once your answers show you are ready.';
 else why='You finished the earlier levels and answer '+(pc==null?'well':pc+'% of listening questions correctly')+', so the next step is longer, more natural speech.';
 return {lv,acc:a.acc,n:a.n,pc,why};}
function listenNext(){const ab=listenAbility();for(let k=ab.lv;k>=1;k--){const c=EPISODES2.filter(e=>e.lvl===k&&!lsDone(e)&&lsReady(e)).sort((x,y)=>lsIdx(x)-lsIdx(y));if(c.length)return c[0];}return null;}
function lsRow(e,rec){const d=S.eps[e.id],ready=lsReady(e);
 return `<button class="les${rec?' next':''}" data-act="epStart" data-id="${e.id}"><span class="num${d?' done':''}">${d?'✓':e.kind==='story'?'📖':'🎧'}</span><span class="grow"><b>${esc(e.t)}</b>${rec?' <span class="tag">Suggested</span>':''}<br><span class="small muted">${esc(e.theme)} · ${d?'Best score '+d.s+'%':ready?(e.kind==='story'&&e.parts?'about '+epMinutes(e)+' min · '+e.parts.length+' scenes':e.lines.length+' lines'):'best after lesson '+(lsIdx(e)+1)}</span></span></button>`;}
function listenHubHTML(){const ab=listenAbility(),nx=listenNext();
 const bars=[1,2,3,4].map(k=>{const all=EPISODES2.filter(e=>e.lvl===k),d=all.filter(lsDone).length;return `<div class="lsbar${k===ab.lv?' on':''}"><b>${k}</b><span>${esc(LISTEN_LV[k][0])}</span><i style="--p:${all.length?Math.round(d/all.length*100):0}%"></i><small>${d}/${all.length}</small></div>`;}).join('');
 let h=`<section class="card">${buniBanner('listen','Understand the main idea first. You do not need every word.')}<h1>Listen</h1><div class="eyebrow">Your listening path · Level ${ab.lv} · ${esc(LISTEN_LV[ab.lv][0])}</div><p>${esc(ab.why)}</p><p class="small muted">${esc(LISTEN_LV[ab.lv][1])}</p>
 ${nx?`<button class="btn big" data-act="epStart" data-id="${nx.id}">Listen: ${esc(nx.t)}</button>`:'<p class="muted">Everything at your level is finished. Replay a favourite below, or complete more lessons to unlock the next pieces.</p>'}<div class="lsbars">${bars}</div></section>`;
 h+=[1,2,3,4].map(k=>{const es=EPISODES2.filter(e=>e.lvl===k);return `<section class="card"><div class="eyebrow">Level ${k} · ${esc(LISTEN_LV[k][0])}</div><div class="list">${es.map(e=>lsRow(e,nx&&nx.id===e.id)).join('')}</div></section>`;}).join('');
 const heard=EPISODES.filter(e=>S.eps[e.id]).sort((a,b)=>S.eps[b.id].t-S.eps[a.id].t).slice(0,6);
 h+=`<section class="card"><h2>Ear training and shadowing</h2><p class="muted">Short drills that train your ear for sounds Russian learners often mix up, and repeating real sentences in sections.</p>
 <button class="btn alt big" data-act="lsSounds">Similar sounds (8 words)</button>
 ${heard.length?`<div class="eyebrow">Shadow a conversation you have heard</div><div class="list">${heard.map(e=>`<div class="les static"><span class="num">🗣️</span><span class="grow"><b>${esc(e.t)}</b><div class="row wrap shopts"><button class="btn quiet" data-act="lsShadow" data-id="${e.id}">Sentence by sentence</button>${epPassages(e).length?`<button class="btn quiet" data-act="lsPass" data-id="${e.id}">Longer passages</button>`:''}${roleVoices(e).map(v=>`<button class="btn quiet" data-act="lsRole" data-id="${e.id}" data-role="${v}">Be ${esc(roleName(e,v))}</button>`).join('')}</div></span></div>`).join('')}</div>`:'<p class="small muted">Finish an episode and it will appear here for shadowing.</p>'}</section>`;
 h+=`<section class="card"><h2>Just listen</h2><p class="muted">Stories to enjoy like an audiobook. No questions. Play the whole story or one scene at a time, and open the transcript only if you want it.</p><div class="list">${EPISODES3.map(e=>`<button class="les" data-act="lsBook" data-id="${e.id}"><span class="num">📖</span><span class="grow"><b>${esc(e.t)}</b><br><span class="small muted">Level ${e.lvl} · about ${epMinutes(e)} min · ${e.parts.length} scenes</span></span></button>`).join('')}</div></section>`;
 return h;}
/* ---------- VISUAL AND REAL-LIFE PRACTICE: picture match, scene listening, social situations, choose-your-reply ---------- */
const visSeen=w=>{const it=ITEMS.find(i=>i.ru===w[0]);return !!(it&&S.cards[it.id]&&S.cards[it.id].seen);};
const visAfter=(ru,en,hook)=>()=>`<div class="row sp small"><span><b lang="ru">${esc(ru)}</b> · ${esc(en)}</span><span class="row nowrap">${sayBtns(ru)}</span></div>${hook?`<div class="hook">💡 ${esc(hook)}</div>`:''}`;
function picTasks(n){const pool=shuffle(PICWORDS).sort((a,b)=>visSeen(b)-visSeen(a)).slice(0,n);
 return pool.map((w,i)=>{const others=shuffle(PICWORDS.filter(x=>x!==w)).slice(0,3);
  if(i%2===0)return {k:'pick',vis:'Picture match',big:w[2],alt:w[1],q:'Which word matches the picture?',opts:shuffle([w[0]].concat(others.map(x=>x[0]))),ans:w[0],optRu:1,tag:'vocab',stage:'Pictures',after:visAfter(w[0],w[1],w[3])};

function journeyHTML(){const l=journeyLesson();if(!l)return '';const st=lessonSteps(l),nx=st.find(s=>!s.done)||st[st.length-1],n=LESSONS.indexOf(l)+1;

 const best=k=>(S.games[k]||{}).best||0;
 if(g.phase==='play'){const b=g.board,left=Math.max(0,GAME_SECS-(Date.now()-g.t0)/1000);
  const cell=(side,i)=>{const p=b.pairs[i],done=b.done.includes(i),sel=b.sel&&b.sel[0]===side&&b.sel[1]===i,bad=b.bad&&((b.bad[0]===side&&b.bad[1]===i)||(b.bad[2]===side&&b.bad[3]===i));

  <div class="match">${b.pairs.length?`<div class="mcol">${b.L.map(i=>cell('l',i)).join('')}</div><div class="mcol">${b.R.map(i=>cell('r',i)).join('')}</div>`:'<p>No words to match.</p>'}</div></section>`;}
 let h='';

/* ---------- daily rotation: the same stock all day, decided only by the date (nothing is stored, so a refresh can never change it) ---------- */
const shopDayKey=(d)=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function shopRng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}
const SHOP_RARE=['rare','epic','legendary'];
const shopPool=tier=>AV_SHOP.filter(i=>i[2]!=='hc'&&!i[6]&&!i[8]&&(SHOP_RARE.indexOf(i[4])>=0)===(tier==='rare'));
function shopPick(arr,n,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a.slice(0,n);}
const SHOP_REG=6;
function shopRareRoll(key){return shopRng('rare?'+key)()<.3;}
/* a rare visitor on roughly four days in ten, and never a gap of more than three days: walked forward from a fixed start date so it is the same for everyone, every time */
let _rareMemo={};
function shopHasRare(key){if(key in _rareMemo)return _rareMemo[key];const end=new Date(key+'T12:00:00').getTime();let t=new Date('2026-01-01T12:00:00').getTime(),gap=0,out=false;
 if(end<t){return _rareMemo[key]=shopRareRoll(key);}
 for(;t<=end;t+=864e5){const k=shopDayKey(new Date(t));out=shopRareRoll(k)||gap>=3;gap=out?0:gap+1;_rareMemo[k]=out;}return out;}
function shopDay(key){key=key||shopDayKey();
 const reg=shopPick(shopPool('reg'),SHOP_REG,shopRng('reg'+key)).map(i=>i[0]);
 const rare=[];if(shopHasRare(key)){const r=shopRng('rare'+key),n=r()<.22?2:1;shopPick(shopPool('rare'),n,r).forEach(i=>rare.push(i[0]));}
 return {key,reg,rare};}
function shopAvailable(id){const it=AVSH[id];if(!it)return false;if(it[2]==='hc')return true;if(it[8])return false;if(it[6])return inSeason(it);const d=shopDay();return d.reg.indexOf(id)>=0||d.rare.indexOf(id)>=0;}
function shopRefreshIn(){const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1).getTime()-n.getTime(),h=Math.floor(m/36e5),mi=Math.floor(m%36e5/6e4);return h>0?h+'h '+mi+'m':mi+'m';}

/* the draw: rarity by the published odds; a Rare or better is guaranteed after ORB_PITY-1 openings without one; unowned pets come first in a rarity */
function orbDraw(rng){rng=rng||(()=>{try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}catch(e){return Math.random();}});
 let r;const forced=S.me.pity>=ORB_PITY-1;
 if(forced){const w=PET_ODDS.slice(2),t=w.reduce((a,b)=>a+b,0);let x=rng()*t;r=2;for(let i=0;i<w.length;i++){if(x<w[i]){r=i+2;break;}x-=w[i];}}
 else{let x=rng()*100;r=0;for(let i=0;i<PET_ODDS.length;i++){if(x<PET_ODDS[i]){r=i;break;}x-=PET_ODDS[i];}}

let AC=null;
function sfx(kind){if(S.set.snd===false)return;const vol=clamp01(S.set.fv,.7);if(vol<=0)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=AC||new C();if(AC.state==='suspended')AC.resume();
 if(kind==='coin'){ /* ka-ching: two quick bright notes with a soft shimmer, about a third of a second */
  [[988,0,.09,'triangle',.11],[1319,.08,.34,'triangle',.11],[2638,.08,.22,'sine',.025],[3951,.1,.16,'sine',.012]].forEach(([f,t,d,ty,pk])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+t;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(pk*vol,t0+.006);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.start(t0);o.stop(t0+d+.02);});return;}
 const seq={ok:[[660,0],[880,.09]],no:[[260,0],[200,.12]],win:[[523,0],[659,.1],[784,.2],[1047,.3]]}[kind]||[];

  g.innerHTML=`<b lang="ru">${esc(d.w.replace(/[.,!?;:«»—]/g,''))}</b> · ${m?esc(m):'<span class="muted">no gloss for this form; check the translation under the line</span>'}`;say(d.w.replace(/[.,!?;:«»—]/g,''),false,1);return;}
 case 'passQuiz':{const pg=READING.find(p=>p.id===d.id);
  const ts=pg.q.map(q=>q[0]==='pick'?{k:'pick',q:q[1],opts:shuffle(q[2].slice()),ans:q[3],tag:'read'}:{k:'type',q:q[1],ans:q[2],tag:q[3]||'read',tol:true,lang:'en'});
  if(startRun({title:pg.t,tasks:ts,mode:'read',rid:pg.id,kind:'read'})){render();top();}return;}
 case 'tType':{ui.test.types[d.k]=!ui.test.types[d.k];if(!Object.values(ui.test.types).some(Boolean))ui.test.types.mc=true;render();return;}
 case 'setT':{const v=d.k==='n'?+d.v:d.v;ui.test[d.k]=v;if(d.k==='col'&&ui.test.topic&&ui.test.topic[0]!=='@'&&ui.test.topic!=='all'&&CATBY[ui.test.topic]&&d.v!=='all'&&d.v!=='done'&&CATBY[ui.test.topic].col!==d.v)ui.test.topic='all';render();return;}
 case 'tStart':{if(buildExam()){render();top();}else toast(ui.test.topic==='@wrong'?'Nothing to retake right now.':'Not enough items for that choice. Try All topics.');return;}
 case 'resetAsk':ui.confirmReset=true;render();return;
 case 'resetNo':ui.confirmReset=false;render();return;
 case 'resetYes':try{localStorage.removeItem(KEY);}catch(x){}loadState();ui.confirmReset=false;toast('Progress erased.');render();top();return;
 }
});

document.addEventListener('change',e=>{const vk=e.target.dataset&&e.target.dataset.vol;if(vk){S.set[vk]=clamp01(+e.target.value/100,1);save();if(vk==='fv')sfx('coin');return;}const s=e.target.dataset&&e.target.dataset.sel;if(!s)return;
 if(s==='gsrc'){ui.game.src=e.target.value;ui.game.phase='menu';}
 else if(s==='ptopic')ui.prac.topic=e.target.value;else if(s==='wtopic')ui.prac.wtopic=e.target.value;else if(s==='ttopic'){ui.test.topic=e.target.value;render();return;}
 render();});
document.addEventListener('input',e=>{const vk=e.target.dataset&&e.target.dataset.vol;if(vk){S.set[vk]=clamp01(+e.target.value/100,1);if(vk==='sv'&&player)player.volume=speechVol();const o=e.target.parentNode.querySelector('output');if(o)o.textContent=e.target.value+'%';return;}if(e.target.id==='wq'){ui.prac.q=e.target.value;const l=$('#wl');if(l)l.innerHTML=wordsList();}});
document.addEventListener('pointerdown',e=>{unlockAudio();try{if(AC&&AC.state==='suspended')AC.resume();}catch(x){}
 const b=e.target.closest&&e.target.closest('[data-act="say"]');if(b)prefetch(b.dataset.t,b.dataset.who||undefined,!!b.dataset.slow);},{passive:true});
document.addEventListener('keydown',e=>{unlockAudio();},{capture:true});
document.addEventListener('change',e=>{const f=e.target&&e.target.id==='bkPick'&&e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ui.bk={confirm:1,text:String(r.result||'')};render();};r.onerror=()=>toast('Could not read that file.');r.readAsText(f);});
/* tapping an on-screen Cyrillic key must not take focus from the answer box (keeps the caret and the phone keyboard) */
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.kb'))e.preventDefault();});
document.addEventListener('keydown',e=>{
 if(!ui.run&&e.key==='Enter'&&e.target&&e.target.id==='tIn'){e.preventDefault();const b=document.querySelector('[data-act="tSend"]');if(b)b.click();return;}
 if(!ui.run||ui.run.done)return;const r=ui.run,t=cur(),st=r.st;
 if(e.key==='Enter'){e.preventDefault();
  if(t.k==='learn'){nextTask();render();top();return;}
  if(t.k==='match'&&!st.checked)return;
  if(st.checked){if(t.k!=='card'){nextTask();render();top();}return;}
  if(t.k==='card'&&!st.shown){st.shown=true;render();return;}
  if(t.k!=='card')check();return;}
 if(t.k==='card'){
  if(e.key===' '&&!st.shown){e.preventDefault();st.shown=true;render();return;}
  if(st.shown&&'1234'.includes(e.key)&&e.key.length===1){gradeCard(+e.key-1);render();}}
});

/* ---------- installable app (PWA): service worker, install prompt, and a safe progress backup ---------- */
const pwa={deferred:null};
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: window-controls-overlay)').matches||navigator.standalone===true;}catch(e){return false;}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
document.addEventListener('toggle',e=>{const x=e.target;if(x&&x.dataset&&x.dataset.fold!==undefined){ui.fold=ui.fold||{};ui.fold[x.dataset.fold]=x.open;}},true);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pwa.deferred=e;if(ui.route==='settings'&&!ui.run)render();});
window.addEventListener('appinstalled',()=>{pwa.deferred=null;toast('Bunova is installed 🎉');if(ui.route==='settings'&&!ui.run)render();});
function pwaInit(){
 /* ask the browser not to evict saved progress (installed apps normally get this automatically) */
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
 if(!('serviceWorker' in navigator)||!(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))return;
 window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(reg=>{
  reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('A new version of Bunova is ready. It will appear next time you open the app.');});});
 }).catch(()=>{});});}
function progressCode(){save();return JSON.stringify({app:'bunova',saved:new Date().toISOString(),data:S});}
function restoreProgress(text){let o=null;try{o=JSON.parse(String(text||'').trim());}catch(e){}
 const d=o&&o.app==='bunova'&&o.data?o.data:o;
 if(!d||typeof d!=='object'||Array.isArray(d)||!(d.cards&&typeof d.cards==='object')||!(d.les&&typeof d.les==='object')){toast('That does not look like a Bunova progress code.');return false;}
 try{const cur=localStorage.getItem(KEY);if(cur)localStorage.setItem(KEY+'.before-restore',cur);localStorage.setItem(KEY,JSON.stringify(d));}catch(e){toast('Could not save on this device.');return false;}
 loadState();applyPalette();checkAch();save();return true;}
function copyText(t){return new Promise(res=>{try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>res(true),()=>res(fallbackCopy(t)));return;}}catch(e){}res(fallbackCopy(t));});}
function fallbackCopy(t){try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);const ok=document.execCommand('copy');a.remove();return ok;}catch(e){return false;}}
pwaInit();
/* ---------- boot ---------- */
loadState();checkAch();try{$('#logo').innerHTML=bunny('happy','logo');}catch(e){}
try{if(typeof MutationObserver!=='undefined')icoStart();}catch(e){}
ui.route=routeNow();render();
})();
