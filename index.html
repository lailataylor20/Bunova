<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bunova</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#4cb000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bunova">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Bunova: calm teal/ink palette, restrained rose used only for the wordmark and highlights */
:root{
  --bg:#f7f9fb; --surface:#ffffff; --soft:#e8f7d6; --soft2:#c9ec9b; --line:#e2e8ee;
  --ink:#2b3a42; --muted:#64757e; --accent:#4cb000; --accent-sh:#3a8a00; --accent2:#2d6e00; --on-accent:#ffffff;
  --sky:#1cb0f6; --sky-sh:#1288bd; --blue:#0b7bb0; --blue-soft:#dff4ff; --amber:#a35c00; --amber-soft:#fff1cc; --sun:#ffc800; --sun-sh:#d9a600;
  --rose:#9b4fe0; --good:#3d8f00; --good-soft:#d9f6bb; --bad:#d62f2f; --bad-sh:#a82020; --bad-soft:#ffe0e0;
  --display:"Fredoka","Rubik","Nunito","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Rubik","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --r:20px; --shadow:0 3px 0 var(--line);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131f24; --surface:#1f2c34; --soft:#23391d; --soft2:#34591f; --line:#37464f;
  --ink:#eef4f6; --muted:#a3b5bd; --accent:#58cc02; --accent-sh:#3d9100; --accent2:#8fe04a; --on-accent:#10230a;
  --sky:#1cb0f6; --sky-sh:#1583b3; --blue:#6cc9f5; --blue-soft:#17384a; --amber:#ffcf66; --amber-soft:#3b3015; --sun:#ffc800; --sun-sh:#b88f00;
  --rose:#d6a2ff; --good:#8fe04a; --good-soft:#1f3a14; --bad:#ff6b6b; --bad-sh:#b53a3a; --bad-soft:#41201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131f24; --surface:#1f2c34; --soft:#23391d; --soft2:#34591f; --line:#37464f;
  --ink:#eef4f6; --muted:#a3b5bd; --accent:#58cc02; --accent-sh:#3d9100; --accent2:#8fe04a; --on-accent:#10230a;
  --sky:#1cb0f6; --sky-sh:#1583b3; --blue:#6cc9f5; --blue-soft:#17384a; --amber:#ffcf66; --amber-soft:#3b3015; --sun:#ffc800; --sun-sh:#b88f00;
  --rose:#d6a2ff; --good:#8fe04a; --good-soft:#1f3a14; --bad:#ff6b6b; --bad-sh:#b53a3a; --bad-soft:#41201f; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:110px;min-height:100%}
body.running{padding-bottom:40px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.2rem}
p{margin:0} ul,ol{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.6}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--display);font-size:1.5rem;color:var(--rose)}
.brand span{color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;transition:background .15s,border-color .15s}
.chip.static{min-height:32px;background:var(--soft);border-color:transparent;color:var(--accent2)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--soft);border-color:var(--accent)}
.sw{width:30px;height:18px;border-radius:999px;background:var(--soft2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
[aria-checked="true"] .sw{background:var(--accent)} [aria-checked="true"] .sw::after{transform:translateX(12px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:700}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:var(--accent);background:var(--soft)}
body.running .tabs{display:none}
@media (min-width:820px){.tabs{position:sticky;top:60px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;padding:4px}}
#app{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none;background:transparent}
.card.hero{background:linear-gradient(160deg,var(--soft),var(--surface) 70%);border-color:var(--soft2)}
.card.center,.center{text-align:center;justify-content:center;align-items:center}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.86rem} .no{color:var(--bad);font-weight:700}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between} .row.top{align-items:flex-start} .row.nowrap{flex-wrap:nowrap} .row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 22px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-weight:800;text-decoration:none;box-shadow:0 2px 0 var(--accent2);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(2px);box-shadow:none}
.btn.big{width:100%;min-height:52px;font-size:1.05rem}
.btn.alt{background:var(--soft);color:var(--accent2);box-shadow:0 2px 0 var(--soft2)}
.btn.quiet{background:transparent;color:var(--muted);box-shadow:none;border:1.5px solid var(--line)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.9rem}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);padding:0 8px;font-weight:700}
.ib svg{width:22px;height:22px;fill:currentColor}
.ib.slow{border-radius:999px;font-size:.8rem;padding:0 12px;color:var(--muted)}
.ib.sm{min-width:36px;min-height:36px}
.ib:active{background:var(--soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:42px;padding:6px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
.seg button small{font-size:.7rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent2)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
select,input[type=text],input[type=search]{width:100%;min-height:46px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
input:focus,select:focus{border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px} .list.tight{gap:14px}
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.les.next{border-color:var(--accent);background:var(--soft)}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent2);font-weight:800}
.num.done{background:var(--accent);color:var(--on-accent)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:99px;transition:width .35s ease}
.pip{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:.78rem;font-weight:800;color:var(--muted);width:52px;flex:none}
.pip .bar{width:100%;height:6px}
.ph{color:var(--blue);font-weight:600;font-size:.95rem} body.no-ph .ph{display:none}
.ru{font-size:1.25rem;font-weight:700;overflow-wrap:anywhere} .ru.xl{font-size:1.9rem;line-height:1.3} .ru.sm{font-size:1.1rem}
.en{color:var(--muted)}
.ex{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft)}
.exru{font-weight:700}
.goal{padding:10px 12px;border-radius:12px;background:var(--blue-soft);color:var(--ink)}
.pts{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.how summary{cursor:pointer;font-weight:800;color:var(--accent2);min-height:32px}
.how[open] summary{margin-bottom:8px}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.alpha button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:.78rem;color:var(--muted)}
.alpha button b{font-size:1.5rem;color:var(--ink)}
.vrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
details.w{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:6px 10px}
details.w>summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none;min-height:56px}
details.w>summary::-webkit-details-marker{display:none}
.more{display:flex;flex-direction:column;gap:8px;padding:6px 0 10px}
.vf{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-weight:700}
.vf span{padding:4px 8px;background:var(--soft);border-radius:8px;font-size:.92rem} .vf i{font-style:normal;color:var(--muted);font-weight:600}
.tag{display:inline-block;align-self:flex-start;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--accent2);font-size:.75rem;font-weight:800}
.tag.blue{background:var(--blue-soft);color:var(--blue)} .tag.amber{background:var(--amber-soft);color:var(--amber)}
.note{padding:12px 14px;border-radius:14px;background:var(--amber-soft);color:var(--ink);font-size:.92rem}
.week{display:flex;justify-content:space-between}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);font-weight:700}
.wd i{width:26px;height:26px;border-radius:50%;background:var(--soft);display:block}
.wd.on i{background:var(--accent)}
.plan{padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.plan li{display:flex;flex-direction:column;padding:8px 12px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0}
.stat{display:flex;gap:10px} .stat>div{flex:1;background:var(--soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center}
.stat b{font-size:1.5rem;font-family:var(--display)} .stat span{font-size:.78rem;color:var(--muted);text-align:center}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stg{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:12px;background:var(--soft);font-size:.7rem;font-weight:700;color:var(--muted)}
.stg b{font-size:1.2rem;color:var(--ink)}
.stbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft)}
.stbar i{display:block;min-width:0}
.stbar .new{background:var(--soft2)} .stbar .learning{background:#c99a3c} .stbar .recognised{background:var(--blue)} .stbar .recalled{background:#3a9e8f} .stbar .confident{background:var(--good)}
.days{display:flex;align-items:flex-end;gap:8px;height:130px}
.days>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:700}
.days i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach .a{display:flex;flex-direction:column;padding:10px;border-radius:12px;border:1.5px dashed var(--line);opacity:.65}
.ach .a.on{opacity:1;border:1.5px solid var(--accent);background:var(--soft)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{padding:10px 0;border-bottom:1px solid var(--line)}
.spk{display:block;font-size:.75rem;font-weight:800;color:var(--rose);text-transform:uppercase;letter-spacing:.05em}
.rt{font-size:1.15rem;font-weight:600;line-height:1.9}
span.w{cursor:pointer;border-bottom:1.5px dotted var(--soft2);padding:2px 1px;border-radius:4px} span.w:hover{background:var(--soft)}
.trn summary{cursor:pointer;color:var(--accent2);font-weight:700;min-height:28px}
.gloss{position:sticky;bottom:90px;padding:12px 14px;border-radius:14px;background:var(--blue-soft);font-size:1rem}
/* runner */
.runner{display:flex;flex-direction:column;gap:14px;min-height:60vh}
.rhead{display:flex;align-items:center;gap:12px}
.task{animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.prompt{font-size:1.35rem;font-family:var(--display);font-weight:600}
.bubble{background:var(--soft);border-radius:16px 16px 16px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tray{min-height:58px;padding:10px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-height:46px;padding:6px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:1.05rem;box-shadow:0 2px 0 var(--line);transition:transform .08s}
.tile:active{transform:translateY(2px);box-shadow:none} .tile.on{background:var(--soft);border-color:var(--accent)}
.opts,.syl{display:grid;gap:10px}
.syl{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
.opt{min-height:54px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;text-align:left;box-shadow:0 2px 0 var(--line);transition:transform .08s,border-color .15s}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:none} .opt.sel{border-color:var(--accent);background:var(--soft)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;min-height:56px;padding:6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800}
.grades small{font-size:.7rem;color:var(--muted);font-weight:600}
.grades button:nth-child(1){border-color:var(--bad)} .grades button:nth-child(4){border-color:var(--good)}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;animation:rise .2s ease}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fbh{display:flex;gap:10px;align-items:center;font-size:1.1rem}
.fbi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--bad)} .fb.good .fbi{background:var(--good)}
.fbi svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3}
.ring{--p:0;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft) 0)}
.ring b{width:98px;height:98px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:1.7rem;font-family:var(--display)}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:6px}
.kb button{min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;font-weight:700;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
hr{border:0;border-top:1px solid var(--line);width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- playful layer ---- */
body{font-weight:600}
h1,h2,h3,.prompt,.brand b{font-family:var(--display);font-weight:600;letter-spacing:.005em}
h1{font-size:1.75rem} h2{font-size:1.3rem}
.brand b{color:var(--accent);font-size:1.7rem;font-weight:700}
.brand span{font-weight:700}
.card{border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card.hero{background:var(--surface);border-color:var(--soft2)}
.eyebrow{color:var(--accent2);font-weight:900;letter-spacing:.1em}
.btn{border-radius:16px;text-transform:uppercase;letter-spacing:.06em;font-weight:900;font-size:.95rem;box-shadow:0 4px 0 var(--accent-sh);min-height:50px}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--accent-sh)}
.btn.big{min-height:56px;font-size:1.05rem}
.btn.alt{background:var(--surface);color:var(--sky-sh);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.alt:active{box-shadow:none}
.btn.quiet{background:transparent;color:var(--muted);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sm{min-height:40px;padding:6px 16px;font-size:.8rem;box-shadow:0 3px 0 var(--line)}
.btn:not(.alt):not(.quiet).sm{box-shadow:0 3px 0 var(--accent-sh)}
.chip{border:2px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:800}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--blue-soft);border-color:var(--sky)}
.chip.static{background:var(--amber-soft);color:var(--amber);border:0;box-shadow:none}
[aria-checked="true"] .sw{background:var(--sky)}
.seg button{border:2px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);font-weight:800}
.seg button[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--sky);color:var(--blue);box-shadow:0 3px 0 var(--sky)}
select,input[type=text],input[type=search]{border:2px solid var(--line);border-radius:14px;font-weight:700;font-size:1.05rem}
input:focus,select:focus{border-color:var(--sky);outline:none}
.ib{border:2px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--sky)}
.ib:active{transform:translateY(3px);box-shadow:none}
.tabs{border-top:2px solid var(--line)}
.tabs a{font-weight:800;border:2px solid transparent;border-radius:14px}
.tabs a.on{color:var(--sky-sh);background:var(--blue-soft);border-color:var(--sky)}
body:not(.running) .tabs a.on svg{stroke:var(--sky)}
.bar{height:14px;background:var(--line);position:relative}
.bar i{background:var(--accent);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.rhead .bar{height:18px}
.ph{color:var(--blue);font-weight:700}
.ru{font-weight:800}
.prompt{font-size:1.45rem}
.tag{background:var(--blue-soft);color:var(--blue);font-weight:900}
.tag.blue{background:var(--soft);color:var(--accent2)}
.num{background:var(--soft);color:var(--accent2)}
.num.done{background:var(--accent);color:#fff}
.les{border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:16px}

 x:[["pick","What gender is книга?",["masculine","feminine","neuter"],"feminine","gender"],["pick","What gender is дом?",["masculine","feminine","neuter"],"masculine","gender"],["pick","What gender is место?",["masculine","feminine","neuter"],"neuter","gender"],["cloze","Это ___ книга. (my)","моя","gender"],["cloze","Это ___ дом. (my)","мой","gender"],["cloze","Это ___ окно. (my)","моё","gender"],["cloze","___ город очень красивый. (this)","Этот","gender"],["cloze","Это ___ семья. (our)","наша","gender"],["type","This is your key. (formal)","Это ваш ключ.","gender"]]},
{id:"c08",lvl:"A1",t:"Present tense: the -ать verbs",min:7,obj:"I can conjugate regular -ать verbs and use them in short sentences.",
 intro:"Verbs change their ending for each person. Once you know one pattern, a large share of verbs follow it.",
 pts:["Take off -ть and add: я -ю, ты -ешь, он/она -ет, мы -ем, вы -ете, они -ют.","делать → я делаю, ты делаешь, он делает, мы делаем, вы делаете, они делают.","Dictionary form (the infinitive) usually ends in -ть. After хочу, могу and люблю, use it: Я люблю читать.","You do not need the pronoun every time: Читаю книгу means I am reading a book."],
 ex:[["Я читаю книгу.","ya chee-TAH-yu KNEE-goo","I am reading a book."],["Мы работаем дома.","my ra-BOH-ta-yem DOH-ma","We work at home."],["Они знают русский.","a-NEE ZNAH-yoot ROO-skee","They know Russian."]],v:["v|Essential verbs"],
 x:[["conj","читать","я","читаю"],["conj","читать","ты","читаешь"],["conj","делать","мы","делаем"],["conj","знать","они","знают"],["conj","работать","вы","работаете"],["conj","гулять","он","гуляет"],["type","I am reading a book.","Я читаю книгу.","pres"],["tiles","Они работают в банке.","They work in a bank.","pres"],["fix","Я читать книгу.","Я читаю книгу.","pres","Conjugate the verb for the person: я читаю, not the infinitive читать."]]},
{id:"c09",lvl:"A1",t:"Present tense: other verb types",min:8,obj:"I can conjugate -ить verbs and the most important irregular verbs.",
 intro:"The second big pattern covers verbs in -ить and many in -еть. Then a handful of irregular verbs must simply be learned, because they are so common.",
 pts:["-ить pattern: я -ю, ты -ишь, он -ит, мы -им, вы -ите, они -ят. говорить → говорю, говоришь, говорит, говорим, говорите, говорят.","хотеть: хочу, хочешь, хочет, хотим, хотите, хотят. мочь: могу, можешь, может, можем, можете, могут.","жить: живу, живёшь, живёт, живём, живёте, живут. пить: пью, пьёшь. есть: ем, ешь, ест, едим, едите, едят.","Some verbs change a consonant in я: люблю, плачу, готовлю. The other forms keep the original consonant."],
 ex:[["Я говорю по-русски.","ya ga-va-RYU pa-ROO-skee","I speak Russian."],["Я хочу пить.","ya kha-CHOO peet","I want a drink."],["Мы живём в Лондоне.","my zhee-VYOM v LON-da-nyeh","We live in London."]],v:["v|More everyday verbs"],
 x:[["conj","говорить","ты","говоришь"],["conj","говорить","они","говорят"],["conj","любить","я","люблю"],["conj","хотеть","я","хочу"],["conj","хотеть","они","хотят"],["conj","мочь","я","могу"],["conj","жить","мы","живём"],["conj","пить","я","пью"],["conj","есть","мы","едим"],["type","I want to drink water.","Я хочу пить воду.","pres"],["fix","Я хотю кофе.","Я хочу кофе.","pres","хотеть is irregular: я хочу, ты хочешь."]]},
{id:"c10",lvl:"A1",t:"Questions, negation and have",min:7,obj:"I can ask yes/no and wh- questions, say no, and say what I have.",
 intro:"A yes or no question needs no extra word in Russian. Only the voice rises on the key word.",
 pts:["Ты говоришь по-русски? Raise your voice on говоришь.","Put не directly before the word you deny: Я не знаю.","нет means no, and also there is not: Нет хлеба.","To have: У меня есть книга. To lack: У меня нет книги.","Можно + infinitive asks permission: Можно войти?"],
 ex:[["Вы говорите по-английски?","vy ga-va-REE-tyeh pa-an-GLEE-skee","Do you speak English?"],["Я не понимаю.","ya nee pa-nee-MAH-yu","I don't understand."],["У меня есть сестра.","oo mee-NYA yest see-STRAH","I have a sister."]],v:["p|Help & understanding"],
 x:[["tiles","У меня есть сестра.","I have a sister.","have"],["fix","Я понимаю не.","Я не понимаю.","neg","Put не directly before the verb."],["type","Do you speak English? (formal)","Вы говорите по-английски?","q"],["cloze","У меня нет ___. (a brother)","брата","gen"],["type","I don't know.","Я не знаю.","neg"],["tiles","Где находится метро?","Where is the metro?","q"],["type","May I come in?","Можно войти?","q"],["dict","Повторите, пожалуйста.","Please repeat."],["listen","Говорите медленнее, пожалуйста.","Please speak more slowly.",["Please sit down.","I am very tired."]]]},
{id:"c11",lvl:"A1",t:"Numbers, time and prices",min:8,obj:"I can count to 100, tell the time and ask a price.",
 intro:"Numbers carry grammar with them: the noun after a number changes form. Learn the pattern with a few common nouns.",
 pts:["1 один, 2 два, 3 три, 4 четыре, 5 пять, 6 шесть, 7 семь, 8 восемь, 9 девять, 10 десять, 20 двадцать, 100 сто.","After 1, the noun stays as it is: один час. After 2, 3 and 4, use the genitive singular: два часа, три минуты.","After 5 and above, use the genitive plural: пять часов, пять минут.","Time: Который час? Сейчас девять часов. At nine: в девять.","Price: Сколько стоит билет? Билет стоит сто рублей."],
 ex:[["Сколько стоит билет?","SKOHL-ka STOH-eet bee-LYET","How much is the ticket?"],["Сейчас девять часов.","see-CHAHS DYEH-vyat chee-SOHF","It is nine o'clock."],["Мне двадцать пять лет.","mnyeh DVAHD-tsat pyat lyet","I am 25 years old."]],v:["v|Numbers & time"],
 x:[["type","seven","семь","num"],["type","twenty","двадцать","num"],["type","one hundred","сто","num"],["cloze","У меня два ___. (brother)","брата","num"],["cloze","У меня пять ___. (brother)","братьев","num"],["cloze","Мне ___ лет. (25)","двадцать пять","num"],["dict","девять","nine"],["tiles","Урок начинается в девять часов.","The lesson begins at nine o'clock.","time"],["type","What time is it?","Который час?","time"],["dict","Сколько стоит билет?","How much is the ticket?"]]},
{id:"c12",lvl:"A1",t:"Where: the prepositional case",min:8,obj:"I can say where I am, live and work using в and на.",
 intro:"Russian endings show a noun's job in the sentence. The prepositional case answers the question where.",
 pts:["Use в (in) or на (on, at) plus the prepositional case. Most nouns add -е: Лондон → в Лондоне, стол → на столе, школа → в школе.","Countries in -ия end in -ии: в Англии, в России.","в is for enclosed places: в офисе, в банке. на is for open spaces and events: на улице, на вокзале, на работе.","A few masculine nouns take a stressed -у: в аэропорту, в саду. Learn them as exceptions."],
 ex:[["Я живу в Лондоне.","ya zhee-VOO v LON-da-nyeh","I live in London."],["Мы на вокзале.","my na vak-ZAH-lyeh","We are at the station."],["Книга на столе.","KNEE-ga na sta-LYEH","The book is on the table."]],v:["p|Getting around","v|Home & places"],
 x:[["cloze","Я живу в ___. (Москва)","Москве","prep"],["cloze","Я живу в ___. (Лондон)","Лондоне","prep"],["cloze","Книга на ___. (стол)","столе","prep"],["cloze","Мы в ___. (ресторан)","ресторане","prep"],["cloze","Я на ___. (работа)","работе","prep"],["cloze","Он в ___. (школа)","школе","prep"],["pick","Which? Мы ___ вокзале.",["в","на"],"на","prep"],["fix","Я живу в Лондон.","Я живу в Лондоне.","prep","After в or на for location, use the prepositional case: Лондон becomes Лондоне."],["type","I work in an office.","Я работаю в офисе.","prep"],["tiles","Мы живём в маленьком городе.","We live in a small town.","prep"]]},
{id:"c13",lvl:"A1",t:"What: the accusative case",min:8,obj:"I can use direct objects and say where I am going.",
 intro:"The accusative marks what you read, see, buy or love. It also shows direction after в and на.",
 pts:["Feminine -а becomes -у and -я becomes -ю: книга → книгу, семья → семью.","Masculine things and neuter nouns do not change: Я читаю журнал. Я вижу окно.","Masculine people and animals take the genitive form instead: Я вижу брата.","Direction, where to: в/на + accusative. Я иду в школу (to school) but Я в школе (at school)."],
 ex:[["Я пью воду.","ya pyu VOH-doo","I am drinking water."],["Я люблю маму.","ya lyu-BLYU MAH-moo","I love my mum."],["Мы идём в школу.","my ee-DYOM f SHKOH-loo","We are going to school."]],v:["p|Café & shopping","v|Food & drink"],
 x:[["cloze","Я читаю ___. (книга)","книгу","acc"],["cloze","Я вижу ___. (машина)","машину","acc"],["cloze","Я люблю ___. (мама)","маму","acc"],["cloze","Я пью ___. (вода)","воду","acc"],["cloze","Я читаю ___. (журнал)","журнал","acc"],["cloze","Я вижу ___. (брат)","брата","acc"],["cloze","Мы идём в ___. (школа)","школу","acc"],["fix","Я люблю мама.","Я люблю маму.","acc","Feminine -а nouns change to -у as direct objects."],["fix","Я читаю книга.","Я читаю книгу.","acc","The thing you read is the direct object: книга becomes книгу."],["tiles","Я хочу купить хлеб.","I want to buy bread.","acc"],["type","I am watching a film.","Я смотрю фильм.","acc"]]},
{id:"c14",lvl:"A1",t:"Of and none: the genitive case",min:8,obj:"I can say what I do not have, show possession and use из, у, до and от.",
 intro:"The genitive does a lot of work: of, from, none of, and the form after нет and many prepositions.",
 pts:["Masculine and neuter singular add -а or -я: брат → брата, друг → друга.","Feminine -а becomes -ы, and -я becomes -и: вода → воды, семья → семьи.","нет + genitive: У меня нет времени. Нет воды.","Possession: Это книга друга. = This is my friend's book.","Prepositions that take the genitive: из, у, от, до, без, для, после."],
 ex:[["У меня нет времени.","oo mee-NYA nyet VRYEH-mee-nee","I have no time."],["Это книга друга.","EH-ta KNEE-ga DROO-ga","This is my friend's book."],["Я из Англии.","ya eez AHN-glee-ee","I am from England."]],v:["v|Prepositions"],
 x:[["cloze","У меня нет ___. (время)","времени","gen"],["cloze","У нас нет ___. (хлеб)","хлеба","gen"],["cloze","Это книга ___. (друг)","друга","gen"],["cloze","Нет ___. (вода)","воды","gen"],["cloze","У ___ есть сестра. (я)","меня","gen"],["cloze","Это дом моей ___. (мама)","мамы","gen"],["cloze","Чашка ___. (чай)","чая","gen"],["fix","У меня нет время.","У меня нет времени.","gen","After нет, use the genitive: время becomes времени."],["type","I have no money.","У меня нет денег.","gen"],["tiles","Я работаю до шести часов.","I work until six o'clock.","gen"]]},
{id:"c15",lvl:"A1",t:"Plurals and adjectives",min:8,obj:"I can make common plurals and make adjectives agree.",
 intro:"Adjectives agree with their noun in gender, number and case. Plurals are mostly regular, with a few common exceptions.",
 pts:["Plural: add -ы, or -и after г, к, х, ж, ш, ч, щ: книга → книги. Many masculine nouns take -а: дом → дома, город → города.","Neuter -о becomes -а: окно → окна. Irregular and common: друг → друзья, человек → люди, ребёнок → дети.","Adjectives: красивый город (m), красивая книга (f), красивое окно (n), красивые книги (plural).","Short form for a person or state: Он занят. Она рада. Ты прав."],
 ex:[["красивый город","kra-SEE-vyy GOH-rat","a beautiful city"],["большая квартира","bal-SHAH-ya kvar-TEE-ra","a big flat"],["новые книги","NOH-vy-ye KNEE-gee","new books"]],v:["v|Adjectives & adverbs","v|More adjectives"],
 x:[["cloze","Это ___ книги. (new)","новые","adj"],["cloze","Это ___ дом. (new)","новый","adj"],["cloze","Это ___ машина. (new)","новая","adj"],["cloze","Это ___ окно. (new)","новое","adj"],["cloze","Это мои ___. (friend)","друзья","plur"],["cloze","Это мои ___. (book)","книги","plur"],["cloze","Это мои ___. (city)","города","plur"],["type","a beautiful city","красивый город","adj"],["type","a big flat","большая квартира","adj"],["fix","Это красивый книга.","Это красивая книга.","adj","Adjectives agree with the noun: книга is feminine, so красивая."]]},
{id:"c16",lvl:"A2",t:"To whom and with whom: dative and instrumental",min:9,obj:"I can use the dative for to/for and the instrumental for with and professions.",
 intro:"Two more cases finish the main set. The dative is for the person something is given, said or addressed to. The instrumental is for with, and for what someone is as a job.",
 pts:["Dative endings: masculine -у/-ю, feminine -е. брат → брату, мама → маме. Used after к and with звонить, помогать, нравиться, нужно.","Мне нравится = I like (literally: to me it is pleasing). Мне нужна помощь = I need help.","Instrumental endings: masculine -ом/-ем, feminine -ой/-ей. друг → другом, сестра → сестрой.","с + instrumental = with: чай с лимоном. A job after работать: Он работает врачом."],
 ex:[["Я звоню маме.","ya zva-NYU MAH-myeh","I am calling my mum."],["Я работаю с другом.","ya ra-BOH-ta-yu s DROO-gam","I work with a friend."],["Мне нравится этот город.","mnyeh NRAH-veet-sya EH-tat GOH-rat","I like this city."]],v:["p|Family & people","p|Work & study"],
 x:[["type","I like this city.","Мне нравится этот город.","dat"],["cloze","Я звоню ___. (мама)","маме","dat"],["cloze","Я иду к ___. (врач)","врачу","dat"],["cloze","Я пью чай с ___. (лимон)","лимоном","ins"],["cloze","Я работаю с ___. (друг)","другом","ins"],["cloze","Я гуляю с ___. (сестра)","сестрой","ins"],["cloze","Он работает ___. (врач)","врачом","ins"],["fix","Я работаю с друг.","Я работаю с другом.","ins","с (with) takes the instrumental: друг becomes другом."],["tiles","Мне нужна помощь.","I need help.","dat"]]},
{id:"c17",lvl:"A2",t:"Past and future",min:8,obj:"I can talk about yesterday and tomorrow.",
 intro:"Past and future are simpler than the present. The past has one ending per gender and no person endings at all.",
 pts:["Past: take off -ть and add -л (m), -ла (f), -ло (n), -ли (plural). читать → он читал, она читала, мы читали.","быть: был, была, было, были. Вчера я был дома.","Future of быть: я буду, ты будешь, он будет, мы будем, вы будете, они будут.","Future with a verb: я буду работать = I will be working.","The same verb form is used for I, you, he in the past. Only gender and number show who did it."],
 ex:[["Вчера я работал.","fchee-RAH ya ra-BOH-tal","Yesterday I worked."],["Завтра я буду дома.","ZAHF-tra ya BOO-doo DOH-ma","Tomorrow I will be at home."],["Она читала книгу.","a-NAH chee-TAH-la KNEE-goo","She was reading a book."]],v:["p|Time & plans"],
 x:[["cloze","Вчера я ___ на работе. (быть, I am a man)","был","past"],["cloze","Вчера она ___ дома. (быть)","была","past"],["cloze","Мы ___ в Москве. (быть, past)","были","past"],["cloze","Он ___ книгу. (читать, past)","читал","past"],["cloze","Завтра я ___ дома. (быть)","буду","fut"],["cloze","Завтра мы ___ работать. (быть)","будем","fut"],["type","I worked yesterday. (a man)","Вчера я работал.","past"],["tiles","Завтра я буду работать.","Tomorrow I will work.","fut"],["fix","Вчера я работать.","Вчера я работал.","past","Past tense: drop -ть and add -л for a man."]]},
{id:"c18",lvl:"A2",t:"Aspect: ongoing or finished",min:9,obj:"I can choose between imperfective and perfective verbs.",
 intro:"Most Russian verbs come in pairs. One form describes an action as a process or habit, the other as a single completed result. This is the biggest difference from English.",
 pts:["Imperfective: process, repetition, background, how long. Я читал книгу весь вечер. Я каждый день пью кофе.","Perfective: one finished action with a result. Я прочитал книгу. Я выпил кофе.","A perfective verb has no present tense. Its present-looking form means the future: Я прочитаю = I will finish reading.","Common pairs: делать/сделать, читать/прочитать, писать/написать, покупать/купить, говорить/сказать, брать/взять, звонить/позвонить.","Clues for imperfective: каждый день, обычно, часто, весь вечер. Clues for perfective: уже, за два дня, вдруг."],
 ex:[["Я читал книгу весь вечер.","ya chee-TAHL KNEE-goo vyes VYEH-cheer","I was reading the book all evening."],["Я прочитал книгу.","ya pra-chee-TAHL KNEE-goo","I finished the book."],["Я куплю хлеб.","ya koop-LYU khlyep","I will buy bread."]],v:["p|Feelings & opinions"],
 x:[["pick","I was reading a book all evening.",["читал","прочитал"],"читал","aspect"],["pick","I finished reading the book.",["читал","прочитал"],"прочитал","aspect"],["cloze","Вчера я весь вечер ___ книгу. (читать, past, ongoing)","читал","aspect"],["cloze","Я ___ книгу за два дня. (finished it, man)","прочитал","aspect"],["cloze","Завтра я ___ эту книгу. (прочитать, will finish)","прочитаю","aspect"],["type","I will buy bread.","Я куплю хлеб.","aspect"],["type","I was buying bread. (a man)","Я покупал хлеб.","aspect"],["cloze","Я ___ тебе завтра. (позвонить, will call)","позвоню","aspect"]]},
{id:"c19",lvl:"A2",t:"Motion verbs",min:9,obj:"I can talk about going and travelling, now and in general.",
 intro:"Russian has separate verbs for going on foot and going by transport, and each comes in two types: one trip now, or habit and round trips.",
 pts:["идти (on foot, now, one direction) and ходить (on foot, habit or round trip). Я иду домой. Я хожу в офис каждый день.","ехать (by transport, now) and ездить (by transport, habit or round trip). Мы едем в Москву. Он часто ездит в Москву.","Past of ходить means went and came back: Вчера мы ходили в кино. Past of идти means was on the way: Он шёл домой.","Prefixes add direction: при- arrive (приходить), у- leave (уходить). пойти = set off: Давай пойдём в кино.","Where to uses в or на + accusative: Я еду на вокзал."],
 ex:[["Я иду домой.","ya ee-DOO da-MOY","I am walking home."],["Мы едем в Москву.","my YEH-dyem v mask-VOO","We are travelling to Moscow."],["Он часто ездит в Москву.","ohn CHAH-sta YEZ-deet v mask-VOO","He often goes to Moscow."]],v:["v|Travel & documents","p|Travel & health"],
 x:[["cloze","Я ___ домой. (идти, now)","иду","motion"],["cloze","Мы ___ в Москву. (ехать, now)","едем","motion"],["cloze","Я каждый день ___ в офис. (ходить, on foot)","хожу","motion"],["cloze","Он часто ___ в Москву. (ездить)","ездит","motion"],["cloze","Вчера мы ___ в кино. (ходить, past)","ходили","motion"],["pick","Which? Я люблю ___ пешком.",["идти","ходить"],"ходить","motion"],["type","I am going home.","Я иду домой.","motion"],["type","We are going to Kazan by train.","Мы едем в Казань на поезде.","motion"]]},
{id:"c20",lvl:"A2",t:"Reflexive verbs and daily routine",min:8,obj:"I can describe my day and use common reflexive verbs.",
 intro:"The ending -ся or -сь points the action back at the subject, or makes a verb intransitive. Many everyday verbs need it.",
 pts:["-сь after a vowel, -ся after a consonant: я учусь, он учится.","Common reflexive verbs: учиться (study), встречаться (meet), заниматься (be engaged in), интересоваться (be interested in), открываться (open).","They keep their normal endings: мы встречаемся, ты занимаешься. Verbs like заниматься and интересоваться take the instrumental: Я занимаюсь спортом.","учить takes an object: Я учу слова. учиться means to study: Я учусь в университете.","Routine words: сначала, потом, обычно, иногда, часто, редко."],
 ex:[["Я учусь каждый день.","ya oo-CHOOS KAHZH-dyy dyen","I study every day."],["Мы встречаемся в шесть.","my fstree-CHAH-yem-sya f shest","We are meeting at six."],["Я встаю в семь часов.","ya fsta-YU f syem chee-SOHF","I get up at seven o'clock."]],v:["v|Adverbs of time, place & frequency"],

{id:"c21",lvl:"A2",t:"Modals, requests and would",min:9,obj:"I can ask permission, give polite instructions and say what I would like.",
 intro:"A small set of words lets you say need, may, must and would like. They are the key to polite, useful Russian.",
 pts:["Мне нужно, надо or можно + infinitive: Мне нужно идти. Здесь можно сидеть? Здесь нельзя курить.","мочь is can in the sense of be able. уметь is to know how: Я умею плавать.","должен agrees with the speaker: Я должен (m), Я должна (f).","Imperatives: formal or plural ending -йте or -ите: Читайте, Говорите, Помогите. Informal: Читай, Говори, Помоги.","Would: past tense + бы. Я хотел бы кофе (man), Я хотела бы чай (woman). Polite request: Не могли бы вы помочь?"],
 ex:[["Мне нужно идти.","mnyeh NOOZH-na eet-TEE","I need to go."],["Говорите медленнее.","ga-va-REE-tyeh MYED-lee-nyeh-yeh","Speak more slowly."],["Не могли бы вы помочь?","nee mag-LEE by vy pa-MOCH","Could you help me?"]],v:["v|Modal words"],

{id:"c23",lvl:"B1",t:"Connect your ideas",min:9,obj:"I can link sentences with because, so, although and who, and give opinions.",

 pts:["потому что = because, поэтому = so. Я дома, потому что болею. Болею, поэтому я дома.","но = but. а contrasts two things: Я студент, а он врач.","если = if, когда = when, хотя = although, чтобы = in order to + infinitive.","который = who or which. It agrees with the noun it refers to: Это человек, который живёт рядом.","Opinions: Я думаю, что... По-моему,... Мне кажется, что..."],

function vProgress(){
 const now=Date.now(),cs=Object.keys(S.cards).filter(id=>S.cards[id].b>0);
 const dueNow=cs.filter(isDue).length,d1=cs.filter(id=>S.cards[id].due>now&&S.cards[id].due<=now+DAY).length,d7=cs.filter(id=>S.cards[id].due>now+DAY&&S.cards[id].due<=now+7*DAY).length;

 <details class="how"><summary>How mastery is calculated</summary><div class="small stack">
 <p>Every item sits on a five-step ladder. Step 0 is new (0%). Step 1 returns in 10 minutes, step 2 in 1 day, step 3 in 3 days, step 4 in 7 days and step 5 in 16 days. Item mastery is the step divided by five. A topic's mastery is the average of its items, counting unstarted ones as 0%.</p>
 <p>Good, Easy or a correct answer moves an item up one step. Hard keeps it. Again or a wrong answer drops it two steps and brings it back in about 10 minutes.</p>
 <p>Recognition alone cannot take an item above step 3. It needs at least two correct productions, where you type, build or recall it yourself. That is why the stages below matter.</p>
 <p><b>Recognised</b>: you picked the right meaning twice. <b>Recalled</b>: you produced it correctly twice. <b>Confident</b>: step 4 or higher with three correct productions.</p></div></details></section>
 <section class="card"><h2>What you can do with each word</h2><div class="stages">${STAT_ORDER.map(s=>`<div class="stg ${s}"><b>${cnt[s]}</b><span>${STATLAB[s]}</span></div>`).join('')}</div><div class="stbar" aria-hidden="true">${STAT_ORDER.map(s=>`<i class="${s}" style="flex:${cnt[s]}"></i>`).join('')}</div></section>`;
 const wt=weakTags(),kn=knownNotMade(),lc=leeches();
 h+=`<section class="card"><h2>Weak spots</h2>`;
 if(!wt.length&&!kn.length&&!lc.length)h+='<p class="muted">Nothing flagged yet. Bunova watches your recent answers by skill and lists repeated problems here.</p>';
 else{Object.keys(GROUPS).forEach(g=>{const xs=wt.filter(w=>TAGS[w.tag][1]===g);if(xs.length)h+=`<div class="eyebrow">${GROUPS[g]}</div><div class="list">${xs.map(w=>`<div class="row sp"><span>${esc(TAGS[w.tag][0])} <span class="small muted">· ${Math.round(w.rate*100)}% missed recently</span></span><button class="btn alt sm" data-act="targeted" data-tag="${w.tag}">Practise</button></div>`).join('')}</div>`;});
  if(kn.length)h+=`<div class="row sp"><span>${kn.length} items recognised but never produced</span><button class="btn alt sm" data-act="pStart" data-go="1">Produce them</button></div>`;
  if(lc.length)h+=`<div class="row sp"><span>${lc.length} items forgotten 3+ times</span><button class="btn alt sm" data-act="leechStart" data-go="1">Practise</button></div>`;}
 h+='</section>';
 h+=`<section class="card"><h2>Upcoming reviews</h2><div class="stat"><div><b>${dueNow}</b><span>due now</span></div><div><b>${d1}</b><span>next 24 hours</span></div><div><b>${d7}</b><span>next 7 days</span></div></div></section>`;
 [['p','Everyday phrases'],['v','Words and connectors']].forEach(([col,name])=>{h+=`<section class="card"><h2>${name}</h2><div class="list tight">`+CATS.filter(c=>c.col===col).map(c=>{const p=Math.round(catMastery(c)*100),st=c.ids.filter(id=>!isNew(id)).length;
  return `<div><div class="row sp"><span>${esc(c.topic)}</span><b>${p}%</b></div><div class="bar" role="img" aria-label="${esc(c.topic)} mastery ${p}%"><i style="width:${p}%"></i></div><div class="small muted">${st} of ${c.ids.length} started</div></div>`;}).join('')+`</div></section>`;});
 const days=[];for(let k=6;k>=0;k--)days.push(Date.now()-k*DAY);const mx=Math.max(1,...days.map(t=>S.days[dkey(t)]||0));
 h+=`<section class="card"><h2>Last 7 days</h2><div class="days" role="img" aria-label="Answers per day over the last week">${days.map(t=>{const v=S.days[dkey(t)]||0;return `<div><span>${v}</span><i style="height:${Math.round(v/mx*70)}%"></i><span>${new Date(t).toLocaleDateString('en-GB',{weekday:'short'})}</span></div>`;}).join('')}</div></section>`;
 h+=`<section class="card"><h2>Achievements</h2><div class="ach">${ACH.map(a=>`<div class="a${S.ach[a[0]]?' on':''}"><b>${esc(a[1])}</b><span class="small muted">${esc(a[2])}</span></div>`).join('')}</div></section>`;
 const K={flash:'Flashcards',listen:'Listening',test:'Test',lesson:'Lesson',mixed:'Mixed practice',targeted:'Targeted practice',read:'Reading',place:'Placement',plan:'Daily session'};
 h+=`<section class="card"><h2>Review history</h2>${S.hist.length?`<div class="list tight">${S.hist.slice(0,8).map(x=>`<div class="row sp"><span>${K[x.k]||x.k} · ${fmtDate(x.t)}</span><b>${x.ok} / ${x.n}</b></div>`).join('')}</div>`:'<p class="muted">Sessions you finish will appear here.</p>'}</section>
 <section class="card"><h2>Test scores</h2>${S.tests.length?`<div class="list tight">${S.tests.slice(0,8).map(x=>`<div class="row sp"><span>${fmtDate(x.t)} · ${x.n} questions · ${x.col==='p'?'phrases':x.col==='v'?'words':x.col==='done'?'my lessons':'everything'}</span><b>${Math.round(x.score/x.n*100)}%</b></div>`).join('')}</div>`:'<p class="muted">Take a test to see scores here.</p>'}</section>

let AC=null;
function sfx(kind){if(S.set.snd===false)return;const vol=clamp01(S.set.fv,.7);if(vol<=0)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=AC||new C();if(AC.state==='suspended')AC.resume();
 if(kind==='coin'){ /* ka-ching: two quick bright notes with a soft shimmer, about a third of a second */
  [[988,0,.09,'triangle',.11],[1319,.08,.34,'triangle',.11],[2638,.08,.22,'sine',.025],[3951,.1,.16,'sine',.012]].forEach(([f,t,d,ty,pk])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+t;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(pk*vol,t0+.006);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.start(t0);o.stop(t0+d+.02);});return;}
 const seq={ok:[[660,0],[880,.09]],no:[[260,0],[200,.12]],win:[[523,0],[659,.1],[784,.2],[1047,.3]]}[kind]||[];
 seq.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='no'?'triangle':'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+t;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.0002,.14*vol),t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.22);o.start(t0);o.stop(t0+.25);});}catch(e){}}
function confetti(n){try{const host=document.createElement('div');host.className='confetti';host.setAttribute('aria-hidden','true');const cols=['#58cc02','#1cb0f6','#ffc800','#ff9600','#ce82ff','#ff4b4b'];
 for(let i=0;i<(n||60);i++){const s=document.createElement('i');s.style.cssText='left:'+Math.random()*100+'%;background:'+cols[i%6]+';animation-delay:'+Math.random()*.5+'s;animation-duration:'+(1.8+Math.random()*1.4)+'s;--x:'+Math.round(Math.random()*160-80)+'px;--r:'+Math.round(Math.random()*720)+'deg';host.appendChild(s);}
 document.body.appendChild(host);setTimeout(()=>{try{host.remove();}catch(e){}},4200);}catch(e){}}

function navigate(r,opts){opts=opts||{};if(ui.run&&!opts.force)return;ui.route=r;if(!opts.keep){ui.lesson=null;ui.passage=null;if(r!=='study')ui.prac.mode='menu';}
 stopAudio();setHash(r);render();top();}
window.addEventListener('hashchange',()=>{if(skipHash){skipHash=false;return;}if(ui.run)return;ui.route=routeNow();ui.lesson=null;ui.passage=null;ui.prac.mode='menu';render();top();});

/* ---------- runner helpers ---------- */
function setAnswerVal(){const a=$('#ans');return a?a.value:'';}
function check(){const r=ui.run,t=cur(),st=r.st;if(st.checked)return;let val;
 if(t.k==='tiles'){val=(st.sel||[]).map(i=>t.tiles[i]);if(!val.length)return;}
 else if(t.k==='pick'||t.k==='listen'||t.k==='stress'){if(st.val===undefined)return;val=st.val;}
 else{val=setAnswerVal();if(!String(val).trim())return;}
 commit(t,evalTask(t,val),val);sfx(ui.run.st.ok?'coin':'no');render();}
function afterCheckScroll(){const f=document.querySelector('.fb');if(f&&f.scrollIntoView){try{f.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}}}
function endRun(){ui.run=null;stopAudio();render();top();}
function startFlash(){const p=ui.prac,pool=ITEMS.filter(topicFilter(p.col,p.topic));if(!pool.length)return;
 const due=pool.filter(i=>isDue(i.id)).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due),fresh=pool.filter(i=>isNew(i.id)),rest=shuffle(pool.filter(i=>!isDue(i.id)&&!isNew(i.id))).sort((a,b)=>mast(a.id)-mast(b.id));
 const ids=due.concat(fresh.slice(0,Math.max(3,Math.ceil(p.size/3))),rest).map(i=>i.id).filter((x,i,a)=>a.indexOf(x)===i).slice(0,p.size);
 const tasks=ids.map(id=>{const k=p.dir==='recog'?'card-r':p.dir==='recall'?'card-p':(step(id)>=2?'card-p':'card-r');return itemTask(id,k);});
 startRun({title:'Flashcards',tasks:shuffle(tasks),mode:'mixed',kind:'flash'});}
function startListen(){const p=ui.prac,pool=ITEMS.filter(topicFilter(p.col,p.topic));
 const ids=shuffle(pool).sort((a,b)=>(S.cards[a.id]?0:1)-(S.cards[b.id]?0:1)||mast(a.id)-mast(b.id)).slice(0,p.size);
 const tasks=ids.map((it,k)=>itemTask(it.id,k%3===2&&itemKinds(it.id).includes('dict')?'dict':'listen'));
 startRun({title:'Listening practice',tasks,mode:'mixed',kind:'listen'});}
function startProduce(){const p=ui.prac;let ids=knownNotMade();if(ids.length<6){const seen=ITEMS.filter(i=>S.cards[i.id]&&S.cards[i.id].seen&&topicFilter(p.col,p.topic)(i)).map(i=>i.id);ids=ids.concat(shuffle(seen.filter(id=>!ids.includes(id))));}
 if(ids.length<1){toast('Learn a few words first, then production drills will unlock.');return;}
 startRun({title:'Production drill',tasks:itemTasks(ids,PRODKINDS,p.size),mode:'mixed',kind:'mixed'});}

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,d=a.dataset;
 if(act==='goTest'){e.preventDefault();navigate('test');return;}
 const r=ui.run;
 switch(act){
 case 'say':say(d.t,!!d.slow,false,d.who||undefined);return;
 case 'aPause':pauseAudio();return;
 /* runner */
 case 'rClose':r.close=true;render();return;
 case 'rCloseNo':r.close=false;render();return;
 case 'rCloseYes':endRun();return;
 case 'rReveal':r.st.shown=true;render();return;
 case 'rGrade':gradeCard(+d.g);render();top();return;
 case 'rPick':{const t=cur();if(r.st.checked)return;r.st.val=t.opts[+d.i];check();afterCheckScroll();return;}
 case 'rSyl':{if(r.st.checked)return;r.st.val=d.i;check();afterCheckScroll();return;}
 case 'rTile':{const t=cur();if(r.st.checked)return;const sel=r.st.sel||(r.st.sel=[]),i=+d.i,k=sel.indexOf(i);if(k>=0)sel.splice(k,1);else sel.push(i);render();return;}
 case 'rCheck':check();afterCheckScroll();return;
 case 'rSkip':{const t=cur();if(r.st.checked)return;commit(t,{ok:false,ans:String(t.ans).split('|')[0]},'');sfx('no');render();afterCheckScroll();return;}
 case 'rNext':nextTask();render();top();return;
 case 'rAgain':{const m=(r.miss||[]).slice(0,20);if(!m.length){endRun();return;}startRun({title:'Practising your mistakes',tasks:m.map(t=>Object.assign({},t,{retry:0})),mode:'mixed',kind:'targeted'});render();top();return;}
 case 'rDone':endRun();return;
 case 'rNextLesson':ui.run=null;ui.route='learn';ui.lesson=d.id;setHash('learn');render();top();return;
 case 'targeted':{const rs=startRun({title:'Targeted: '+TAGS[d.tag][0],tasks:tasksForTag(d.tag,12),mode:'mixed',kind:'targeted'});if(rs){render();top();}return;}
 case 'kbToggle':S.set.kb=!S.set.kb;save();{const v=setAnswerVal();render();const el=$('#ans');if(el){el.value=v;}}return;
 case 'kbKey':{const el=$('#ans');if(el&&!el.disabled){el.value+=d.ch;el.focus();}return;}
 case 'kbDel':{const el=$('#ans');if(el&&!el.disabled){el.value=el.value.slice(0,-1);el.focus();}return;}
 }
 if(ui.run)return;
 switch(act){
 case 'setLen':S.set.len=+d.v;save();render();return;
 case 'startPlan':{const p=planSession(S.set.len);if(p&&startRun({title:'Your '+S.set.len+'-minute session',tasks:p.tasks,mode:'mixed',kind:'plan'})){render();top();}return;}
 case 'placement':if(startPlacement()){render();top();}return;
 case 'openLesson':ui.route='learn';ui.lesson=d.id;setHash('learn');render();top();return;
 case 'lessonBack':ui.lesson=null;render();top();return;
 case 'lessonPractice':{const l=LESSONS.find(x=>x.id===d.id);if(startRun({title:l.t,tasks:lessonTasks(l),mode:'lesson',lid:l.id,kind:'lesson'})){render();top();}return;}
 case 'lessonSkip':{const l=LESSONS.find(x=>x.id===d.id);S.les[l.id]={s:100,t:Date.now(),placed:true};checkAch();save();ui.lesson=null;toast('Marked as known. Its words stay available to practise.');render();top();return;}
 case 'setP':{const k=d.k,v=d.v;ui.prac[k]=(k==='size')?+v:v;if(k==='col')ui.prac.topic='all';if(k==='wcol')ui.prac.wtopic='all';render();return;}
 case 'setSnd':S.set.snd=d.v==='1';save();render();if(S.set.snd)sfx('coin');return;
 case 'setSpeech':S.set.speech=d.v==='1';if(!S.set.speech)stopAudio();save();render();return;
 case 'setAuto':S.set.auto=d.v==='1';save();render();return;
  case 'setVp':S.set.vp=d.v;save();render();return;
 case 'fStart':startFlash();render();top();return;
 case 'lStart':startListen();render();top();return;
 case 'pStart':startProduce();render();top();return;
 case 'leechStart':{const ids=leeches();if(ids.length&&startRun({title:'Stubborn words',tasks:itemTasks(ids,['cloze','tiles','type','dict'],12),mode:'mixed',kind:'targeted'})){render();top();}return;}
 case 'wStart':ui.prac.mode='words';render();top();return;
 case 'pBack':ui.prac.mode='menu';render();top();return;
 case 'openPassage':ui.route='read';ui.passage=d.id;ui.hideText=false;setHash('read');render();top();return;
 case 'passBack':ui.passage=null;stopAudio();render();top();return;
 case 'hideToggle':ui.hideText=!ui.hideText;render();return;
 case 'playAll':{const pg=READING.find(p=>p.id===ui.passage);sayAll(pg.lines.map(l=>({t:l[1],w:lineWho(pg,l)})),false);return;}
 case 'gloss':{const pg=READING.find(p=>p.id===ui.passage),w=nr(d.w),g=$('#gl');
  const m=pg.gloss[w]||pg.gloss[d.w.toLowerCase().replace(/[.,!?;:«»—]/g,'')]||(BY[(ITEMS.find(i=>nr(i.ru)===w)||{}).id]||{}).en;
  g.innerHTML=`<b lang="ru">${esc(d.w.replace(/[.,!?;:«»—]/g,''))}</b> · ${m?esc(m):'<span class="muted">no gloss for this form; check the translation under the line</span>'}`;say(d.w.replace(/[.,!?;:«»—]/g,''),false,1);return;}
 case 'passQuiz':{const pg=READING.find(p=>p.id===d.id);
  const ts=pg.q.map(q=>q[0]==='pick'?{k:'pick',q:q[1],opts:shuffle(q[2].slice()),ans:q[3],tag:'read'}:{k:'type',q:q[1],ans:q[2],tag:q[3]||'read',tol:true,lang:'en'});
  if(startRun({title:pg.t,tasks:ts,mode:'read',rid:pg.id,kind:'read'})){render();top();}return;}
 case 'tType':{ui.test.types[d.k]=!ui.test.types[d.k];if(!Object.values(ui.test.types).some(Boolean))ui.test.types.mc=true;render();return;}
 case 'setT':{const v=d.k==='n'?+d.v:d.v;ui.test[d.k]=v;render();return;}
 case 'tStart':{if(buildExam()){render();top();}else toast('Complete a few lessons first, or choose Everything.');return;}
 case 'resetAsk':ui.confirmReset=true;render();return;
 case 'resetNo':ui.confirmReset=false;render();return;
 case 'resetYes':try{localStorage.removeItem(KEY);}catch(x){}loadState();ui.confirmReset=false;toast('Progress erased.');render();top();return;
 }
});

/* ---------- inputs ---------- */
document.addEventListener('change',e=>{const vk=e.target.dataset&&e.target.dataset.vol;if(vk){S.set[vk]=clamp01(+e.target.value/100,1);save();if(vk==='fv')sfx('coin');return;}const s=e.target.dataset&&e.target.dataset.sel;if(!s)return;
 if(s==='ptopic')ui.prac.topic=e.target.value;else if(s==='wtopic')ui.prac.wtopic=e.target.value;
 render();});
document.addEventListener('input',e=>{const vk=e.target.dataset&&e.target.dataset.vol;if(vk){S.set[vk]=clamp01(+e.target.value/100,1);if(vk==='sv'&&player)player.volume=speechVol();const o=e.target.parentNode.querySelector('output');if(o)o.textContent=e.target.value+'%';return;}if(e.target.id==='wq'){ui.prac.q=e.target.value;const l=$('#wl');if(l)l.innerHTML=wordsList();}});
document.addEventListener('pointerdown',e=>{unlockAudio();try{if(AC&&AC.state==='suspended')AC.resume();}catch(x){}
 const b=e.target.closest&&e.target.closest('[data-act="say"]');if(b)prefetch(b.dataset.t,b.dataset.who||undefined,!!b.dataset.slow);},{passive:true});
document.addEventListener('keydown',e=>{unlockAudio();},{capture:true});
document.addEventListener('keydown',e=>{
 if(!ui.run||ui.run.done)return;const r=ui.run,t=cur(),st=r.st;
 if(e.key==='Enter'){e.preventDefault();
  if(st.checked){if(t.k!=='card'){nextTask();render();top();}return;}
  if(t.k==='card'&&!st.shown){st.shown=true;render();return;}
  if(t.k!=='card')check();return;}
 if(t.k==='card'){
  if(e.key===' '&&!st.shown){e.preventDefault();st.shown=true;render();return;}
  if(st.shown&&'1234'.includes(e.key)&&e.key.length===1){gradeCard(+e.key-1);render();}}
});
$('#tPh').addEventListener('click',()=>{S.set.ph=!S.set.ph;save();render();});

/* ---------- boot ---------- */
loadState();checkAch();try{$('#logo').innerHTML=bunny('happy','logo');}catch(e){}
ui.route=routeNow();render();
})();
</script>
</body></html>
