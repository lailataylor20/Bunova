name: Diagnose Bunova preview build
on:
  push:
    branches:
      - visual/storybook-study-refresh
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Validate Worker JavaScript
        run: npm run check
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/bunova-build
